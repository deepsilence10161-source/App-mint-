<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080B14">
<meta name="description" content="App Mint Studio — design an Android app from your phone. Free, offline, no account, no AI.">
<title>App Mint Studio</title>
<style>/*__CSS__*/</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <span class="mark" aria-hidden="true"></span>
    <div class="identity">
      <div class="name" id="projname">Loading…</div>
      <span class="meta" id="projmeta">starting up</span>
    </div>
    <button class="btn ghost sm" id="themebtn" aria-label="Switch colour mode">Dark mode</button>
    <button class="btn ghost sm" id="importproj" aria-label="Import a specification">Import</button>
    <button class="btn primary sm" id="newproj" aria-label="New project">New</button>
  </header>

  <div class="health" id="health" role="status" aria-live="polite"></div>

  <main id="main">
    <div class="empty">
      <div class="big">Starting up…</div>
      <p>If this message stays, the browser blocked the scripts.</p>
    </div>
  </main>
</div>

<nav class="tabbar" role="tablist" aria-label="Sections">
  <div class="inner"></div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
/*__ENGINE__*/
/*__APP__*/
window.__appmintBoot(window.__appmintTemplates);
</script>
</body>
</html>
