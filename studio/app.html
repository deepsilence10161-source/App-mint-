<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080B14">
<meta name="description" content="App Mint Studio — design an Android app from your phone. Free, offline, no account, no AI.">
<title>App Mint Studio</title>
<style>/* ══════════════════════════════════════════════════════════════════════
   APP MINT STUDIO — the interface
   ══════════════════════════════════════════════════════════════════════

   Written for a phone held in one hand. That decision drives everything here:

   · Every control a thumb has to hit is at least 44px tall, and the ones
     people use constantly are 48–56px.
   · Text inputs are 16px, because anything smaller makes iOS zoom the page
     when the keyboard opens.
   · Nothing important lives in the top quarter of the screen, which is where
     a thumb cannot reach.
   · Sections start collapsed and show their current value. A settings screen
     that opens everything at once is a wall of text to scroll past, and the
     thing you came for is always at the bottom.

   The palette is deliberately calm: one accent colour that means "this is
   interactive", and colour used for meaning (a problem, a success) rather than
   decoration. The project's own colours never appear here, so what you are
   designing can never be confused with the tool you are designing it in.
   ══════════════════════════════════════════════════════════════════════ */

:root {
  color-scheme: dark;

  --bg:        #080B14;
  --bg-glow:   #101832;
  --surface:   #111827;
  --surface-2: #182032;
  --surface-3: #1F2940;

  --line:      rgba(255, 255, 255, 0.075);
  --line-2:    rgba(255, 255, 255, 0.13);

  --fg:        #EEF2FB;
  --fg-2:      #A3AEC6;
  --fg-3:      #6C7793;

  --accent:    #6D6AF8;
  --accent-2:  #22D3EE;
  --accent-soft: rgba(109, 106, 248, 0.16);
  --accent-line: rgba(109, 106, 248, 0.45);

  --ok:   #34D399;
  --warn: #FBBF24;
  --bad:  #F87171;

  --r-sm: 10px;
  --r:    14px;
  --r-lg: 20px;
  --r-xl: 26px;

  --s1: 4px;  --s2: 8px;  --s3: 12px;
  --s4: 16px; --s5: 24px; --s6: 32px;

  --sh-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --sh-2: 0 14px 34px -14px rgba(0, 0, 0, 0.75);

  --tabbar-h: 74px;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

/* A soft light behind the top of the page. It stops the very dark background
   reading as flat and gives the header somewhere to sit. */
body::before {
  content: "";
  position: fixed;
  inset: -40% 0 auto 0;
  height: 60vh;
  background: radial-gradient(60% 60% at 50% 0%, var(--bg-glow) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

h1, h2, h3, p { margin: 0; }

button, input, select, textarea, a { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.app { position: relative; z-index: 1; }

/* ── the header ─────────────────────────────────────────────────────── */

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background: linear-gradient(180deg, rgba(8, 11, 20, 0.94), rgba(8, 11, 20, 0.78));
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border-bottom: 1px solid var(--line);
}

.mark {
  width: 38px; height: 38px; flex: 0 0 auto;
  border-radius: 12px;
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  box-shadow: 0 6px 16px -6px rgba(109, 106, 248, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

.identity { min-width: 0; flex: 1 1 auto; }
.identity .name {
  font-size: 16.5px; font-weight: 700; letter-spacing: -0.015em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.identity .meta {
  display: block; font-size: 11.5px; color: var(--fg-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}

.topbar .btn.small { flex: 0 0 auto; }

/* ── the status strip ───────────────────────────────────────────────── */

.health {
  position: sticky;
  top: calc(env(safe-area-inset-top) + 58px);
  z-index: 29;
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: 9px 14px;
  font-size: 12.5px;
  background: rgba(8, 11, 20, 0.9);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.health .spacer { flex: 1 1 auto; }
.health .val { color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 650;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
}
.pill::before {
  content: ""; width: 7px; height: 7px; border-radius: 999px; background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);
}
.pill.pass { color: var(--ok);   border-color: rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.1); }
.pill.warn { color: var(--warn); border-color: rgba(251, 191, 36, 0.35); background: rgba(251, 191, 36, 0.1); }
.pill.fail { color: var(--bad);  border-color: rgba(248, 113, 113, 0.4); background: rgba(248, 113, 113, 0.12); }

/* ── page ───────────────────────────────────────────────────────────── */

main {
  display: block;
  padding: var(--s4) 14px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px);
  scroll-padding-bottom: calc(var(--tabbar-h) + 40px);
  max-width: 640px;
  margin: 0 auto;
}

.tabpage { display: flex; flex-direction: column; gap: var(--s3); }

/* ── sections ───────────────────────────────────────────────────────── */

.card, .sec {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
}

.card { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }

.card > h2, .sec .sec-title {
  font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg-3);
}

/* The header of a section that can be folded away. It shows what is inside, so
   the answer is often readable without opening anything. */
.sec-head {
  display: flex; align-items: center; gap: var(--s3);
  width: 100%; min-height: 58px; padding: 10px 14px;
  background: none; border: 0; text-align: left; cursor: pointer;
  color: inherit;
}
.sec-head:active { background: var(--surface-2); }
.sec-ico {
  width: 34px; height: 34px; flex: 0 0 auto; border-radius: 11px;
  display: grid; place-items: center;
  background: var(--accent-soft); color: #C7C5FF;
}
.sec-ico svg { width: 18px; height: 18px; }
.sec-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.sec-name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
.sec-sub {
  font-size: 12.5px; color: var(--fg-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chev {
  flex: 0 0 auto; color: var(--fg-3);
  transition: transform 0.22s var(--ease);
}
.sec[data-open="1"] .chev { transform: rotate(180deg); }

.sec-body {
  display: none;
  padding: 0 14px 16px;
  flex-direction: column;
  gap: var(--s4);
}
.sec[data-open="1"] .sec-body { display: flex; }

/* ── fields ─────────────────────────────────────────────────────────── */

.field { display: flex; flex-direction: column; gap: 7px; }

.field > label {
  font-size: 13px; font-weight: 600; color: var(--fg-2);
  display: flex; align-items: center; gap: 6px;
}
.field .help {
  display: inline-grid; place-items: center;
  width: 15px; height: 15px; border-radius: 999px;
  font-size: 10px; font-weight: 700;
  background: var(--surface-3); color: var(--fg-3);
}

.sub { font-size: 12.5px; color: var(--fg-3); line-height: 1.45; }
.hint {
  font-size: 13px; color: var(--fg-2); line-height: 1.5;
  padding: 12px 14px; border-radius: var(--r);
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
}

input[type="text"], input[type="url"], input[type="number"],
input[type="email"], input[type="tel"], input[type="search"],
input[type="password"], select, textarea {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border-radius: var(--r);
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  color: var(--fg);
  font-size: 16px; /* below 16px, iOS zooms the page when a field is focused */
  appearance: none;
  -webkit-appearance: none;
  transition: border-color 0.16s, background 0.16s;
}
textarea { min-height: 104px; resize: vertical; line-height: 1.5; }

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface-3);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
input[aria-invalid="true"] { border-color: var(--bad); }

.selectwrap { position: relative; width: 100%; }
.selectwrap select { padding-right: 40px; cursor: pointer; }
.selectwrap::after {
  content: "";
  position: absolute; right: 16px; top: 50%;
  width: 8px; height: 8px;
  border-right: 2px solid var(--fg-3);
  border-bottom: 2px solid var(--fg-3);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.row { display: flex; gap: var(--s2); flex-wrap: wrap; }

/* a checkbox / switch on its own line */
.sw { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }

/* ── buttons ────────────────────────────────────────────────────────── */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 48px; padding: 0 18px;
  border-radius: var(--r);
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  color: var(--fg);
  font-size: 15px; font-weight: 650; letter-spacing: -0.005em;
  cursor: pointer;
  transition: transform 0.08s var(--ease), background 0.16s, opacity 0.16s;
  text-decoration: none;
}
.btn:active { transform: scale(0.977); }
.btn:disabled { opacity: 0.42; cursor: not-allowed; transform: none; }

.btn.primary {
  border-color: transparent;
  background: linear-gradient(180deg, #7B78FF, #5A57E4);
  color: #fff;
  box-shadow: 0 8px 20px -10px rgba(109, 106, 248, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.22);
}
.btn.ghost { background: transparent; border-color: var(--line-2); color: var(--fg-2); }
.btn.danger { background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.4); color: #FCA5A5; }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: var(--r-sm); }
.btn.sm { min-height: 38px; padding: 0 13px; font-size: 13.5px; border-radius: var(--r-sm); }
.btn.block { width: 100%; }

/* ── chips ──────────────────────────────────────────────────────────── */

.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 38px; padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  font-size: 13.5px; font-weight: 550;
  white-space: nowrap;
  cursor: pointer;
}
.chip.on {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: #fff;
  font-weight: 650;
}
.chip.pass { color: var(--ok); border-color: rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.1); }

/* ── the project picker ─────────────────────────────────────────────── */

.picker { display: flex; flex-direction: column; gap: var(--s2); }
.picker > p { color: var(--fg-2); font-size: 14px; margin-bottom: var(--s2); }

.tpl {
  display: flex; align-items: center; gap: var(--s3);
  width: 100%; min-height: 66px; padding: 12px 14px;
  text-align: left; cursor: pointer;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  transition: transform 0.08s var(--ease), background 0.16s;
}
.tpl:active { transform: scale(0.985); background: var(--surface-2); }
.tpl .tpl-ico {
  width: 42px; height: 42px; flex: 0 0 auto; border-radius: 13px;
  display: grid; place-items: center;
  background: linear-gradient(150deg, var(--surface-3), var(--surface-2));
  border: 1px solid var(--line-2);
  color: #C7C5FF;
}
.tpl .tpl-ico svg { width: 21px; height: 21px; }
.tpl .tpl-name { font-size: 15px; font-weight: 650; }
.tpl .tpl-desc { font-size: 12.5px; color: var(--fg-3); }

/* ── the tab bar ────────────────────────────────────────────────────── */

.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  background: rgba(10, 13, 24, 0.86);
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  border-top: 1px solid var(--line);
}
.tabbar .inner { display: flex; gap: 4px; max-width: 640px; margin: 0 auto; }
.tab {
  flex: 1 1 0; min-height: 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  padding: 6px 2px;
  border: 0; border-radius: var(--r);
  background: none; color: var(--fg-3);
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em;
  cursor: pointer;
  transition: color 0.16s, background 0.16s;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: #fff; background: var(--accent-soft); }
.tab:active { background: var(--surface-2); }

/* ── findings ───────────────────────────────────────────────────────── */

.findings { display: flex; flex-direction: column; gap: var(--s2); }
.finding {
  border-radius: var(--r);
  padding: 12px 14px;
  font-size: 13px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
}
.finding.err  { border-color: rgba(248, 113, 113, 0.45); background: rgba(248, 113, 113, 0.1); }
.finding.warn { border-color: rgba(251, 191, 36, 0.4);  background: rgba(251, 191, 36, 0.085); }
.finding-msg { line-height: 1.45; }
.finding-acts { display: flex; gap: var(--s2); margin-top: 10px; flex-wrap: wrap; }

/* ── the device preview ─────────────────────────────────────────────── */

.device { display: flex; flex-direction: column; gap: var(--s3); max-width: 340px; margin: 0 auto; }
.device-screen {
  position: relative;
  display: flex; flex-direction: column;
  min-height: 460px;
  border-radius: 30px;
  overflow: hidden;
  border: 1px solid var(--line-2);
  box-shadow: var(--sh-2), inset 0 0 0 6px #05070E;
}
.pv-caption { font-size: 12px; color: var(--fg-3); text-align: center; line-height: 1.5; }

/* the shell the Preview tab draws */
.screen {
  background: var(--surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--line-2);
  overflow: hidden;
}

/* ── the screen designer ────────────────────────────────────────────── */

.designer { display: flex; flex-direction: column; gap: var(--s3); }

.screen-chips { display: flex; gap: var(--s2); overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.screen-chips::-webkit-scrollbar { display: none; }
.screen-chips .chip { flex: 0 0 auto; }
.screen-chips .chip-n {
  font-size: 11px; font-variant-numeric: tabular-nums;
  background: rgba(255, 255, 255, 0.1); border-radius: 999px; padding: 1px 7px;
}

/* the component tree */
.tree { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.tree .node {
  margin-left: calc(var(--depth) * 10px);
  display: flex; align-items: center; gap: 4px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface-2);
  overflow: hidden;
}
.tree .node.on { border-color: var(--accent-line); background: var(--accent-soft); }
.tree .node-main {
  flex: 1 1 auto; min-width: 0; min-height: 50px;
  display: flex; flex-direction: column; justify-content: center; gap: 1px;
  padding: 8px 4px 8px 12px;
  background: none; border: 0; text-align: left; cursor: pointer;
}
.tree .node-name { font-size: 14px; font-weight: 650; }
.tree .node-id {
  font-size: 11.5px; color: var(--fg-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tree .node-acts { display: flex; gap: 2px; padding-right: 6px; }

.ibtn {
  width: 38px; height: 38px; flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  background: transparent; color: var(--fg-3);
  font-size: 15px; line-height: 1; cursor: pointer;
}
.ibtn:active { background: var(--surface-3); color: var(--fg); }

/* the palette */
.palette-groups { display: flex; gap: var(--s2); overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.palette-groups::-webkit-scrollbar { display: none; }
.palette-groups .chip { flex: 0 0 auto; }

.palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(142px, 1fr)); gap: var(--s2); }
.pitem {
  display: flex; align-items: center; gap: 10px;
  min-height: 62px; padding: 10px 12px;
  text-align: left; cursor: pointer;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface-2);
  transition: transform 0.08s var(--ease), border-color 0.16s;
}
.pitem:active { transform: scale(0.97); border-color: var(--accent-line); }
.pitem .pitem-ico {
  width: 32px; height: 32px; flex: 0 0 auto; border-radius: 10px;
  display: grid; place-items: center;
  background: linear-gradient(150deg, var(--surface-3), var(--surface-2));
  border: 1px solid var(--line-2);
  font-size: 14px; color: #C7C5FF;
}
.pitem-name { font-size: 13.5px; font-weight: 650; }
.pitem-sub { font-size: 11px; color: var(--fg-3); }

/* the property panel */
.inspector { display: flex; flex-direction: column; gap: var(--s4); }
.inspector .field { gap: 7px; }
.inspector label { font-size: 13px; font-weight: 600; color: var(--fg-2); }
.sub-field {
  display: flex; flex-direction: column; gap: 6px;
  padding-left: 12px; border-left: 2px solid var(--line-2);
}
.field.event { padding-top: var(--s4); border-top: 1px solid var(--line); }

.toggle {
  align-self: flex-start;
  min-height: 44px; padding: 0 18px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  font-size: 14px; font-weight: 600;
  cursor: pointer;
}
.toggle.on { border-color: var(--accent-line); background: var(--accent-soft); color: #fff; }

.colour-row { display: flex; gap: var(--s2); align-items: center; }
.colour-row input[type="color"] {
  width: 56px; height: 48px; flex: 0 0 auto; padding: 3px;
  border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface-2);
}
.swatch { display: flex; gap: var(--s2); align-items: center; }
.swatch input[type="color"] {
  width: 56px; height: 48px; flex: 0 0 auto; padding: 3px;
  border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface-2);
}

.sub.err { color: var(--bad); font-weight: 600; }

/* ── running build ──────────────────────────────────────────────────── */

.runrow {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  padding: 12px 14px; border-radius: var(--r); background: var(--surface-2);
}
.runrow .rname { font-weight: 650; font-size: 14px; }
.rstate { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
.rstate.success { color: var(--ok); }
.rstate.failure { color: var(--bad); }
.rstate.in_progress, .rstate.queued { color: var(--warn); }

.empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--s3);
  padding: var(--s6) var(--s4); text-align: center;
  border: 1px dashed var(--line-2); border-radius: var(--r-lg);
  background: var(--surface);
}
.empty .big { font-size: 17px; font-weight: 650; }
.empty p { color: var(--fg-3); font-size: 13.5px; max-width: 34ch; }

/* ── dialogs and toasts ─────────────────────────────────────────────── */

.sheet-back {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(4, 6, 12, 0.66);
  backdrop-filter: blur(3px);
  display: grid; place-items: end center;
  padding: 0;
}
.sheet {
  width: 100%; max-width: 560px;
  background: var(--surface);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  border-top: 1px solid var(--line-2);
  padding: var(--s5) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: var(--s4);
  max-height: 88vh; overflow: auto;
}
.sheet h2 { font-size: 18px; font-weight: 700; }

.toast {
  position: fixed;
  left: 50%; transform: translate(-50%, 20px);

/* ═══ engine/spec/toolchain.mjs ═══ */
/**
 * TOOLCHAIN PROFILES — single source of truth
 * ==========================================
 * Shared by the generator and the validator so the two can never disagree
 * about what a given AGP/Gradle pair can actually compile.
 *
 * Every version below was checked against Google Maven and services.gradle.org
 * on 2026-09-30. The `maxCompileSdk` values are the ones proven by a real build
 * in .github/workflows/ — not copied from a table.
 *
 * Why this exists at all: Google Play has required API 36 (Android 16) for new
 * apps and all updates since 31 Aug 2026, and AGP 8.4.x physically cannot
 * compile SDK 36. So "which toolchain" is a compliance question, not a taste
 * question.
 */

const TOOLCHAIN_PROFILES = {
  modern: {
    agp: '8.13.2',
    gradle: '8.13',
    buildTools: '36.0.0',
    jdk: '17',
    maxCompileSdk: 36,
    label: 'Modern — Play-compliant (compileSdk 36)',
  },
  bleeding: {
    agp: '9.4.1',
    gradle: '9.6.0',
    buildTools: '36.0.0',
    jdk: '17',
    maxCompileSdk: 37,
    label: 'Newest — AGP 9.x (compileSdk 37)',
  },
  legacy: {
    agp: '8.4.2',
    gradle: '8.6',
    buildTools: '34.0.0',
    jdk: '17',
    maxCompileSdk: 34,
    label: 'Legacy — compileSdk 34, NOT Play-compliant',
  },
};

const DEFAULT_PROFILE = 'modern';

/** Which profile does this AGP version belong to? */
function profileForAgp(agp) {
  if (!agp) return DEFAULT_PROFILE;
  for (const [name, p] of Object.entries(TOOLCHAIN_PROFILES)) {
    if (p.agp === agp) return name;
  }
  const major = parseInt(String(agp).split('.')[0], 10);
  if (major >= 9) return 'bleeding';
  if (major >= 8 && parseInt(String(agp).split('.')[1] || '0', 10) >= 9) return 'modern';
  return 'legacy';
}

/** Pick the lowest profile that can reach the requested compileSdk. */
function profileForCompileSdk(sdk) {
  const order = ['legacy', 'modern', 'bleeding'];
  for (const name of order) {
    if (TOOLCHAIN_PROFILES[name].maxCompileSdk >= sdk) return name;
  }
  return 'bleeding';
}

/** Resolve the effective toolchain for a spec: explicit toolchain wins. */
function resolveToolchain(spec) {
  const tc = (spec.build || {}).toolchain || {};
  const name = tc.agp ? profileForAgp(tc.agp) : profileForCompileSdk((spec.android || {}).compileSdk ?? 36);
  return { name, ...TOOLCHAIN_PROFILES[name], ...tc };

  search: '\u2315',
  menu: '\u2261',
  back: '\u2190',

function pick(obj, ...keys) {
  const out = {};
  for (const k of keys) if (obj[k]) out[k] = obj[k];
  return out;
}

/* ------------------------------------------------------------------ *
 * VALIDATION of a screen tree
 * ------------------------------------------------------------------ */
const MAX_DEPTH = 12;

/**
 * The value of a property, wherever it is allowed to be written.
 *
 * `a11yLabel` is the one property that may sit on the component itself or among
 * its props, because the editor treats it as belonging to the component rather
 * than to its appearance. Both places reach the generated app, so validation
 * has to look in both — otherwise a label that works is reported as missing.
 */
function effectiveProp(node, key) {
  if (!node) return undefined;
  if (key === 'a11yLabel') return node.a11yLabel ?? node.props?.a11yLabel;
  return node.props?.[key];
}

/**
 * Walk a screen's component tree and report every problem.
 * @returns {Array<issue>} issues with a precise path so the Studio can point at
 *          the exact component.
 */
function validateScreens(spec, out) {
  const screens = spec.screens || [];
  const nav = spec.navigation || {};

  // Unique screen ids
  const seen = new Set();
  for (const [i, s] of screens.entries()) {
    if (!s || typeof s !== 'object') { out.push(p('E_SCREEN_SHAPE', 'error', `screens[${i}]`, 'This screen is not a valid screen.')); continue; }
    if (!s.id) { out.push(p('E_SCREEN_ID', 'error', `screens[${i}].id`, 'This screen has no id.')); continue; }
    if (seen.has(s.id)) out.push(p('E_SCREEN_DUP', 'error', `screens[${i}].id`, `Two screens are both called "${s.id}".`));
    seen.add(s.id);
    if (!s.name) out.push(p('W_SCREEN_NAME', 'warning', `screens[${i}].name`, `Screen "${s.id}" has no display name.`));
  }

  if (screens.length > 0 && nav.type === 'none')
    out.push(p('W_NAV_MISSING', 'warning', 'navigation.type',
      `This app has ${screens.length} screen${screens.length === 1 ? '' : 's'} but no navigation, so there is no way to reach any of them.`,
      { fix: { kind: 'set', path: 'navigation.type', value: screens.length > 1 ? 'bottom-tabs' : 'stack' } }));

  if (nav.type === 'bottom-tabs') {
    const tabs = screens.filter((s) => s && s.showInTabs !== false);
    if (tabs.length < 2) out.push(p('W_TABS_THIN', 'warning', 'navigation.type', 'Bottom tabs with fewer than two screens leaves empty tabs.'));
    if (tabs.length > 5) out.push(p('E_TABS_MANY', 'error', 'navigation.type', `Bottom tabs support at most 5 items; ${tabs.length} screens are marked to appear there.`));
  }

  const screenIds = new Set(screens.map((s) => s && s.id).filter(Boolean));
  const componentIds = new Set(); // across the whole app, for the warning below
  const perScreenIds = new Map(); // screen id -> ids seen in that screen
  const usedCapabilities = new Set();

  for (const [si, screen] of screens.entries()) {
    if (!screen || !Array.isArray(screen.components)) continue;
    walk(screen.components, `screens[${si}].components`, 1);
  }

  function walk(nodes, basePath, depth) {
    if (depth > MAX_DEPTH) {
      out.push(p('E_NESTING', 'error', basePath, `This is nested more than ${MAX_DEPTH} levels deep. Such a layout is almost impossible to work with on a phone screen.`));
      return;
    }
    for (const [ci, node] of nodes.entries()) {
      const path = `${basePath}[${ci}]`;
      if (!node || typeof node !== 'object') { out.push(p('E_NODE', 'error', path, 'This component is not valid.')); continue; }

      const def = COMPONENTS[node.type];
      if (!def) {
        const near = nearComponents(node.type);
        out.push(p('E_UNKNOWN_COMPONENT', 'error', `${path}.type`,
          `"${node.type}" is not a component that exists.` + (near.length ? ` Did you mean ${near.map((n) => `"${n}"`).join(' or ')}?` : ''),
          { options: near, fix: near.length ? { kind: 'set', path: `${path}.type`, value: near[0], label: `Use ${near[0]}` } : undefined }));
        continue;
      }

      if (node.id) {
        const screenId = screenOf(path, screens) || '?';
        let inScreen = perScreenIds.get(screenId);
        if (!inScreen) { inScreen = new Set(); perScreenIds.set(screenId, inScreen); }
        if (inScreen.has(node.id)) {
          out.push(p('E_COMP_DUP_ID', 'error', `${path}.id`,
            `Two components in this screen are both called "${node.id}". The app keeps one view per name, so the second would silently take over the first one's behaviour.`,
            { reveal: { screen: screenId, nodeId: node.id }, fix: { kind: 'set', path: `${path}.id`, value: `${node.id}2` } }));
        } else if (componentIds.has(node.id)) {
          out.push(p('W_COMP_DUP_ID', 'warning', `${path}.id`,
            `A component in another screen is also called "${node.id}". This is allowed, but a distinct name will make the reports easier to follow.`));
        }
        inScreen.add(node.id);
        componentIds.add(node.id);
      }

      // Required properties
      for (const [key, propDef] of Object.entries(def.props || {})) {
        const value = effectiveProp(node, key);
        if (propDef.required && (value === undefined || value === null || value === ''))
          out.push(p('E_PROP_REQUIRED', 'error', `${path}.props.${key}`, `${def.label}: "${propDef.label}" must be filled in.`, { reveal: { screen: screenOf(path, screens), nodeId: node.id } }));
      }

      // Colour values must be real colours
      for (const [key, propDef] of Object.entries(def.props || {})) {
        if (propDef.type !== 'color') continue;
        const v = (node.props || {})[key];
        if (v && !/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(String(v)))
          out.push(p('E_PROP_COLOR', 'error', `${path}.props.${key}`, `"${v}" is not a colour. Use a value like #2563EB.`));
      }

      // Number ranges
      for (const [key, propDef] of Object.entries(def.props || {})) {
        if (propDef.type !== 'number') continue;
        const v = effectiveProp(node, key);
        if (v === undefined || v === '') continue;
        const n = Number(v);
        if (!Number.isFinite(n)) { out.push(p('E_PROP_NUMBER', 'error', `${path}.props.${key}`, `"${v}" is not a number.`)); continue; }
        if (propDef.min != null && n < propDef.min) out.push(p('E_PROP_RANGE', 'error', `${path}.props.${key}`, `${n} is below the minimum of ${propDef.min}.`));
        if (propDef.max != null && n > propDef.max) out.push(p('E_PROP_RANGE', 'error', `${path}.props.${key}`, `${n} is above the maximum of ${propDef.max}.`));
      }

      // Accessibility: an image with no label is a real defect, not a nitpick.
      if (def.a11y?.requiresLabel && !(node.a11yLabel || node.props?.a11yLabel))
        out.push(p('E_A11Y_IMAGE', 'error', `${path}.props.a11yLabel`,
          `${def.label}: describe this for someone using a screen reader. Android and Google Play both expect images to carry a description.`,
          { reveal: { screen: screenOf(path, screens), nodeId: node.id } }));

      // Events and their actions
      const events = def.events || [];
      for (const [ev, action] of Object.entries(node.events || {})) {
        if (!EVENTS[ev]) { out.push(p('W_UNKNOWN_EVENT', 'warning', `${path}.events.${ev}`, `"${ev}" is not something ${def.label} can do.`)); continue; }
        if (!events.includes(ev)) { out.push(p('W_EVENT_UNSUPPORTED', 'warning', `${path}.events.${ev}`, `${def.label} cannot respond to "${ev}".`)); continue; }
        if (!action || action.kind === 'none' || !action.kind) continue;
        const aDef = ACTIONS[action.kind];
        if (!aDef) { out.push(p('E_UNKNOWN_ACTION', 'error', `${path}.events.${ev}.kind`, `"${action.kind}" is not an action that exists.`)); continue; }
        for (const [key, pd] of Object.entries(aDef.props || {})) {
          const v = (action.props || {})[key];
          if (pd.required && (v === undefined || v === null || v === ''))
            out.push(p('E_ACTION_PROP', 'error', `${path}.events.${ev}.props.${key}`, `${def.label} → ${aDef.label}: "${pd.label}" must be filled in.`));
        }
        // Navigation targets must exist
        if (action.kind === 'navigate' && action.props?.screen && !screenIds.has(action.props.screen))
          out.push(p('E_NAV_TARGET', 'error', `${path}.events.${ev}.props.screen`, `No screen is called "${action.props.screen}".`));

        // Capability implications — the engine tells you when a screen needs a
        // capability you have not enabled, instead of failing at runtime.
        const caps = (spec.capabilities || []);
        if (action.kind === 'share' && !caps.includes('share')) usedCapabilities.add('share');
        if (action.kind === 'copy' && !caps.includes('clipboard')) usedCapabilities.add('clipboard');
        if (action.kind === 'upi' && !caps.includes('upi')) usedCapabilities.add('upi');
        if (action.kind === 'call' && !caps.includes('telephone')) usedCapabilities.add('telephone');
        if (action.kind === 'email' && !caps.includes('email')) usedCapabilities.add('email');
        if (action.kind === 'openApp' && !caps.includes('deepLinks')) usedCapabilities.add('deepLinks');
      }

      // Container rules
      if (def.container && !Array.isArray(node.children)) node.children = [];
      if (!def.container && Array.isArray(node.children) && node.children.length)
        out.push(p('E_NOT_CONTAINER', 'error', `${path}.children`, `${def.label} cannot contain other components. Put it inside a Group instead.`));
      if (Array.isArray(node.children)) walk(node.children, `${path}.children`, depth + 1);
    }
  }

  for (const cap of usedCapabilities)
    out.push(p('W_ACTION_NEEDS_CAP', 'warning', 'capabilities',
      `A screen uses the "${cap}" action but that capability is not enabled, so the button would do nothing.`,
      { fix: { kind: 'addArrayItem', path: 'capabilities', value: cap } }));
}

function screenOf(path, screens) {
  const m = /^screens\[(\d+)\]/.exec(path);
  if (!m) return null;
  const s = screens[Number(m[1])];
  return s ? s.id : null;
}

let CODE_N = 0;
function p(code, severity, path, message, extra = {}) {
  return { id: `${code}-${++CODE_N}`, code, severity, path, message, ...extra };
}

/* ------------------------------------------------------------------ *
 * ONE SOURCE OF TRUTH FOR BOOLEAN DEFAULTS
 *
 * The renderer has a fallback for every boolean it reads, and the editor needs
 * a starting value for every switch it draws. If these disagree the preview and
 * the app differ, which is the worst possible failure in a design tool. Rather
 * than trusting that two lists stay in step, this fills in the value the
 * renderer already uses, and a test checks the two against each other.
 * ------------------------------------------------------------------ */
for (const def of Object.values(COMPONENTS)) {
  for (const prop of Object.values(def.props || {})) {
    if (prop.type === 'boolean' && !('default' in prop)) prop.default = false;
  }
  // The walk already treats a missing flag as "cannot hold children". Saying so
  // explicitly means the editor's drop target and the validator agree without
  // either having to guess.
  if (!('container' in def)) def.container = false;
  if (!('a11y' in def)) def.a11y = { role: 'none' };
}

/* ------------------------------------------------------------------ *
 * PALETTE HELPERS
 *
 * The Studio draws its component palette from these, so the editor and the
 * generator read one definition. Adding a component to COMPONENTS above makes
 * it appear in the editor, validate the same way, and generate the same code,
 * with nothing else to update.
 * ------------------------------------------------------------------ */

/** The groups, in the order they should be shown. */
const GROUPS = (() => {
  const order = [];
  for (const def of Object.values(COMPONENTS)) if (!order.includes(def.group)) order.push(def.group);
  return order;
})();

/** True when this component must carry a screen-reader label. */
function needsLabel(name) {
  return Boolean(COMPONENTS[name]?.a11y?.requiresLabel);
}

/**
 * Every component as a flat list, in a fixed order (definition order, grouped).
 * Deterministic: the palette never reshuffles between page loads.
 */
function componentList() {
  return GROUPS.flatMap((group) => Object.entries(COMPONENTS)
    .filter(([, def]) => def.group === group)
    .map(([name, def]) => ({
      name,
      label: def.label || name,
      group,
      container: Boolean(def.container),
      single: Boolean(def.single),
      requiresLabel: Boolean(def.a11y?.requiresLabel),
      role: def.a11y?.role || 'none',
      props: def.props || {},
      events: def.events || [],
      actions: def.actions || [],
      help: def.help || null,
    })));
}

/** One component by name, or null. */
function findComponent(name) {
  const def = COMPONENTS[name];
  if (!def) return null;
  return componentList().find((c) => c.name === name) || { name, ...def };
}

/**
 * A short list of real components closest to a mistyped name.
 * Tolerates the ways people actually mistype: a prefix, a typo, or the
 * consonants only ("btn" for Button).
 */
function nearComponents(name, limit = 3) {
  const target = String(name || '').toLowerCase();
  if (!target) return [];
  const scored = [];
  for (const c of componentList()) {
    const cand = c.name.toLowerCase();
    let score = 0;
    if (cand === target) {
      score = 100;
    } else {
      // a typo, a missing letter or two letters swapped
      const d = editDistance(target, cand, 3);
      if (d <= 2) score = 80 - d * 10;
      else if (cand.startsWith(target)) score = 60;
      else if (cand.includes(target)) score = 40;
      else if (isSubsequence(target, cand)) {
        // "btn" is a subsequence of both Button and BottomNavigation. The one
        // it fills more of is the one the person meant.
        score = 20 + Math.round((target.length / cand.length) * 15);
      } else if (commonPrefix(target, cand) >= 3) score = 15;
    }
    if (score > 0) scored.push([score, cand.length, c.name]);
  }
  // highest score, then the shorter name, then alphabetical — a typo of a short
  // name is far more likely than a typo of a long one
  scored.sort((a, b) => b[0] - a[0] || a[1] - b[1] || a[2].localeCompare(b[2]));
  return scored.slice(0, limit).map(([, , n]) => n);
}

/**
 * Edit distance, stopping as soon as it is clear the answer is above `max`.
 * The bound is what makes this cheap enough to run over the whole library for
 * every unknown component.
 */
function editDistance(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let best = i;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      // a transposition counts as one mistake, which is how people type
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        cur[j] = Math.min(cur[j], (prev[j - 2] ?? 99) + 1);
      }
      if (cur[j] < best) best = cur[j];
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}

function isSubsequence(needle, hay) {
  let i = 0;
  for (const ch of hay) { if (ch === needle[i]) i++; if (i === needle.length) return needle.length >= 2; }
  return needle.length === 0;
}

/**
 * The closest real component to a name someone typed.
 * Used to turn "unknown component" into a useful suggestion instead of a wall.
 */
function suggestComponent(name) {
  return nearComponents(name, 1)[0] || null;
}

function commonPrefix(a, b) {
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  return i;
}

/* ------------------------------------------------------------------ *
 * HELPERS
 * ------------------------------------------------------------------ */
const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

function checkType(val, def, path, out) {
  switch (def.type) {
    case 'string':
      if (typeof val !== 'string') { out.push(issue('E_TYPE', 'error', path, `Expected text, got ${Array.isArray(val) ? 'list' : typeof val}.`)); return false; }
      if (def.minLength != null && val.length < def.minLength) out.push(issue('E_MINLEN', 'error', path, `Must be at least ${def.minLength} character(s).`));
      if (def.maxLength != null && val.length > def.maxLength) out.push(issue('E_MAXLEN', 'error', path, `Must be at most ${def.maxLength} characters (currently ${val.length}).`));
      if (def.pattern && !def.pattern.test(val)) out.push(issue('E_FORMAT', 'error', path, `"${val}" is not in the expected format.`));
      if (def.oneOf && !def.oneOf.includes(val)) out.push(issue('E_ENUM', 'error', path, `"${val}" is not one of: ${def.oneOf.join(', ')}.`, { options: def.oneOf }));
      if (def.members && !def.members.includes(val)) out.push(issue('E_ENUM', 'error', path, `"${val}" is not one of: ${def.members.join(', ')}.`));
      return true;
    case 'integer':
      if (!Number.isInteger(val)) { out.push(issue('E_TYPE', 'error', path, `Expected a whole number, got ${typeof val === 'number' ? val : typeof val}.`)); return false; }
      if (def.min != null && val < def.min) out.push(issue('E_RANGE', 'error', path, `${val} is below the minimum of ${def.min}.`, { min: def.min }));
      if (def.max != null && val > def.max) out.push(issue('E_RANGE', 'error', path, `${val} is above the maximum of ${def.max}.`, { max: def.max }));
      return true;
    case 'boolean':
      if (typeof val !== 'boolean') { out.push(issue('E_TYPE', 'error', path, `Expected true or false, got ${typeof val}.`)); return false; }
      return true;
    case 'array': {
      if (!Array.isArray(val)) { out.push(issue('E_TYPE', 'error', path, `Expected a list, got ${typeof val}.`)); return false; }
      if (def.of && def.of !== 'object') val.forEach((v, i) => checkType(v, { type: def.of }, `${path}[${i}]`, out));
      return true;
    }
    case 'object': {
      if (!isObj(val)) { out.push(issue('E_TYPE', 'error', path, `Expected a group of settings, got ${Array.isArray(val) ? 'list' : typeof val}.`)); return false; }
      if (def.required) for (const r of def.required) if (val[r] === undefined) out.push(issue('E_REQUIRED', 'error', `${path}.${r}`, `Missing required value.`));
      if (def.fields) for (const [k, sub] of Object.entries(def.fields)) if (val[k] !== undefined) checkType(val[k], sub, `${path}.${k}`, out);

    }
    default: return true;
  }

let CODES = 0;
function issue(code, severity, path, message, extra = {}) {
  return { id: `${code}-${++CODES}`, code, severity, path, message, ...extra };
}

/* ------------------------------------------------------------------ *
 * THE FIVE LAYERS
 * ------------------------------------------------------------------ */

/** L1 — SCHEMA: shape, types, formats, required fields. */
function layer1Schema(spec, out) {
  if (!isObj(spec)) { out.push(issue('E_NOTOBJECT', 'error', '', 'The project specification must be a group of settings.')); return; }
  for (const r of SCHEMA.required) if (spec[r] === undefined) out.push(issue('E_REQUIRED', 'error', r, `Missing required section "${r}".`));
  for (const [k, def] of Object.entries(SCHEMA.fields)) if (spec[k] !== undefined) checkType(spec[k], def, k, out);

/** L2 — SEMANTIC: values valid alone but wrong together. */
function layer2Semantic(spec, out) {
  const id = spec.identity || {}, a = spec.android || {}, app = spec.app || {}, b = spec.build || {};

  if (id.packageName) {
    const badKeyword = String(id.packageName).split('.').find((seg) => JAVA_KEYWORDS.has(seg));
