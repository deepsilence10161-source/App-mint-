name: Build

# Generates the Android project from the specification, compiles it, validates
# the real artifact, and hands the APK to the emulator job.
#
# Why the split: the build job is fast and deterministic, so a failure there is
# unambiguous. The emulator job is slow and occasionally flaky, so it runs
# separately and can be re-run on its own without rebuilding.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec file to build'
        required: false
        default: 'apps/demo/spec.json'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate, build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      spec: ${{ steps.pick.outputs.spec }}
      slug: ${{ steps.gen.outputs.slug }}
      content_hash: ${{ steps.gen.outputs.content_hash }}
      apk: ${{ steps.find.outputs.apk }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The generated build.gradle can derive versionCode from the commit
          # count, which needs the full history. A shallow checkout would make
          # that number wrong, so full depth is fetched unconditionally.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pick specification
        id: pick
        run: |
          SPEC="${{ github.event.inputs.spec || 'apps/demo/spec.json' }}"
          if [ ! -f "$SPEC" ]; then
            echo "::error::Specification not found: $SPEC"
            exit 1
          fi
          echo "spec=$SPEC" >> "$GITHUB_OUTPUT"
          echo "Building $SPEC"

      # ---- Layer 1-5: specification validation --------------------------
      - name: Validate specification (layers 1-5)
        run: |
          node engine/cli.mjs validate "${{ steps.pick.outputs.spec }}"
          echo "### Specification validated" >> $GITHUB_STEP_SUMMARY
          node engine/cli.mjs validate "${{ steps.pick.outputs.spec }}" --json > spec-check.json || true
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat spec-check.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ---- The Studio's own tests --------------------------------------
      - name: Engine self-tests
        run: node --test tools/tests/ 2>&1 | tail -40

      - name: Build the Studio bundle
        run: node tools/build-studio.mjs

      # ---- The website analyser, on a real site --------------------------
      # The analyser writes specifications, and a specification that does not
      # validate or does not generate is worse than no analyser: it fails long
      # after the person who ran it has moved on. So its output is put through
      # the validator and the generator here, on every commit, against the
      # fixture site in apps/site-demo/.
      - name: Analyse a website and check what it proposes
        run: |
          set -euo pipefail
          mkdir -p build
          node engine/cli.mjs analyse apps/site-demo/site --out build/analysed --json > build/analysis.json
          node -e "
            const a = require('./build/analysis.json');
            const blocking = a.findings.filter(f => f.level === 'blocking');
            if (blocking.length) { console.error('blocking findings:', blocking.map(f => f.code).join(', ')); process.exit(1); }
            console.log('analysed', a.pages.length, 'pages ·', a.summary.warning, 'warnings ·', a.summary.info, 'notes');
          "
          node engine/cli.mjs validate build/analysed/spec.json
          node engine/cli.mjs generate build/analysed/spec.json --out build/analysed-project > /dev/null
          echo "the analyser's own specification validated and generated a project"
          echo "### Website analyser" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          node -e "
            const a = require('./build/analysis.json');
            console.log(JSON.stringify({ appName: a.proposal.appName, packageName: a.proposal.packageName,
              capabilities: a.proposal.capabilities, findings: a.summary, theme: a.theme.theme }, null, 2));
          " >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ---- Backend security ----------------------------------------------
      # A mobile app cannot keep a secret: its key is inside the app, so every
      # rule about who may read and write what has to live in the database. This
      # gate reads the migrations and checks that it does.
      - name: Row level security gate
        run: |
          set -euo pipefail
          mkdir -p build
          checked=0
          for spec in apps/*/spec.json; do
            dir="$(dirname "$spec")/db/migrations"
            if [ -d "$dir" ]; then
              node engine/cli.mjs rls "$dir" --spec "$spec"
              checked=$((checked + 1))
            fi
          done
          echo "checked $checked app(s) with migrations"

          # And the gate is proven to bite, on every commit. A gate that quietly
          # stops working is indistinguishable from a gate with nothing to
          # report, so a schema that would let the app mark its own orders paid
          # must be refused here, loudly.
          cat > build/insecure.sql <<'SQL'
          create table public.orders (
            id uuid primary key,
            user_id uuid not null,
            status text not null default 'awaiting_payment'
          );
          alter table public.orders enable row level security;
          create policy "own" on public.orders for update to authenticated
            using (user_id = auth.uid()) with check (user_id = auth.uid());
          SQL
          if node engine/cli.mjs rls build/insecure.sql --json > build/gate-should-fail.json 2>&1; then
            echo "::error::the gate accepted a schema it must refuse — every payment rule below it is unproven"
            cat build/gate-should-fail.json
            exit 1
          fi
          # Named, not merely non-zero: the refusal has to be the payment rule.
          node -e "
            const r = require('./build/gate-should-fail.json');
            const codes = r.findings.map(f => f.code);
            if (!codes.includes('CLIENT_CAN_WRITE_PAYMENT_STATE')) {
              console.error('refused, but not for the payment rule:', codes.join(', '));
              process.exit(1);
            }
            console.log('and it refused the unsafe schema for the right reason:', codes.join(', '));
          "

      # ---- Generate ------------------------------------------------------
      - name: Generate Android project
        id: gen
        run: |
          node engine/cli.mjs generate "${{ steps.pick.outputs.spec }}" --out build/out
          SLUG=$(node -e "console.log(require('./build/out/BUILD-INFO.json').appName.toLowerCase().replace(/[^a-z0-9]+/g,'-'))")
          HASH=$(node -e "console.log(require('./build/out/BUILD-INFO.json').contentHash)")
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "content_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "content hash: $HASH"

      - name: Show permission table
        run: node engine/cli.mjs permissions "${{ steps.pick.outputs.spec }}" | tee permissions.txt

      # ---- Toolchain -----------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      # android-actions/setup-android@v3 is not used: it asks sdkmanager for the
      # long-removed legacy "tools" package and exits 1. The runner image already
      # ships an SDK, so we locate it and install only what we need.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ] && \
             ! ls "$SDK"/cmdline-tools/*/bin/sdkmanager > /dev/null 2>&1; then
            echo "no cmdline-tools at $SDK, installing"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            rm /tmp/clt.zip
          fi
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          export PATH="$(dirname "$SM"):$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          sdkmanager --list_installed | sed -n '1,20p'

      # ---- Compile -------------------------------------------------------
      - name: Build debug APK
        working-directory: build/out/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m'
        run: gradle assembleDebug --stacktrace --console=plain

      - name: Locate artifact
        id: find
        run: |
          APK=$(find build/out/android -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Gradle reported success but no APK exists. A build is only successful if the artifact is real."
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      # ---- Layer 7: artifact validation ----------------------------------
      - name: Validate the real artifact
        run: |
          set -euo pipefail
          APK="${{ steps.find.outputs.apk }}"
          BT="$ANDROID_HOME/build-tools/36.0.0"

          echo "### Artifact validation" >> $GITHUB_STEP_SUMMARY

          # Identity + version actually inside the APK
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion" | tee badging.txt
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat badging.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          TARGET=$(grep -oP "targetSdkVersion:'\K[0-9]+" badging.txt)
          if [ "$TARGET" -lt 35 ]; then
            echo "::error::targetSdk $TARGET is below the Google Play floor. Since 31 Aug 2026 new apps and updates need API 36."
            exit 1
          fi
          echo "targetSdk $TARGET is Play-compliant"

          # Signature must actually verify — never claim "signed" without this
          "$BT/apksigner" verify --verbose "$APK" | head -8

          # Alignment
          "$BT/zipalign" -c 4 "$APK" && echo "zipalign: OK"

          # A launcher icon must exist (this was a real defect in the old repos)
          if ! unzip -l "$APK" | grep -q "mipmap.*ic_launcher"; then
            echo "::error::The APK has no launcher icon resource."
            exit 1
          fi
          echo "launcher icons: $(unzip -l "$APK" | grep -c 'mipmap.*ic_launcher') resources"

          sha256sum "$APK" | tee "${APK%.apk}.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            build/out/android/app/build/outputs/apk/**/*.apk
            build/out/android/app/build/outputs/apk/**/*.sha256
          retention-days: 30

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: |
            build/out/BUILD-INFO.json
            permissions.txt
            spec-check.json
            badging.txt
          retention-days: 30
          if-no-files-found: warn
