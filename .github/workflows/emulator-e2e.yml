name: Device test

# Installs the generated APK on a REAL Android emulator, drives it with real
# touch input, and captures screenshots and a screen recording as evidence.
#
# Why a hosted emulator: this is the only place the app can actually be seen
# running for free. GitHub gives public repositories unlimited minutes on
# standard runners, and those runners have KVM, so the emulator is hardware
# accelerated rather than crawling along in software mode.
#
# The verdict comes from tools/e2e/judge.py, never from the driver, so a bug in
# the driver cannot make a failing app look like a passing one.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec file to test'
        required: false
        default: 'apps/demo/spec.json'

permissions:
  contents: write

concurrency:
  group: device-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-test:
    name: Run the app on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_API_LEVEL: '34'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_COMPILE_SDK: '36'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ] && \
             ! ls "$SDK"/cmdline-tools/*/bin/sdkmanager > /dev/null 2>&1; then
            echo "no cmdline-tools at $SDK, installing"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            rm /tmp/clt.zip
          fi
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          export PATH="$(dirname "$SM"):$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" \
                     "build-tools;${ANDROID_BUILD_TOOLS}"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "SDK_DIR=$SDK"
          } >> "$GITHUB_ENV"
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          echo "SDK ready at $SDK"

      - name: Pick specification
        id: pick
        run: |
          SPEC="${{ github.event.inputs.spec || 'apps/demo/spec.json' }}"
          echo "spec=$SPEC" >> "$GITHUB_OUTPUT"
          echo "pkg=$(node -e "console.log(require('./'+process.env.S).identity.packageName)" S="$SPEC")" >> "$GITHUB_OUTPUT"
          echo "slug=$(node -e "console.log(require('./'+process.env.S).identity.appName.toLowerCase().replace(/[^a-z0-9]+/g,'-'))" S="$SPEC")" >> "$GITHUB_OUTPUT"

      - name: Validate specification
        run: node engine/cli.mjs validate "${{ steps.pick.outputs.spec }}"

      - name: Generate Android project
        run: node engine/cli.mjs generate "${{ steps.pick.outputs.spec }}" --out build/out

      - name: Build APK for the device
        working-directory: build/out/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m'
        run: gradle assembleDebug --console=plain --stacktrace

      - name: Stage the APK
        run: |
          set -euo pipefail
          APK=$(find build/out/android -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::No APK was produced"; exit 1; }
          mkdir -p build/apk
          cp "$APK" build/apk/app-debug.apk
          ls -lh build/apk/

      # KVM must be granted BEFORE the emulator starts. Without this the
      # emulator silently falls back to software acceleration and takes 15+
      # minutes to boot, or never finishes — which looks like a test failure but
      # is really a missing permission.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_PACKAGE: ${{ steps.pick.outputs.pkg }}
          APP_ACTIVITY: ${{ steps.pick.outputs.pkg }}.MainActivity
          OUT_DIR: out
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: default
          arch: x86_64
          profile: Nexus 4
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot -no-window -gpu lavapipe -noaudio -no-boot-anim
            -camera-back none -camera-front none
          disable-animations: true
          script: bash tools/e2e/run.sh

      - name: Judge the evidence
        if: always()
        run: |
          mkdir -p out
          python3 -m pip install -q pillow
          python3 tools/e2e/judge.py out

      - name: Build the report
        if: always()
        run: |
          python3 tools/e2e/report.py out site "${{ github.run_number }}" "${{ github.sha }}" \
            "${{ github.repository }}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-evidence
          path: |
            out/
            site/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish the report (GitHub Pages)
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: true

      # The honest gate. The job is red unless every blocking check passed.
      - name: Verdict
        if: always()
        run: python3 tools/e2e/verdict.py out
