name: Device test

# Installs the generated APK on a REAL Android emulator, drives it with real
# touch input, and captures screenshots and a screen recording as evidence.
#
# Why a hosted emulator: this is the only place the app can actually be seen
# running for free. GitHub gives public repositories unlimited minutes on
# standard runners, and those runners have KVM, so the emulator is hardware
# accelerated rather than crawling along in software mode.
#
# The verdict comes from tools/e2e/judge.py, never from the driver, so a bug in
# the driver cannot make a failing app look like a passing one.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec file to test'
        required: false
        default: 'apps/demo/spec.json'

permissions:
  contents: write

concurrency:
  group: device-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-test:
    name: Run the app on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_API_LEVEL: '34'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_COMPILE_SDK: '36'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ] && \
             ! ls "$SDK"/cmdline-tools/*/bin/sdkmanager > /dev/null 2>&1; then
            echo "no cmdline-tools at $SDK, installing"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            rm /tmp/clt.zip
          fi
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          export PATH="$(dirname "$SM"):$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" \
                     "build-tools;${ANDROID_BUILD_TOOLS}"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "SDK_DIR=$SDK"
          } >> "$GITHUB_ENV"
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          echo "SDK ready at $SDK"

      - name: Validate both specifications
        run: |
          node engine/cli.mjs validate apps/demo/spec.json
          node engine/cli.mjs validate apps/native-demo/spec.json

      # Two apps, because they share no UI code. One is a WebView showing a
      # page; the other draws every view itself from the screen description.
      # A change that breaks one of them would otherwise slip through.
      - name: Generate both Android projects
        run: |
          node engine/cli.mjs generate apps/demo/spec.json --out build/out
          node engine/cli.mjs generate apps/native-demo/spec.json --out build/native

      - name: Build the website app
        working-directory: build/out/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m'
        run: gradle assembleDebug --console=plain --stacktrace

      - name: Build the designed-screens app
        working-directory: build/native/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m'
        run: gradle assembleDebug --console=plain --stacktrace

      - name: Stage both APKs
        run: |
          set -euo pipefail
          mkdir -p build/apk
          DEMO=$(find build/out/android -name '*.apk' | head -1)
          NATIVE=$(find build/native/android -name '*.apk' | head -1)
          [ -n "$DEMO" ] || { echo "::error::No APK was produced for the website app"; exit 1; }
          [ -n "$NATIVE" ] || { echo "::error::No APK was produced for the designed-screens app"; exit 1; }
          cp "$DEMO" build/apk/demo.apk
          cp "$NATIVE" build/apk/native.apk
          ls -lh build/apk/
          # what the generator says these builds are — the driver does not guess
          node -e "for (const f of ['build/out/BUILD-INFO.json','build/native/BUILD-INFO.json']) {
            const b = require('./' + f);
            console.log(f, '->', b.architecture, b.packageName, b.launcherActivity, 'screens:', b.screens ? b.screens.count : 0);
          }"
          echo "--- what the two workflows are told to launch ---" 

      # KVM must be granted BEFORE the emulator starts. Without this the
      # emulator silently falls back to software acceleration and takes 15+
      # minutes to boot, or never finishes — which looks like a test failure but
      # is really a missing permission.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STAGE_DIR: build/apk
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: default
          arch: x86_64
          profile: Nexus 4
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot -no-window -gpu lavapipe -noaudio -no-boot-anim
            -camera-back none -camera-front none
          disable-animations: true
          script: bash tools/e2e/run-both.sh

      - name: Judge the evidence
        if: always()
        run: |
          python3 -m pip install -q pillow
          mkdir -p out/demo out/native
          # Each app is judged on its own evidence. A missing result is a
          # failure, never a silent pass.
          python3 tools/e2e/judge.py out/demo
          python3 tools/e2e/judge.py out/native

      - name: Build a report for each app, and a page covering both
        if: always()
        run: |
          python3 tools/e2e/report.py out/demo site/demo "${{ github.run_number }}" "${{ github.sha }}" \
            "${{ github.repository }}"
          python3 tools/e2e/report.py out/native site/native "${{ github.run_number }}" "${{ github.sha }}" \
            "${{ github.repository }}"
          python3 tools/e2e/summary.py out site "${{ github.run_number }}" "${{ github.sha }}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-evidence
          path: |
            out/
            site/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish the report (GitHub Pages)
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          # Reports live under /report/ so they never overwrite the Studio that
          # the other workflow publishes at the root.
          destination_dir: report
          keep_files: true

      # The honest gate. The job is red unless every blocking check passed.
      - name: Verdict
        if: always()
        run: |
          # Both apps must pass. There is no "partly working" here: the point of
          # this test is that what was generated runs on a real device.
          python3 tools/e2e/verdict.py out/demo
          python3 tools/e2e/verdict.py out/native
