// ⚡ AppKaro wrapper module
// CI इन props से हर यूज़र की app बनाता है:
//   gradle :app:assembleRelease -PpackageId=.. -PappName=.. -PstartUrl=.. -PthemeColor=.. -Pcleartext=..

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def pkg        = project.findProperty("packageId")  ?: "com.appkaro.wrapper"
def appName    = (project.findProperty("appName")   ?: "AppKaro App").toString().replaceAll(/["']/, "")
def startUrl   = (project.findProperty("startUrl")  ?: "https://example.com").toString().replaceAll(/["']/, "")
def themeColor = (project.findProperty("themeColor") ?: "#6C5CE7").toString().replaceAll(/["']/, "")
def cleartext  = (project.findProperty("cleartext") ?: "false").toString().toBoolean()

/* 💰 Earning + 🔔 push — खाली = feature पूरी तरह बाहर (SDK compile भी नहीं होता)
 *   -PadsAppId=-ca-app-pub-XXXX~YYYY   -PadUnitId=ca-app-pub-XXXX/YYYY   -PpushAppId=OneSignal UUID */
def adsAppId  = (project.findProperty("adsAppId")  ?: "").toString().replaceAll(/["']/, "")
def adUnitId  = (project.findProperty("adUnitId")  ?: "").toString().replaceAll(/["']/, "")
def pushAppId = (project.findProperty("pushAppId") ?: "").toString().replaceAll(/["']/, "")
def adsOn  = adsAppId.length() > 0
def pushOn = pushAppId.length() > 0
if (!adUnitId) adUnitId = "ca-app-pub-3940256099942544/6300978111"   // Google की official TEST banner unit (safe default)

android {
    // namespace हमेशा fixed रहता है — applicationId ही यूज़र की पहचान है
    namespace "com.appkaro.wrapper"
    compileSdk 35 // TODO(Phase 3): AGP update के साथ 36 bump करना

    defaultConfig {
        applicationId pkg
        minSdk 24
        targetSdk 35
        def vc = ((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionCode vc
        versionName "1.0." + vc

        manifestPlaceholders = [
            appLabel        : appName,
            cleartextTraffic: cleartext.toString(),
            adsAppId        : adsAppId,   // off होने पर empty — SDK link ही नहीं होता तो tag inert
        ]

        buildConfigField "String", "APP_NAME", "\"${appName}\""
        buildConfigField "String", "START_URL", "\"${startUrl}\""
        buildConfigField "String", "THEME_COLOR", "\"${themeColor}\""
        buildConfigField "boolean", "ALLOW_CLEARTEXT", cleartext.toString()
        buildConfigField "String", "ADS_APP_ID", "\"${adsAppId}\""
        buildConfigField "String", "AD_UNIT_ID", "\"${adUnitId}\""
        buildConfigField "String", "PUSH_APP_ID", "\"${pushAppId}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // signing जान-बूझकर यहाँ नहीं — server-side होती है (keys कभी CI पर नहीं)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// KGP 2.x: kotlinOptions हट गया → compilerOptions DSL
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    /* 💰/🔔 conditional — ID दो तभी SDK app में आता है (zero-bloat default)
     * Kotlin कोड इन्हें reflection से चलाता है, इसलिए off-build compile कभी नहीं टूटता
     * ads 24.5.0: byte-level verify (kotlin_module metadata) — 24.9+ Kotlin 2.2/2.3 माँगता है,
     *             हमारा compiler 2.1 है। OneSignal 5.10.2 = compatible (verified) */
    if (adsOn)  implementation 'com.google.android.gms:play-services-ads:24.5.0'
    if (pushOn) implementation 'com.onesignal:OneSignal:5.10.2'
}
