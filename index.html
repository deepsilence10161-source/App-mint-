/* ------------------------------------------------------------------ *
 * HELPERS
 * ------------------------------------------------------------------ */
const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

function checkType(val, def, path, out) {
  switch (def.type) {
    case 'string':
      if (typeof val !== 'string') { out.push(issue('E_TYPE', 'error', path, `Expected text, got ${Array.isArray(val) ? 'list' : typeof val}.`)); return false; }
      if (def.minLength != null && val.length < def.minLength) out.push(issue('E_MINLEN', 'error', path, `Must be at least ${def.minLength} character(s).`));
      if (def.maxLength != null && val.length > def.maxLength) out.push(issue('E_MAXLEN', 'error', path, `Must be at most ${def.maxLength} characters (currently ${val.length}).`));
      if (def.pattern && !def.pattern.test(val)) out.push(issue('E_FORMAT', 'error', path, `"${val}" is not in the expected format.`));
      if (def.oneOf && !def.oneOf.includes(val)) out.push(issue('E_ENUM', 'error', path, `"${val}" is not one of: ${def.oneOf.join(', ')}.`, { options: def.oneOf }));
      if (def.members && !def.members.includes(val)) out.push(issue('E_ENUM', 'error', path, `"${val}" is not one of: ${def.members.join(', ')}.`));
      return true;
    case 'integer':
      if (!Number.isInteger(val)) { out.push(issue('E_TYPE', 'error', path, `Expected a whole number, got ${typeof val === 'number' ? val : typeof val}.`)); return false; }
      if (def.min != null && val < def.min) out.push(issue('E_RANGE', 'error', path, `${val} is below the minimum of ${def.min}.`, { min: def.min }));
      if (def.max != null && val > def.max) out.push(issue('E_RANGE', 'error', path, `${val} is above the maximum of ${def.max}.`, { max: def.max }));
      return true;
    case 'boolean':
      if (typeof val !== 'boolean') { out.push(issue('E_TYPE', 'error', path, `Expected true or false, got ${typeof val}.`)); return false; }
      return true;
    case 'array': {
      if (!Array.isArray(val)) { out.push(issue('E_TYPE', 'error', path, `Expected a list, got ${typeof val}.`)); return false; }
      if (def.of && def.of !== 'object') val.forEach((v, i) => checkType(v, { type: def.of }, `${path}[${i}]`, out));
      return true;
    }
    case 'object': {
      if (!isObj(val)) { out.push(issue('E_TYPE', 'error', path, `Expected a group of settings, got ${Array.isArray(val) ? 'list' : typeof val}.`)); return false; }
      if (def.required) for (const r of def.required) if (val[r] === undefined) out.push(issue('E_REQUIRED', 'error', `${path}.${r}`, `Missing required value.`));
      if (def.fields) for (const [k, sub] of Object.entries(def.fields)) if (val[k] !== undefined) checkType(val[k], sub, `${path}.${k}`, out);
      return true;
    }
    default: return true;
  }
}

let CODES = 0;
function issue(code, severity, path, message, extra = {}) {
  return { id: `${code}-${++CODES}`, code, severity, path, message, ...extra };
}

/* ------------------------------------------------------------------ *
 * THE FIVE LAYERS
 * ------------------------------------------------------------------ */

/** L1 — SCHEMA: shape, types, formats, required fields. */
function layer1Schema(spec, out) {
  if (!isObj(spec)) { out.push(issue('E_NOTOBJECT', 'error', '', 'The project specification must be a group of settings.')); return; }
  for (const r of SCHEMA.required) if (spec[r] === undefined) out.push(issue('E_REQUIRED', 'error', r, `Missing required section "${r}".`));
  for (const [k, def] of Object.entries(SCHEMA.fields)) if (spec[k] !== undefined) checkType(spec[k], def, k, out);
}

/** L2 — SEMANTIC: values valid alone but wrong together. */
function layer2Semantic(spec, out) {
  const id = spec.identity || {}, a = spec.android || {}, app = spec.app || {}, b = spec.build || {};

  if (id.packageName) {
    const badKeyword = String(id.packageName).split('.').find((seg) => JAVA_KEYWORDS.has(seg));
    if (badKeyword)
      out.push(issue('E_JAVA_KEYWORD_PKG', 'error', 'identity.packageName',
        `The package name contains "${badKeyword}", which is a Java reserved word. Android would compile the generated code into a package that Java cannot name, and the build would fail.`,
        { fix: { kind: 'set', path: 'identity.packageName',
            value: String(id.packageName).split('.').map((seg) => (JAVA_KEYWORDS.has(seg) ? seg + 'app' : seg)).join('.') } }));
  }

  if (id.packageName && RESERVED_PACKAGE_WORDS.some((w) => id.packageName === w || id.packageName.startsWith(w + '.')))
    out.push(issue('E_RESERVED_PKG', 'error', 'identity.packageName',
      `The package name starts with a reserved namespace ("${id.packageName.split('.').slice(0, 2).join('.')}"). Google Play rejects these.`,
      { fix: { kind: 'set', path: 'identity.packageName', value: 'com.example.' + (id.packageName.split('.').pop() || 'app') } }));

  if (id.packageName && /(app|example)$/i.test(id.packageName.split('.').pop()) && id.packageName.startsWith('com.example'))
    out.push(issue('W_DEFAULT_PKG', 'warning', 'identity.packageName',
      'This is still the placeholder package name. It is permanent once published — change it before your first release.'));

  if (a.minSdk && a.targetSdk && a.minSdk > a.targetSdk)
    out.push(issue('E_SDK_ORDER', 'error', 'android.minSdk',
      `Minimum SDK (${a.minSdk}) is higher than target SDK (${a.targetSdk}). No device could ever run this.`,
      { fix: { kind: 'set', path: 'android.minSdk', value: a.targetSdk } }));

  if (a.targetSdk && a.compileSdk && a.targetSdk > a.compileSdk)
    out.push(issue('E_COMPILE_BELOW_TARGET', 'error', 'android.compileSdk',
      `Target SDK (${a.targetSdk}) is higher than compile SDK (${a.compileSdk}). You cannot target what you do not compile against.`,
      { fix: { kind: 'set', path: 'android.compileSdk', value: a.targetSdk } }));

  // Play compliance — verified against the 2026 policy (API 36 for new apps/updates).
  if (a.targetSdk && a.targetSdk < 35 && (b.outputs || []).some((o) => o !== 'debug-apk'))
    out.push(issue('E_PLAY_TARGET', 'error', 'android.targetSdk',
      `Target SDK ${a.targetSdk} cannot be published to Google Play. Since 31 Aug 2026 new apps and all updates must target 36 (Android 16); 35 is the minimum to stay visible to new users.`,
      { fix: { kind: 'set', path: 'android.targetSdk', value: 36 } }));
  else if (a.targetSdk && a.targetSdk < 36 && (b.outputs || []).some((o) => o !== 'debug-apk'))
    out.push(issue('W_PLAY_TARGET', 'warning', 'android.targetSdk',
      `Target SDK ${a.targetSdk} is below 36. Google Play has required API 36 for new apps and updates since 31 Aug 2026.`));

  if (a.cleartextTraffic === true)
    out.push(issue('W_CLEARTEXT', 'warning', 'android.cleartextTraffic',
      'Plain HTTP traffic is allowed. Any network the user is on can read or change it. Only enable this for a legacy site with no HTTPS.',
      { fix: { kind: 'set', path: 'android.cleartextTraffic', value: false } }));

  if (a.allowBackup === true)
    out.push(issue('W_BACKUP', 'warning', 'android.allowBackup',
      'Android backup is on. If the app stores sign-in tokens, an unscoped backup can carry them off the device.',
      { fix: { kind: 'set', path: 'android.allowBackup', value: false } }));

  const insets = [];
  if (app.mode === 'webview' || app.mode === 'pwa' || app.mode === 'hybrid') {
    if (!app.webview || !app.webview.startUrl) insets.push(issue('E_NO_URL', 'error', 'app.webview.startUrl', `Mode "${app.mode}" needs a start URL.`));
  }
  if (app.mode === 'native-screens' && (!Array.isArray(spec.screens) || spec.screens.length === 0))
    insets.push(issue('E_NO_SCREENS', 'error', 'screens', 'Native-screens mode needs at least one screen.'));
  out.push(...insets);

  if (id.versionName && id.versionCode) {
    const patch = Number((id.versionName.split('.')[2] || id.versionName.split('.')[1] || '0'));
    if (Number.isFinite(patch) && patch > id.versionCode && id.versionCode === 1)
      out.push(issue('I_VERSION', 'info', 'identity.versionCode', 'Version code is still 1. Play requires a strictly increasing code on every upload.'));
  }
  if (id.versionStrategy === 'git-commit-count' && b.engine !== 'github-actions')
    out.push(issue('W_VERSION_STRATEGY', 'warning', 'identity.versionStrategy',
      'Version from git commit count needs the repository history. The GitHub Actions engine fetches it; other engines may not.'));
}

/** L3 — DEPENDENCY: things referencing things that do not exist. */
function layer3Dependency(spec, out) {
  const caps = spec.capabilities || [];
  const seen = new Set();
  for (const c of caps) {
    if (seen.has(c)) out.push(issue('E_DUP_CAP', 'error', 'capabilities',
      `Capability "${c}" is listed twice.`, { fix: { kind: 'removeArrayItem', path: 'capabilities', value: c } }));
    seen.add(c);
    if (!CAPABILITIES[c]) {
      const near = Object.keys(CAPABILITIES).filter((k) => k.toLowerCase().startsWith(String(c).slice(0, 3).toLowerCase())).slice(0, 3);
      out.push(issue('E_UNKNOWN_CAP', 'error', 'capabilities',
        `"${c}" is not a known capability.`, { options: near.length ? near : Object.keys(CAPABILITIES) }));
    }
  }

  const app = spec.app || {};
  const wv = app.webview || {};
  if (wv.fileUploads === true && !caps.includes('files'))
    out.push(issue('W_UPLOAD_NO_CAP', 'warning', 'app.webview.fileUploads',
      'File uploads need the "files" capability, otherwise the upload button will do nothing on the phone.',
      { fix: { kind: 'addArrayItem', path: 'capabilities', value: 'files' } }));

  if (app.mode === 'pwa' && !caps.includes('internet'))
    out.push(issue('W_PWA_NET', 'warning', 'app.mode',
      'PWA mode still loads its shell from the network on first run; the internet capability is recommended.',
      { fix: { kind: 'addArrayItem', path: 'capabilities', value: 'internet' } }));

  if (caps.includes('exactAlarms') && !caps.includes('notifications') && !caps.includes('bootStart'))
    out.push(issue('W_ALARM_ORPHAN', 'warning', 'capabilities',
      'Exact alarms are enabled but nothing uses them. This makes Android ask for a special "alarms and reminders" permission for no reason.',
      { fix: { kind: 'removeArrayItem', path: 'capabilities', value: 'exactAlarms' } }));

  if (caps.includes('payments') && (spec.backend || {}).kind === 'none')
    out.push(issue('E_PAY_NO_BACKEND', 'error', 'capabilities',
      'In-app purchases need a backend to verify the receipt server-side. Without it, the client would be trusted to say "paid" — which anyone can fake.',
      { hint: 'Set backend.kind to supabase or custom-rest.' }));

  if (caps.includes('googleAuth') && !caps.includes('internet'))
    out.push(issue('W_AUTH_NO_NET', 'warning', 'capabilities', 'Google Sign-In needs internet.',
      { fix: { kind: 'addArrayItem', path: 'capabilities', value: 'internet' } }));

  if (caps.includes('barcode') && !(wv.startUrl || (spec.screens || []).length))
    out.push(issue('W_BARCODE_UNUSED', 'info', 'capabilities', 'Barcode scanning is enabled but no screen uses it yet.'));

  const nav = spec.navigation || {};
  if (nav.type === 'bottom-tabs' && (spec.screens || []).length < 2)
    out.push(issue('W_NAV_THIN', 'warning', 'navigation.type', 'Bottom tabs with fewer than two screens leaves empty tabs.'));

  // Screens are structures: every reference inside them must resolve, and every
  // action must be able to run. This is where a half-built screen gets caught,
  // rather than at runtime on a user's phone.
  validateScreens(spec, out);
}

/** L4 — SECURITY: the gate. Critical findings block the build unless overridden. */
function layer4Security(spec, out) {
  const caps = spec.capabilities || [];
  const dl = spec.deepLinks || {};
  const b = spec.build || {};

  // Unsafe URL schemes must never be routed to a raw Intent (the exact defect
  // found in ff-user-panel/MainActivity.java).
  const DANGEROUS = ['intent', 'file', 'content', 'javascript', 'data', 'jar'];
  const offered = dl.allowedSchemes || [];
  for (const s of offered) {
    if (DANGEROUS.includes(String(s).toLowerCase()))
      out.push(issue('E_UNSAFE_SCHEME', 'critical', 'deepLinks.allowedSchemes',
        `Scheme "${s}" is unsafe to route automatically. It can launch arbitrary components or read local files.`,
        { fix: { kind: 'removeArrayItem', path: 'deepLinks.allowedSchemes', value: s } }));
  }

  if ((spec.signing || {}).mode === 'secret-store' && (spec.signing || {}).failClosed === false)
    out.push(issue('E_SIGNING_NOT_FAILCLOSED', 'critical', 'signing.failClosed',
      'Signing is set to a secret store but fail-closed is off. If the keystore is missing, a new one would be generated — which silently changes your app identity and permanently breaks Google Sign-In and every future update.',
      { fix: { kind: 'set', path: 'signing.failClosed', value: true } }));

  if ((b.outputs || []).some((o) => o !== 'debug-apk') && (spec.signing || {}).mode === 'none')
    out.push(issue('E_RELEASE_UNSIGNED', 'critical', 'signing.mode',
      'A release or AAB build was requested with signing disabled. The output could not be installed on any device.',
      { fix: { kind: 'set', path: 'signing.mode', value: 'secret-store' } }));

  if (caps.includes('ads') && (spec.build || {}).outputs?.length)
    out.push(issue('W_ADS_TRACKING', 'warning', 'capabilities',
      'Advertisements add a tracking identifier and are off for a reason. Enable only if you truly need them.'));

  if (caps.includes('location'))
    out.push(issue('W_LOCATION_HIGH_RISK', 'warning', 'capabilities',
      'Location is a high-risk permission. Google Play requires a written justification and, for background use, a review.'));

  // Secret-looking values inside the spec itself.
  const raw = JSON.stringify(spec);
  const SECRET_PATTERNS = [
    { re: /eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}/g, what: 'a JWT (possibly a service_role key)' },
    { re: /sk-[A-Za-z0-9]{20,}/g, what: 'an OpenAI-style secret key' },
    { re: /AIza[A-Za-z0-9_-]{30,}/g, what: 'a Google API key' },
    { re: /-----BEGIN [A-Z ]*PRIVATE KEY-----/g, what: 'a private key' },
    { re: /(?:password|passwd|secret|service_role)\s*[:=]\s*["'][^"']{8,}["']/gi, what: 'a hard-coded password or secret' },
  ];
  for (const { re, what } of SECRET_PATTERNS) {
    const m = raw.match(re);
    if (m) out.push(issue('E_SECRET_IN_SPEC', 'critical', 'spec',
      `The specification appears to contain ${what}. Remove it and keep it in the build engine's secret store — this file is committed to a repository.`,
      { redactedSample: String(m[0]).slice(0, 4) + '…redacted' }));
  }

  if (spec.backend && spec.backend.kind !== 'none' && (spec.backend.tablesRequiringRls || []).length === 0 && spec.backend.requiresAuth)
    out.push(issue('W_RLS_UNSPECIFIED', 'warning', 'backend.tablesRequiringRls',
      'Authentication is on, but no tables are listed as needing row-level security. RLS is the only thing standing between one signed-in user and another user\'s rows.'));
}

/** L5 — CAPABILITY: can the chosen engine actually produce this? */
function layer5Capability(spec, out) {
  const ENGINE = {
    'github-actions': { aab: true, signedApk: true, emulator: true, label: 'GitHub Actions (free, unlimited on public repos)' },
    'local-termux':   { aab: true, signedApk: true, emulator: false, label: 'Termux on the phone' },
    'local-desktop':  { aab: true, signedApk: true, emulator: true, label: 'This desktop' },
  };
  const b = spec.build || {};
  const e = ENGINE[b.engine || 'github-actions'];
  if (!e) { out.push(issue('E_UNKNOWN_ENGINE', 'error', 'build.engine', `Unknown build engine "${b.engine}".`)); return; }

  for (const o of b.outputs || []) {
    if (o === 'aab' && !e.aab) out.push(issue('E_ENGINE_NO_AAB', 'error', 'build.outputs', `${e.label} cannot produce an AAB.`));
    if ((o === 'signed-apk' || o === 'release-apk') && !e.signedApk) out.push(issue('E_ENGINE_NO_SIGN', 'error', 'build.outputs', `${e.label} cannot sign a release build.`));
  }

  const a = spec.android || {};
  // Toolchain compatibility is data-driven (engine/spec/toolchain.mjs) so the
  // validator and the generator can never disagree about what an AGP version
  // can actually compile.
  const effective = resolveToolchain(spec);
  const compileSdk = a.compileSdk ?? effective.maxCompileSdk;
  if (compileSdk > effective.maxCompileSdk) {
    const better = profileForCompileSdk(compileSdk);
    const bt = TOOLCHAIN_PROFILES[better];
    out.push(issue('E_TOOLCHAIN_TOO_OLD', 'error', 'build.toolchain.agp',
      `compileSdk ${compileSdk} cannot be compiled by AGP ${effective.agp} (it stops at SDK ${effective.maxCompileSdk}). ` +
      `Switch to the "${better}" profile: AGP ${bt.agp} with Gradle ${bt.gradle}.`,
      {
        fix: { kind: 'set', path: 'build.toolchain.agp', value: bt.agp },
        alsoNeeds: { 'build.toolchain.gradle': bt.gradle, 'build.toolchain.buildTools': bt.buildTools },
      }));
  }
  if (a.minSdk != null && a.minSdk < 21) out.push(issue('E_MIN_TOO_LOW', 'error', 'android.minSdk', 'Android 5.0 (API 21) is the oldest version still worth supporting.'));
  if (spec.app && spec.app.mode === 'pwa' && spec.build && spec.build.engine === 'local-termux')
    out.push(issue('W_PWA_TERMUX', 'warning', 'app.mode', 'PWA mode works, but offline caching behaves differently on the phone-based engine. Test on a real device.'));
}

/* ------------------------------------------------------------------ *
 * MAIN ENTRY
 * ------------------------------------------------------------------ */
const LAYERS = [
  { n: 1, name: 'Schema',     fn: layer1Schema },
  { n: 2, name: 'Semantic',   fn: layer2Semantic },
  { n: 3, name: 'Dependency', fn: layer3Dependency },
  { n: 4, name: 'Security',   fn: layer4Security },
  { n: 5, name: 'Capability', fn: layer5Capability },
];

/**
 * Run all five layers.
 * @returns {{ok:boolean, blocked:boolean, issues:Array, byLayer:Object, counts:Object}}
 * `blocked` is the gate: critical or error severities stop the build unless the
 * caller supplies an explicit, visible, logged override.
 */
function validateSpec(spec, opts = {}) {
  CODES = 0;
  const issues = [];
  const byLayer = {};
  for (const L of LAYERS) {
    const before = issues.length;
    L.fn(spec, issues);
    byLayer[L.n] = { name: L.name, issues: issues.slice(before) };
  }
  const overrides = opts.overrides || [];
  const isOverridden = (i) => overrides.some((o) => o.code === i.code);
  const blocking = issues.filter((i) => (i.severity === 'critical' || i.severity === 'error') && !isOverridden(i));
  const counts = { critical: 0, error: 0, warning: 0, info: 0 };
  for (const i of issues) counts[i.severity] = (counts[i.severity] || 0) + 1;
  return {
    ok: blocking.length === 0,
    blocked: blocking.length > 0,
    issues,
    blocking,
    byLayer,
    counts,
    overridesApplied: issues.filter((i) => (i.severity === 'critical' || i.severity === 'error') && isOverridden(i)).map((i) => i.code),
  };
}

/* ------------------------------------------------------------------ *
 * DETERMINISTIC REPAIR (rule-based only — never AI)
 * Applies ONLY high-confidence fixes that carry an explicit `fix` object,
 * records every change so it can be rolled back, and re-validates.
 * ------------------------------------------------------------------ */
function applyFixes(spec, issues, { onlyCodes = null, maxRounds = 5 } = {}) {
  const clone = JSON.parse(JSON.stringify(spec));
  const applied = [];
  let current = clone;
  let result = validateSpec(current);

  for (let round = 0; round < maxRounds; round++) {
    const candidates = result.issues.filter((i) =>
      i.fix && (onlyCodes ? onlyCodes.includes(i.code) : true) &&
      (i.severity === 'critical' || i.severity === 'error' || i.severity === 'warning'));
    if (candidates.length === 0) break;

    const chosen = candidates[0];
    const undo = setPath(current, chosen.fix);
    if (!undo) break;
    applied.push({ code: chosen.code, path: chosen.path, fix: chosen.fix, message: chosen.message, undo });
    result = validateSpec(current);
  }
  return { spec: current, applied, result, rolledBack: false };
}

function getParent(obj, path) {
  const parts = path.split('.');
  const last = parts.pop();
  let cur = obj;
  for (const p of parts) { if (cur == null) return null; cur = cur[p]; }
  return { parent: cur, key: last };
}

/** Apply one fix, returning the inverse operation so it can be rolled back. */
function setPath(spec, fix) {
  const loc = getParent(spec, fix.path);
  if (!loc || loc.parent == null) return null;
  const { parent, key } = loc;
  switch (fix.kind) {
    case 'set': {
      const had = key in parent;
      const prev = parent[key];
      parent[key] = fix.value;
      if (fix.alsoNeeds) for (const [p, v] of Object.entries(fix.alsoNeeds)) { const l = getParent(spec, p); if (l && l.parent) l.parent[l.key] = v; }
      return { kind: 'set', path: fix.path, had, prev };
    }
    case 'addArrayItem': {
      if (!Array.isArray(parent)) return null;
      const arr = parent[key] || (parent[key] = []);
      if (arr.includes(fix.value)) return null;
      arr.push(fix.value);
      return { kind: 'removeArrayItem', path: fix.path, value: fix.value };
    }
    case 'removeArrayItem': {
      const arr = parent[key];
      if (!Array.isArray(arr)) return null;
      const idx = arr.indexOf(fix.value);
      if (idx < 0) return null;
      arr.splice(idx, 1);
      return { kind: 'insertArrayItem', path: fix.path, value: fix.value, at: idx };
    }
    default: return null;
  }
}

/** Undo a previously applied fix. Guarantees automatic repairs are reversible. */
function rollbackFix(spec, entry) {
  const u = entry.undo, loc = getParent(spec, u.path);
  if (!loc || loc.parent == null) return false;
  const { parent, key } = loc;
  if (u.kind === 'set') { if (u.had) parent[key] = u.prev; else delete parent[key]; return true; }
  if (u.kind === 'removeArrayItem' && Array.isArray(parent[key])) { parent[key] = parent[key].filter((v) => v !== u.value); return true; }
  if (u.kind === 'insertArrayItem' && Array.isArray(parent[key])) { parent[key].splice(u.at, 0, u.value); return true; }
  return false;
}


/* ═══ engine/capability/permissions.mjs ═══ */
/**
 * PERMISSION MINIMIZATION ENGINE
 * ==============================
 * Android permissions are DERIVED from enabled capabilities — never written by
 * hand, never inherited "just in case". Disable a capability and its permission
 * disappears from the manifest. This is enforced by the generator.
 *
 * Every derived permission carries the capability that caused it and a
 * human-readable reason, so the Studio can show the user the exact table:
 *
 *   PERMISSION              WHY                        FEATURE
 *   POST_NOTIFICATIONS      Reminders and alerts       Notifications
 *   CAMERA                  Needed to scan a code      Barcode / QR
 *
 * Just as important: this module reports permissions the generated app does NOT
 * need, and permissions that were *requested by a capability but dropped as
 * unnecessary* (e.g. WRITE_EXTERNAL_STORAGE on modern Android, where it is a
 * no-op). Fewer permissions = smaller attack surface + a smaller APK.
 */

/** Android permission -> manifest declaration attributes. */
const PERMISSION_META = {
  INTERNET:                    { protectionLevel: 'normal' },
  ACCESS_NETWORK_STATE:        { protectionLevel: 'normal' },
  POST_NOTIFICATIONS:          { protectionLevel: 'dangerous', runtime: true, since: 33 },
  SCHEDULE_EXACT_ALARM:        { protectionLevel: 'special', runtime: true, since: 31 },
  RECEIVE_BOOT_COMPLETED:      { protectionLevel: 'normal' },
  VIBRATE:                     { protectionLevel: 'normal' },
  CAMERA:                      { protectionLevel: 'dangerous', runtime: true },
  READ_EXTERNAL_STORAGE:       { protectionLevel: 'dangerous', runtime: true, maxSdk: 32, replacedBy: 'READ_MEDIA_* (33+)' },
  WRITE_EXTERNAL_STORAGE:      { protectionLevel: 'dangerous', runtime: true, maxSdk: 28, note: 'Ignored on Android 11+; kept only for Android 9 and below.' },
  ACCESS_FINE_LOCATION:        { protectionLevel: 'dangerous', runtime: true },
  ACCESS_COARSE_LOCATION:      { protectionLevel: 'dangerous', runtime: true },
  AD_ID:                       { protectionLevel: 'normal' },
  'com.android.vending.BILLING': { protectionLevel: 'normal' },
};

/**
 * Derive the minimal permission set for a spec.
 * @param {object} spec
 * @returns {{permissions:Array<{name:string,reason:string,feature:string,attrs:object}>,
 *            dropped:Array<{name:string,reason:string}>,
 *            unknownCapabilities:string[]}}
 */
function derivePermissions(spec) {
  const caps = Array.isArray(spec.capabilities) ? spec.capabilities : [];
  const android = spec.android || {};
  const app = spec.app || {};
  const targetSdk = android.targetSdk ?? 36;

  // internet is implicit: any networked app needs it, but we still show it.
  const active = new Set(['internet', ...caps]);

  // ---- collect ---------------------------------------------------------
  const wanted = new Map(); // name -> { reason, features:Set }
  for (const capId of active) {
    const cap = CAPABILITIES[capId];
    if (!cap) continue;
    for (const p of cap.permissions) {
      if (!wanted.has(p)) wanted.set(p, { reason: cap.reason, features: new Set() });
      wanted.get(p).features.add(cap.label);
    }
  }

  // Internet already answered by a richer reason above? keep the specific one.

  // ---- what a careless implementation would have requested ----------------
  //
  // The first version of this tried to drop permissions *after* collecting
  // them, which could never fire: only an enabled capability can contribute a
  // permission, so the condition "the capability is off" was unreachable. The
  // feature that was supposed to prove permission minimisation never produced
  // any output at all. Found by the browser test that asserted on it.
  //
  // The honest version compares against everything ANY capability could ask
  // for, and reports the difference. That is a real, checkable claim: this app
  // is not requesting these, and here is why.
  const couldAsk = new Map(); // permission -> Set of capability labels
  for (const cap of Object.values(CAPABILITIES)) {
    for (const p of cap.permissions) {
      if (!couldAsk.has(p)) couldAsk.set(p, new Set());
      couldAsk.get(p).add(cap.label);
    }
  }

  const dropped = [];
  for (const [name, features] of couldAsk) {
    if (wanted.has(name)) continue;
    const names = [...features];
    dropped.push({
      name,
      reason: `capability "${names.join(' / ')}" is turned off`,
    });
  }
  dropped.sort((a, b) => a.name.localeCompare(b.name));

  // ---- build the report ------------------------------------------------
  const permissions = [];
  for (const [name, info] of [...wanted.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
    const meta = PERMISSION_META[name] || {};
    const attrs = {};
    // Some permissions are meaningless on newer Android; those are capped with
    // android:maxSdkVersion rather than requested on every device.
    if (meta.maxSdk != null) attrs.maxSdkVersion = meta.maxSdk;
    permissions.push({
      name: `android.permission.${name}`,
      short: name,
      reason: info.reason,
      feature: [...info.features].join(' + '),
      attrs,
      runtime: !!meta.runtime,
      since: meta.since || null,
      note: meta.note || null,
    });
  }

  const unknownCapabilities = caps.filter((c) => !CAPABILITIES[c]);

  return { permissions, dropped, unknownCapabilities };
}

/**
 * Which permissions the user will actually be PROMPTED for at runtime.
 * Shown before every build so there are no surprises on the phone.
 */
function runtimePrompts(spec) {
  const { permissions } = derivePermissions(spec);
  const targetSdk = (spec.android || {}).targetSdk ?? 36;
  return permissions.filter((p) => p.runtime && (!p.since || targetSdk >= p.since));
}

/** Human-readable summary block used by both the CLI and the Studio UI. */
function permissionReport(spec) {
  const { permissions, dropped } = derivePermissions(spec);
  const rows = permissions.map((p) => ({
    permission: p.short,
    why: p.reason,
    feature: p.feature,
    prompt: p.runtime ? 'Yes' : 'No',
    scope: p.attrs.maxSdkVersion ? `Android ≤ ${p.attrs.maxSdkVersion}` : 'All versions',
  }));
  return {
    rows,
    dropped,
    total: rows.length,
    prompts: rows.filter((r) => r.prompt === 'Yes').length,
  };
}


/* ═══ studio/src/designer.js ═══ */
/* ==================================================================== *
 * THE SCREEN DESIGNER  (M5)
 * ====================================================================
 * What this is
 * ------------
 * A phone-first editor for the screens of an app. It edits the same
 * specification object that the generator reads, so what is designed here is
 * what the APK contains — there is no second format and no export step.
 *
 * Three things are deliberately true of everything below:
 *
 *   1. THE PALETTE IS NOT WRITTEN HERE. Every component, every property, its
 *      type, its default, whether it may hold children and whether it needs a
 *      screen-reader label comes from engine/components/library.mjs. Adding a
 *      component there makes it appear here with an editor and validation,
 *      with nothing in this file to update.
 *
 *   2. THE PREVIEW IS NOT A PICTURE. It is drawn from the same numbers the
 *      Android renderer uses (engine/components/scales.mjs) and from the same
 *      component descriptions, so it is a drawing of the app rather than an
 *      impression of it.
 *
 *   3. IT IS HONEST ABOUT ITSELF. The preview is drawn with HTML in a browser;
 *      it is not the compiled APK. It says so, once, in plain words, rather
 *      than pretending to be a device.
 *
 * Editing model: the tree is the truth. Selecting a component shows its
 * properties; changing a property edits the tree; the preview redraws.
 */

const D = {
  screen: null,     // id of the screen being edited
  selected: null,   // id of the selected component
  group: null,      // which palette group is open
  adding: false,    // is the palette showing
  depth: 0,         // recursion guard for the preview
};

const MAX_PREVIEW_DEPTH = 12;

/* ── the specification's screens ────────────────────────────────────────── */

function screensOf(spec) {
  if (!Array.isArray(spec.screens)) spec.screens = [];
  return spec.screens;
}

/** A new screen with a sensible id that does not collide with an existing one. */
function makeScreen(spec, name) {
  const base = (name || 'Screen').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'screen';
  let id = base;
  let n = 2;
  const taken = new Set(screensOf(spec).map((s) => s.id));
  while (taken.has(id)) id = base + (n++);
  return { id, name: name || 'Screen', title: name || 'Screen', showInTabs: true, components: [] };
}

/** A brand new screen with a heading and a sentence, so it is never blank. */
function starterScreen(spec, name, index) {
  const s = makeScreen(spec, name || `Screen ${index + 1}`);
  s.components = [
    { id: nid(s, 'heading'), type: 'Heading', props: { text: s.name } },
    { id: nid(s, 'text'), type: 'Text', props: { text: 'Say what this screen is for. Tap it, then edit its text on the right.' } },
  ];
  return s;
}

/** A component id that is unique inside its screen. */
function nid(screen, prefix) {
  const base = (prefix || 'item').toLowerCase().replace(/[^a-z0-9]+/g, '') || 'item';
  const taken = new Set();
  (function walk(list) {
    for (const n of list || []) { if (n && n.id) taken.add(n.id); walk(n.children); }
  })(screen ? screen.components : []);
  let id = base;
  let n = 2;
  while (taken.has(id)) id = base + (n++);
  return id;
}

function activeScreen(spec) {
  const list = screensOf(spec);
  if (!list.length) return null;
  const found = list.find((s) => s.id === D.screen);
  if (found) return found;
  D.screen = list[0].id;
  return list[0];
}

/* ── finding and moving components ──────────────────────────────────────── */

/**
 * Locate a component by id anywhere in a screen.
 * Returns the node, the list it lives in, its position, and the screen.
 */
function locate(screen, id) {
  let hit = null;
  (function walk(list, parent) {
    if (hit || !list) return;
    for (const [i, node] of list.entries()) {
      if (!node) continue;
      if (node.id === id) { hit = { node, list, index: i, parent }; return; }
      walk(node.children, node);
      if (hit) return;
    }
  })(screen.components, null);
  return hit;
}

/** Where a new component should go: inside the selection if it can hold children. */
function insertTarget(screen) {
  const found = D.selected ? locate(screen, D.selected) : null;
  if (found) {
    const def = COMPONENTS[found.node.type];
    if (def && def.container && !def.single) return { list: found.node.children, parent: found.node.id };
  }
  if (!screen.components) screen.components = [];
  return { list: screen.components, parent: null };
}

function addComponent(screen, type) {
  const def = COMPONENTS[type];
  if (!def) return;
  const { list, parent } = insertTarget(screen);
  if (!list) return;
  const node = { id: nid(screen, type), type, props: {} };
  // Start from the defaults the library declares, so the preview and the app
  // begin in the same place rather than each applying its own fallbacks.
  for (const [key, prop] of Object.entries(def.props || {})) {
    if ('default' in prop) node.props[key] = prop.default;
  }
  if (def.events && def.events.length && !def.a11y?.requiresLabel) {
    node.events = {}; // ready for the action editor, but nothing is chosen yet
  }
  list.push(node);
  D.selected = node.id;
  D.adding = false;
  if (parent) D.selected = node.id;
  return node;
}

function removeComponent(screen, id) {
  const found = locate(screen, id);
  if (!found) return false;
  found.list.splice(found.index, 1);
  D.selected = null;
  return true;
}

function duplicateComponent(screen, id) {
  const found = locate(screen, id);
  if (!found) return false;
  const copy = structuredClone(found.node);
  renameTree(copy, screen);
  found.list.splice(found.index + 1, 0, copy);
  D.selected = copy.id;
  return true;
}

/** Give a copied branch fresh ids, because two components may not share a name. */
function renameTree(node, screen) {
  node.id = nid(screen, node.type);
  for (const child of node.children || []) renameTree(child, screen);
}

function moveComponent(screen, id, delta) {
  const found = locate(screen, id);
  if (!found) return false;
  const next = found.index + delta;
  if (next < 0 || next >= found.list.length) return false;
  const [node] = found.list.splice(found.index, 1);
  found.list.splice(next, 0, node);
  return true;
}

/** Move a component one level out, keeping it directly after its parent. */
function outdentComponent(screen, id) {
  const found = locate(screen, id);
  if (!found || !found.parent) return false;
  const parentFound = locate(screen, found.parent.id);
  if (!parentFound) return false;
  found.list.splice(found.index, 1);
  parentFound.list.splice(parentFound.index + 1, 0, found.node);
  return true;
}

/* ── the tab ────────────────────────────────────────────────────────────── */

/**
 * The shell expects every section to hand back a list of nodes. Returning the
 * wrapper directly used to throw "page(...).filter is not a function" and left
 * the tab showing the previous section, which is a confusing way to fail.
 */
function viewScreens() {
  return [screenDesignerView()];
}

function screenDesignerView() {
  const spec = S.active.spec;
  const list = screensOf(spec);
  const screen = activeScreen(spec);

  const wrap = el('div', { class: 'designer' }, [
    screensForTabsNote(spec, list),
    screenPicker(spec, list),
  ]);

  if (!screen) {
    wrap.append(el('div', { class: 'empty' }, [
      el('p', {}, 'No screens yet.'),
      el('button', { class: 'btn primary', onclick: () => { screensOf(spec).push(starterScreen(spec, 'Home', 0)); touch(); hardUpdate(); } }, 'Add the first screen'),
      el('p', { class: 'sub' }, 'This app is set to native-screens, so it needs at least one screen before it can build.'),
    ]));
    return wrap;
  }

  const findings = screenFindings(spec, screen);

  wrap.append(
    el('div', { class: 'd-cell' }, [
      el('div', { class: 'd-head' }, [
        el('span', { class: 'd-title' }, 'Preview'),
        el('span', { class: 'd-note' }, 'Drawn in the browser from the same numbers the app uses. The installed app is what settles it.'),
      ]),
      renderPreview(screen, spec),
    ]),
    el('div', { class: 'd-cell' }, [
      el('div', { class: 'd-head' }, [
        el('span', { class: 'd-title' }, `Contents of ${screen.name}`),
        el('button', {
          class: 'btn small' + (D.adding ? ' primary' : ''),
          onclick: () => { D.adding = !D.adding; hardUpdate(); },
          'aria-expanded': D.adding ? 'true' : 'false',
        }, D.adding ? 'Close' : '+ Add'),
      ]),
      D.adding ? palette(screen) : outline(screen),
    ]),
  );

  wrap.append(findingsCell(screen, findings));

  if (D.selected) {
    const found = locate(screen, D.selected);
    if (found) wrap.append(el('div', { class: 'd-cell' }, [
      el('div', { class: 'd-head' }, [
        el('span', { class: 'd-title' }, `Edit ${(COMPONENTS[found.node.type] || {}).label || found.node.type}`),
        el('button', { class: 'btn small', onclick: () => { D.selected = null; hardUpdate(); } }, 'Deselect'),
      ]),
      inspector(screen, found),
    ]));
  }

  return wrap;
}

/** Warn when the navigation setting and the screen list disagree. */
function screensForTabsNote(spec, list) {
  const nav = (spec.navigation || {}).type;
  const tabs = list.filter((s) => s.showInTabs !== false);
  if (nav === 'bottom-tabs' && list.length < 2) {
    return el('p', { class: 'd-alert' }, 'Bottom tabs are selected but there is only one screen, so a tab bar would have nothing in it. Either add a screen or change the navigation in the Design tab.');
  }
  if (nav === 'bottom-tabs' && tabs.length > 5) {
    return el('p', { class: 'd-alert' }, `${tabs.length} screens are marked to appear in the tab bar, which holds five. Only the first five will be shown.`);
  }
  if (nav === 'none' && list.length) {
    return el('p', { class: 'd-alert' }, 'This app has screens but no navigation, so nothing can reach them. Choose a navigation style in the Design tab.');
  }
  return el('span', {});
}

/* ── the screen picker ──────────────────────────────────────────────────── */

function screenPicker(spec, list) {
  const row = el('div', { class: 'screen-chips', role: 'tablist', 'aria-label': 'Screens' });
  for (const s of list) {
    const on = s.id === D.screen;
    row.append(el('button', {
      class: 'chip' + (on ? ' on' : ''),
      role: 'tab',
      'aria-selected': on ? 'true' : 'false',
      onclick: () => { D.screen = s.id; D.selected = null; D.adding = false; hardUpdate(); },
    }, [
      el('span', {}, s.name || s.id),
      el('span', { class: 'chip-n' }, String((s.components || []).length)),
    ]));
  }
  row.append(el('button', {
    class: 'chip add',
    onclick: () => {
      const s = starterScreen(spec, null, list.length);
      screensOf(spec).push(s);
      D.screen = s.id;
      D.selected = null;
      touch();
      hardUpdate();
    },
  }, '+ Screen'));
  return row;
}

/* ── the outline ────────────────────────────────────────────────────────── */

function outline(screen) {
  if (!screen.components || !screen.components.length) {
    return el('div', { class: 'empty' }, [
      el('p', {}, 'This screen is empty.'),
      el('button', { class: 'btn primary', onclick: () => { D.adding = true; hardUpdate(); } }, 'Add the first component'),
    ]);
  }
  const tree = el('ul', { class: 'tree', role: 'tree' });
  const rows = [];
  (function walk(list, depth) {
    for (const node of list) {
      if (!node) continue;
      const def = COMPONENTS[node.type] || {};
      const on = node.id === D.selected;
      const row = el('li', { class: 'node' + (on ? ' on' : ''), style: `--depth:${depth}` }, [
        el('button', {
          class: 'node-main',
          role: 'treeitem',
          'aria-selected': on ? 'true' : 'false',
          onclick: () => { D.selected = on ? null : node.id; D.adding = false; hardUpdate(); },
        }, [
          el('span', { class: 'node-name' }, def.label || node.type),
          el('span', { class: 'node-id' }, labelFor(node)),
        ]),
      ]);
      const acts = el('div', { class: 'node-acts' }, [
        iconBtn('↑', 'Move up', () => { moveComponent(screen, node.id, -1); touch(); hardUpdate(); }),
        iconBtn('↓', 'Move down', () => { moveComponent(screen, node.id, 1); touch(); hardUpdate(); }),
        def.container && depth > 0 ? iconBtn('←', 'Move out one level', () => { outdentComponent(screen, node.id); touch(); hardUpdate(); }) : null,
        iconBtn('⧉', 'Duplicate', () => { duplicateComponent(screen, node.id); touch(); hardUpdate(); }),
        iconBtn('✕', 'Delete', () => { removeComponent(screen, node.id); touch(); hardUpdate(); }),
      ]);
      row.append(acts);
      rows.push(row);
      if (node.children && node.children.length) walk(node.children, depth + 1);
    }
  })(screen.components, 0);
  tree.append(...rows);
  return tree;
}

/** The short line of text that identifies a component in a list. */
function labelFor(node) {
  const props = node.props || {};
  for (const key of ['text', 'label', 'title', 'message', 'fallback', 'placeholder']) {
    if (props[key]) return String(props[key]).slice(0, 34);
  }
  if (props.items) return `${String(props.items).split('\n').length} items`;
  return node.id || node.type;
}

function iconBtn(glyph, label, onclick) {
  return el('button', { class: 'ibtn', 'aria-label': label, title: label, onclick }, glyph);
}

/* ── the palette ────────────────────────────────────────────────────────── */

function palette(screen) {
  const groups = GROUPS;
  const open = D.group || groups[0];
  const wrap = el('div', { class: 'palette' }, [
    el('div', { class: 'palette-groups', role: 'tablist', 'aria-label': 'Component groups' },
      groups.map((g) => el('button', {
        class: 'chip' + (g === open ? ' on' : ''),
        role: 'tab',
        'aria-selected': g === open ? 'true' : 'false',
        onclick: () => { D.group = g; hardUpdate(); },
      }, g))),
  ]);
  const items = componentList().filter((c) => c.group === open);
  const grid = el('div', { class: 'palette-grid' });
  for (const c of items) {
    grid.append(el('button', {
      class: 'pitem',
      onclick: () => { addComponent(screen, c.name); touch(); hardUpdate(); toast(`${c.label} added.`); },
    }, [
      el('span', { class: 'pitem-name' }, c.label),
      el('span', { class: 'pitem-sub' }, c.container ? 'holds children' : (c.requiresLabel ? 'needs a label' : c.role)),
    ]));
  }
  const target = insertTarget(screen);
  const targetName = target.parent
    ? ((COMPONENTS[(locate(screen, target.parent) || {}).node?.type] || {}).label || target.parent)
    : 'the screen';
  wrap.append(el('p', { class: 'sub' }, `New components are added inside ${targetName}.`));
  wrap.append(grid);
  return wrap;
}

/* ── the inspector ──────────────────────────────────────────────────────── */

function inspector(screen, found) {
  const node = found.node;
  const def = COMPONENTS[node.type] || {};
  const box = el('div', { class: 'inspector' });

  const nameError = el('p', { class: 'sub err', id: 'node-name-err', hidden: true },
    'Another component in this screen already has that name.');
  box.append(el('div', { class: 'field' }, [
    el('label', { for: 'node-name' }, 'Name for reports'),
    el('input', {
      id: 'node-name', type: 'text', value: node.id || '', autocomplete: 'off',
      oninput: (e) => {
        const v = e.target.value.replace(/[^A-Za-z0-9_-]/g, '');
        const other = v ? locate(screen, v) : null;
        const clash = Boolean(other && other.node !== node);
        e.target.setAttribute('aria-invalid', clash ? 'true' : 'false');
        nameError.hidden = !clash;
        // Two components with one name would make the second take over the
        // first one's behaviour in the app, so the change is refused here with
        // the reason shown. Silently ignoring the keystroke would be worse.
        if (clash) return;
        node.id = v;
        touch();
        redrawPreview();
        refreshFindings();
      },
    }),
    nameError,
    el('p', { class: 'sub' }, 'Used in reports and in the action editor. Letters, numbers, dashes.'),
  ]));

  // properties, generated from the library
  for (const [key, prop] of Object.entries(def.props || {})) {
    if (key === 'visible') continue;
    box.append(propField(screen, node, key, prop));
  }

  // events and their actions
  for (const ev of def.events || []) {
    box.append(eventEditor(screen, node, ev));
  }

  if (def.a11y?.requiresLabel && !(node.a11yLabel || node.props?.a11yLabel)) {
    box.append(el('p', { class: 'd-alert' }, 'This component must carry a screen-reader label before the app will build. Add one above.'));
  }

  box.append(el('div', { class: 'field' }, [
    el('label', { for: 'node-visible' }, 'Visible'),
    el('button', {
      id: 'node-visible', class: 'toggle' + (node.props?.visible !== false ? ' on' : ''),
      'aria-pressed': node.props?.visible !== false ? 'true' : 'false',
      onclick: (e) => {
        node.props = node.props || {};
        node.props.visible = node.props.visible === false;
        touch();
        hardUpdate();
      },
    }, node.props?.visible !== false ? 'Shown' : 'Hidden'),
  ]));

  return box;
}

/** One property control, chosen from the type the library declares. */
function propField(screen, node, key, prop) {
  const value = node.props?.[key] ?? (key === 'a11yLabel' ? node.a11yLabel : undefined);
  const id = `prop-${key}`;
  const set = (v, rerender) => {
    node.props = node.props || {};
    if (v === '' || v === undefined) delete node.props[key];
    else node.props[key] = v;
    touch();
    if (rerender) hardUpdate(); else { redrawPreview(); refreshFindings(); }
  };

  const label = el('label', { for: id }, prop.label || key);
  if (prop.help) label.append(el('span', { class: 'help', title: prop.help }, ' ?'));

  let control;
  switch (prop.type) {
    case 'choice':
      control = kvSelect(String(value ?? prop.default ?? ''), (prop.options || []).map((o) => (Array.isArray(o) ? o : [o, o])), (v) => set(v, false), prop.label || key);
      break;
    case 'boolean':
      control = el('button', {
        id, class: 'toggle' + ((value ?? prop.default) ? ' on' : ''),
        'aria-pressed': (value ?? prop.default) ? 'true' : 'false',
        onclick: () => set(!(value ?? prop.default), true),
      }, (value ?? prop.default) ? 'On' : 'Off');
      break;
    case 'number':
      control = el('input', {
        id, type: 'number', inputmode: 'numeric', value: value ?? prop.default ?? '',
        min: prop.min ?? undefined, max: prop.max ?? undefined,
        oninput: (e) => set(e.target.value === '' ? '' : Number(e.target.value), false),
      });
      break;
    case 'color':
      control = colourInput(id, String(value ?? prop.default ?? ''), (v) => set(v, true));
      break;
    case 'icon':
      control = iconSelect(id, String(value ?? prop.default ?? ''), (v) => set(v, true));
      break;
    case 'list':
      control = el('textarea', {
        id, rows: 4, value: value ?? '',
        oninput: (e) => set(e.target.value, false),
      });
      break;
    default:
      control = el('input', {
        id, type: 'text', value: value ?? prop.default ?? '', placeholder: prop.placeholder || '',
        autocomplete: 'off',
        oninput: (e) => set(e.target.value, false),
      });
  }

  const field = el('div', { class: 'field' }, [label, control]);
  if (prop.required) field.append(el('p', { class: 'sub' }, 'Required. The app will not build without it.'));
  else if (prop.help) field.append(el('p', { class: 'sub' }, prop.help));
  return field;
}

function colourInput(id, value, onchange) {
  const row = el('div', { class: 'colour-row' });
  const swatch = el('input', {
    id, type: 'color', value: /^#[0-9a-fA-F]{6}$/.test(value) ? value : '#2563EB', onchange: (e) => onchange(e.target.value),
  });
  const text = el('input', {
    type: 'text', value, placeholder: 'Theme default', 'aria-label': id + ' as text', autocomplete: 'off',
    oninput: (e) => onchange(e.target.value),
  });
  row.append(swatch, text);
  return row;
}

function iconSelect(id, value, onchange) {
  const pairs = [['', 'No icon'], ...ICON_NAMES.map((n) => [n, `${iconGlyph(n)}  ${n}`])];
  return kvSelect(value, pairs, onchange, id);
}

/* ── events and actions ─────────────────────────────────────────────────── */

function eventEditor(screen, node, ev) {
  const nodeDef = COMPONENTS[node.type] || {};
  const current = (node.events || {})[ev] || { kind: 'none', props: {} };
  const evLabel = (EVENTS[ev] || {}).label || ev;
  const box = el('div', { class: 'field event' }, [el('label', {}, `When: ${evLabel}`)]);

  const choices = [['none', 'Do nothing'], ...(nodeDef.actions || []).map((a) => [a, ACTIONS[a].label || a])];
  box.append(kvSelect(current.kind || 'none', choices, (kind) => {
    node.events = node.events || {};
    node.events[ev] = kind === 'none' ? { kind: 'none', props: {} } : { kind, props: {} };
    touch();
    hardUpdate();
  }, `${ev} action`));

  if (current.kind && current.kind !== 'none' && ACTIONS[current.kind]) {
    const action = ACTIONS[current.kind];
    for (const [key, prop] of Object.entries(action.props || {})) {
      const id = `act-${ev}-${key}`;
      let control;
      const set = (v) => {
        node.events[ev].props = node.events[ev].props || {};
        if (v === '') delete node.events[ev].props[key]; else node.events[ev].props[key] = v;
        touch();
        redrawPreview();
      };
      if (prop.type === 'choice') control = kvSelect(String(current.props?.[key] ?? ''), (prop.options || []).map((o) => (Array.isArray(o) ? o : [o, o])), set, prop.label || key);
      else control = el('input', { id, type: 'text', value: current.props?.[key] ?? '', placeholder: prop.placeholder || '', autocomplete: 'off', oninput: (e) => set(e.target.value) });
      box.append(el('div', { class: 'sub-field' }, [
        el('label', { for: id }, prop.label || key + (prop.required ? ' (required)' : '')),
        control,
      ]));
    }
    if (action.needsCapability) {
      const has = (screen.__capabilities || []);
      void has;
    }
  }
  return box;
}

/* ── findings for this screen ───────────────────────────────────────────── */

/**
 * The list of things that need attention.
 *
 * It carries an id so it can be replaced on its own: while a property is being
 * typed the whole page must not be redrawn, because that would take the cursor
 * out of the field — but the findings must still change the moment the problem
 * is fixed. Leaving a solved error on screen teaches people to ignore errors.
 */
function findingsCell(screen, findings) {
  const cell = el('div', { class: 'd-cell', id: 'designer-findings' }, [
    el('div', { class: 'd-head' }, [
      el('span', { class: 'd-title' }, findings.length
        ? `What needs attention (${findings.length})`
        : 'Nothing needs attention here'),
    ]),
  ]);
  if (findings.length) cell.append(el('div', { class: 'findings' }, findings.slice(0, 12).map(findingRow(screen))));
  else cell.append(el('p', { class: 'sub' }, 'No problems found in this screen.'));
  return cell;
}

function refreshFindings() {
  const cell = document.getElementById('designer-findings');
  if (!cell) return;
  const spec = S.active.spec;
  const screen = activeScreen(spec);
  if (!screen) return;
  const findings = screenFindings(spec, screen);
  const fresh = findingsCell(screen, findings);
  cell.replaceWith(fresh);
}

function screenFindings(spec, screen) {
  const out = [];
  validateScreens(spec, out);
  const prefix = `screens[${screensOf(spec).indexOf(screen)}].components`;
  return out.filter((f) => String(f.path || '').startsWith(prefix));
}

function findingRow(screen) {
  return (f) => {
    const row = el('div', { class: 'finding ' + (f.severity === 'error' ? 'err' : 'warn') }, [
      el('p', { class: 'finding-msg' }, f.message),
      el('p', { class: 'sub' }, f.path),
    ]);
    const actions = el('div', { class: 'finding-acts' });
    if (f.fix && f.fix.value !== undefined) {
      actions.append(el('button', {
        class: 'btn small', onclick: () => {
          // The fix says exactly which property to set. Applying it is a single
          // assignment, so it cannot surprise anyone.
          const node = locateById(screen, (f.reveal || {}).nodeId);
          if (!node) return;
          const parts = String(f.fix.path).split('.');
          if (parts[parts.length - 1] === 'type') node.type = f.fix.value;
          else {
            node.props = node.props || {};
            const key = parts[parts.length - 1] === 'a11yLabel' ? 'a11yLabel' : parts[parts.length - 1];
            node.props[key] = f.fix.value;
          }
          touch(); hardUpdate();
        },
      }, f.fix.label || 'Apply the fix'));
    }
    if (f.reveal && f.reveal.nodeId) {
      actions.append(el('button', {
        class: 'btn small', onclick: () => { D.selected = f.reveal.nodeId; hardUpdate(); },
      }, 'Show me'));
    }
    if (actions.childNodes.length) row.append(actions);
    return row;
  };
}

function locateById(screen, id) {
  if (!id) return null;
  const found = locate(screen, id);
  return found ? found.node : null;
}

/* ── the preview ────────────────────────────────────────────────────────── */
/*
 * A drawing of the screen, built from the same component descriptions and the
 * same scale numbers as the Android renderer. Kept deliberately close to the
 * Android layout rules: a column of blocks, the same spacing scale, the same
 * text sizes, the same corner radii. Where the two can differ — fonts, exact
 * metrics — the preview does not pretend otherwise.
 */

function renderPreview(screen, spec) {
  const th = spec.theme || {};
  const dark = (spec.android || {}).theme === 'dark' || luminance(th.background || '#FFFFFF') < 0.5;
  const host = el('div', { class: 'device' + (dark ? ' dark' : '') });
  const frame = el('div', { class: 'device-screen', id: 'preview-root', style: `background:${th.background || '#FFFFFF'};color:${th.onSurface || '#111827'}` });

  // status bar, matching what the app actually reserves
  frame.append(el('div', { class: 'sbar', style: `color:${th.onSurface || '#111827'}` }, [
    el('span', {}, '9:41'),
    el('span', { class: 'icons' }, [el('i', { class: 'sig' }), el('i', { class: 'batt' })]),
  ]));

  const body = el('div', { class: 'pv-body' });
  if (!screen.components || !screen.components.length) {
    body.append(el('p', { class: 'pv-empty' }, 'This screen is empty.'));
  } else {
    for (const node of screen.components) body.append(previewNode(node, spec, 0));
  }
  frame.append(body);

  // the navigation the app will show, drawn so it is not a surprise
  const nav = (spec.navigation || {}).type;
  if (nav === 'bottom-tabs') {
    const tabs = screensOf(spec).filter((s) => s.showInTabs !== false).slice(0, 5);
    const bar = el('div', { class: 'pv-nav', style: `background:${th.surface || '#F9FAFB'};color:${th.onSurface || '#111827'}` });
    for (const t of tabs) {
      bar.append(el('span', { class: 'pv-nav-item' + (t.id === screen.id ? ' on' : '') }, t.name || t.id));
    }
    frame.append(bar);
  }
  host.append(frame);
  host.append(el('p', { class: 'pv-caption' }, `Preview of “${screen.name}” as the app will draw it. This is a browser drawing: check the real screen on your phone before you rely on it.`));
  return host;
}

/** Remove and re-add just the device body, so typing does not lose focus. */
function redrawPreview() {
  const root = $('#preview-root');
  if (!root) return;
  const spec = S.active.spec;
  const screen = activeScreen(spec);
  if (!screen) return;
  const body = $('.pv-body', root) || root;
  body.textContent = '';
  if (!screen.components || !screen.components.length) {
    body.append(el('p', { class: 'pv-empty' }, 'This screen is empty.'));
    return;
  }
  for (const node of screen.components) body.append(previewNode(node, spec, 0));
}

const SP = SPACINGS;
const TS = TEXT_SIZES;
const RD = RADII;
const HT = HEIGHTS;

function px(n) { return `${n}px`; }

function previewNode(node, spec, depth) {
  if (!node || depth > MAX_PREVIEW_DEPTH) return el('span', {});
  const th = spec.theme || {};
  const p = node.props || {};
  if (p.visible === false) return el('span', {}, '');
  const label = node.a11yLabel || p.a11yLabel;
  const wrap = el('div', { class: 'pv-node', 'data-type': node.type, 'data-id': node.id });
  if (label) wrap.setAttribute('aria-label', label);
  const pad = p.padding && p.padding !== 'none' ? px(SP[p.padding] || 0) : '';
  const mar = p.margin && p.margin !== 'none' ? px(SP[p.margin] || 0) : '';
  if (mar) wrap.style.margin = `${mar} 0`;
  const kids = () => (node.children || []).map((c) => previewNode(c, spec, depth + 1));

  switch (node.type) {
    case 'Screen':
      break;
    case 'Container': {
      wrap.style.display = 'flex';
      wrap.style.flexDirection = p.direction === 'row' ? 'row' : 'column';
      wrap.style.gap = px(SP[p.gap] ?? SP.md);
      if (pad) wrap.style.padding = pad;
      if (p.backgroundColor) wrap.style.background = p.backgroundColor;
      wrap.append(...kids());
      break;
    }
    case 'Card': {
      wrap.style.background = th.surface || '#F9FAFB';
      wrap.style.borderRadius = px(RD[p.radius] ?? RD.lg);
      wrap.style.padding = pad || px(SP.md);
      if (p.elevated !== false) wrap.style.boxShadow = '0 2px 10px rgba(0,0,0,.12)';
      wrap.append(...kids());
      break;
    }
    case 'Divider':
      wrap.style.height = p.thickness === 'thick' ? '3px' : '1px';
      wrap.style.background = withAlpha(th.onSurface || '#111827', 0.25);
      break;
    case 'Spacer':
      wrap.style.height = px(HT[p.height] ?? 0) && px(SP[p.height] ?? SP.md);
      break;
    case 'Text':

      wrap.append(bar);
      break;
    }
    case 'Drawer':
      wrap.append(el('div', { class: 'pv-drawer' }, [
        el('p', { class: 'pv-drawer-t' }, p.title || 'Menu'),

      ]));
      break;
    case 'Dialog':
      wrap.append(el('div', { class: 'pv-dialog' }, [
        el('p', { class: 'pv-dialog-t' }, p.title || 'Notice'),
        el('p', { class: 'sub' }, p.message || ''),
        el('div', { class: 'pv-dialog-acts' }, [
          el('span', { class: 'pv-btn ghost' }, p.cancelLabel || 'Cancel'),
          el('span', { class: 'pv-btn primary' }, p.confirmLabel || 'OK'),
        ]),
      ]));
      break;
    case 'BottomSheet':
      wrap.append(el('div', { class: 'pv-sheet' }, [
        el('span', { class: 'pv-grab' }),
        el('p', {}, p.title || 'Sheet'),
      ]));
      break;
    case 'FloatingButton':
      wrap.append(el('button', {
        class: 'pv-fab', 'aria-label': label || p.label || 'Action',
        onclick: (e) => { e.preventDefault(); showActionToast(node, 'onClick'); },
      }, p.label ? `${iconGlyph(p.icon)} ${p.label}` : iconGlyph(p.icon)));
      break;
    default:
      wrap.append(...kids());
  }
  return wrap;
}

const screen_safe = (s) => String(s || 'x').replace(/[^A-Za-z0-9_-]/g, '');

/**
 * What a tap would do, said out loud in the preview.
 * A designed screen only proves itself when its actions are exercised, so the
 * preview reports what the real app would do rather than staying silent.
 */
function showActionToast(node, eventName) {
  const action = (node.events || {})[eventName];
  if (!action || !action.kind || action.kind === 'none') {
    toast(`${(COMPONENTS[node.type] || {}).label || node.type}: nothing is set to happen yet.`);
    return;
  }
  const a = ACTIONS[action.kind] || {};
  const props = action.props || {};
  const detail = Object.entries(props).filter(([, v]) => v).map(([k, v]) => `${k}: ${String(v).slice(0, 40)}`).join(' · ');
  toast(`${a.label || action.kind}${detail ? ' — ' + detail : ''}`, 3400);
}

/** Mix a colour towards transparent, for borders and hairlines. */
function withAlpha(hex, alpha) {
  const m = /^#([0-9a-fA-F]{6})$/.exec(String(hex));
  if (!m) return `rgba(17,24,39,${alpha})`;
  const n = parseInt(m[1], 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

/* ── keeping the preview honest about the app ───────────────────────────── */

/**
 * A short, verifiable statement about what is in the app right now.
 * Used by the Preview tab and by the test suite, so the claim "the preview
 * matches the app" is something that can be checked rather than asserted.
 */
function screenSummary(spec) {
  const list = screensOf(spec);
  let nodes = 0;
  let actions = 0;
  (function walk(l) {
    for (const n of l || []) {
      if (!n) continue;
      nodes++;
      actions += Object.values(n.events || {}).filter((a) => a && a.kind && a.kind !== 'none').length;
      walk(n.children);
    }
  })(list.flatMap((s) => s.components || []));
  return { screens: list.length, components: nodes, actions, mode: (spec.app || {}).mode || 'webview' };
}

   ---------------------------------------------------------------------------
   A phone-first visual editor for the Project Specification.

   The important architectural point: this file IMPORTS the same validator and
   permission engine that CI and the CLI use. It does not reimplement them. If
   it did, the Studio and the build would eventually disagree about what is
   valid, and the user would be told "looks fine" by one and "refused" by the
   other. One engine, three front ends (CLI, CI, Studio).

/* ── tiny DOM helpers ──────────────────────────────────────────────────── */
const $ = (sel, root = document) => root.querySelector(sel);

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null) continue;
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}

/** Deep merge a template's partial spec over the defaults. */
function mergeSpec(base, over) {
  if (Array.isArray(over)) return over.slice();
  if (over && typeof over === 'object') {
    const out = { ...(base && typeof base === 'object' && !Array.isArray(base) ? base : {}) };
    for (const [k, v] of Object.entries(over)) {
      out[k] = (v && typeof v === 'object' && !Array.isArray(v)) ? mergeSpec(out[k], v) : (Array.isArray(v) ? v.slice() : v);
    }
    return out;
  }
  return over === undefined ? base : over;
}

function specFromTemplate(tpl, name) {
  const spec = mergeSpec(defaultSpec(), tpl.spec || {});
  spec.specVersion = SPEC_VERSION;
  const slug = (name || tpl.name).toLowerCase().replace(/[^a-z0-9]+/g, '');
  spec.identity.appName = name || tpl.name;
  spec.identity.packageName = 'com.example.' + (slug.slice(0, 20) || 'myapp');
  return spec;
}

function persist() {
  const idx = S.projects.findIndex((p) => p.id === S.active.id);
  if (idx >= 0) S.projects[idx] = S.active; else S.projects.push(S.active);
  const ok = store.save(S.projects);
  try { localStorage.setItem(LS_ACTIVE, S.active.id); } catch { /* ignore */ }
  return ok;
}

function touch() {
  S.active.updatedAt = new Date().toISOString();
  if (!persist()) toast('Warning: could not save to this browser\'s storage.');
}

  const t = $('#toast');

}

function viewCaps() {
  const spec = S.active.spec;
  const on = new Set(spec.capabilities || []);
  const rep = permissionReport(spec);
  const derived = derivePermissions(spec);

  const toggles = Object.entries(CAPABILITIES)
    .filter(([, c]) => !c.implicit)
    .map(([key, cap]) => el('div', { class: 'opt' }, [
      el('div', { class: 'txt' }, [
        el('div', { class: 'name' }, cap.label),
        el('div', { class: 'why' }, cap.reason),
        cap.disclosure ? el('span', { class: 'cost' }, cap.disclosure) : null,
        cap.requiresSetup ? el('span', { class: 'cost' }, 'Needs setup: ' + cap.requiresSetup) : null,
        cap.highRisk ? el('span', { class: 'cost' }, 'High risk: Google Play requires a written justification.') : null,
      ]),
      el('div', { class: 'sw' }, [
        el('input', {
          type: 'checkbox', checked: on.has(key), role: 'switch',
          'aria-label': cap.label,
          onchange: (e) => {
            const s = new Set(spec.capabilities || []);
            e.target.checked ? s.add(key) : s.delete(key);
            spec.capabilities = [...s];
            touch(); hardUpdate();
          },
        }),
        el('span', { class: 'track' }), el('span', { class: 'knob' }),
      ]),
    ]));

  const permRows = rep.rows.length
    ? rep.rows.map((r) => el('div', { class: 'perm' }, [

  return [
    card('Capabilities', toggles,

      ...permRows,

    // Kept in its own card on purpose: mixing "what it asks for" with "what it
    // refuses to ask for" makes the permission table unreadable, and the
    // refusal list is the actual evidence that minimisation is working.
    derived.dropped.length

  ].filter(Boolean);

function colourField(label, key, theme) {

/**
 * A dropdown for a fixed set of choices, used all over the Studio.
 *
 * A browser only ever carries strings out of a <select>, so the value is looked
 * back up in the list it came from and returned as it was written. The earlier
 * version ran every value through Number(), which turned "portrait" into NaN:
 * choosing a screen orientation silently wrote NaN into the specification and
 * the app became "Blocked" for no reason the user could see.
 */
function kvSelect(current, pairs, onchange, ariaLabel) {
  const sel = el('select', {
    'aria-label': ariaLabel,
    onchange: (e) => {
      const i = pairs.findIndex(([v]) => String(v) === e.target.value);
      onchange(i >= 0 ? pairs[i][0] : e.target.value);
    },
  }, pairs.map(([v, l]) => el('option', { value: String(v), selected: String(current) === String(v) }, l)));
  return el('div', { class: 'selectwrap' }, sel);
}

function chipBtn(label, on, onclick) {
  const b = el('button', { class: 'chip' + (on ? ' pass' : ''), style: 'cursor:pointer;min-height:34px', onclick }, label);
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  return b;
}

function detailsAdvanced(summary, kids) {
  return el('details', { class: 'adv' }, el('summary', {}, summary), ...kids);
}

function luminance(hex) {
  const c = String(hex || '#ffffff').replace('#', '');
  const full = c.length === 3 ? c.split('').map((x) => x + x).join('') : c;
  const n = parseInt(full.slice(0, 6), 16);
  if (!Number.isFinite(n)) return 1;
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {
    const s = v / 255; return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
const lighten = (hex) => {
  const c = String(hex).replace('#', ''); const n = parseInt(c.length === 3 ? c.split('').map((x) => x + x).join('') : c, 16);
  const f = (v) => Math.round(v + (255 - v) * 0.92).toString(16).padStart(2, '0');
  return Number.isFinite(n) ? `#${f((n >> 16) & 255)}${f((n >> 8) & 255)}${f(n & 255)}` : '#ffffff';
};
const darken = (hex) => {
  const c = String(hex).replace('#', ''); const n = parseInt(c.length === 3 ? c.split('').map((x) => x + x).join('') : c, 16);
  const f = (v) => Math.round(v * 0.18).toString(16).padStart(2, '0');
  return Number.isFinite(n) ? `#${f((n >> 16) & 255)}${f((n >> 8) & 255)}${f(n & 255)}` : '#111111';
};

/* ── import / export ───────────────────────────────────────────────────── */
function downloadSpec() {
  const blob = new Blob([JSON.stringify(S.active.spec, null, 2) + '\n'], { type: 'application/json' });
  const a = el('a', { href: URL.createObjectURL(blob), download: 'spec.json' });
  document.body.append(a); a.click(); a.remove();
  toast('Saved spec.json');
}

async function copySpec() {
  const text = JSON.stringify(S.active.spec, null, 2);
  try { await navigator.clipboard.writeText(text); toast('Specification copied'); }
  catch { toast('Copy failed — select the text manually.'); }
}

function importSpec() {
  const input = el('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
  input.addEventListener('change', async () => {
    const f = input.files?.[0];
    if (!f) return;
    try {
      const spec = JSON.parse(await f.text());
      S.active = { id: uid(), name: spec.identity?.appName || 'Imported', spec, updatedAt: new Date().toISOString() };
      persist(); renderActive();
      const r = check();
      toast(r.blocked ? `Imported with ${r.blocking.length} blocking problem(s).` : 'Imported and valid.');
    } catch (e) {
      toast('That file is not valid JSON.');
    }
    input.remove();
  });
  document.body.append(input); input.click();
}

/* ── GitHub connection + build ─────────────────────────────────────────── */
function openTokenSheet() {
  const dlg = el('div', { class: 'card', style: 'position:fixed;inset:auto var(--s4) var(--s4);z-index:70;box-shadow:0 20px 60px rgba(0,0,0,.6);margin:0' }, [
    el('h2', {}, 'Connect GitHub'),
    el('p', { class: 'hint' },
      'To start a build from your phone, the Studio needs permission to commit the specification to your repository. '
      + 'Use a fine-grained token limited to that one repository, with Contents: Read and write and Actions: Read and write. '
      + 'It is stored only in this browser and is only ever sent to api.github.com.'),
    field('Token', el('input', {
      type: 'password', placeholder: 'github_pat_…', autocomplete: 'off', spellcheck: 'false',
      'aria-label': 'GitHub token',
    })),
    el('div', { class: 'row' }, [
      el('button', { class: 'btn primary', onclick: () => {
        const v = $('input[type=password]', dlg).value.trim();
        if (!v) { toast('Paste a token first.'); return; }
        store.setToken(v);
        dlg.remove();
        hardUpdate();
        toast('Connected. Starting builds from here is now possible.');
      } }, 'Save'),
      el('button', { class: 'btn ghost', onclick: () => dlg.remove() }, 'Cancel'),
    ]),
  ]);
  document.body.append(dlg);
}

async function startBuild() {
  const token = store.token();
  const repo = store.repo() || 'deepsilence10161-source/App-mint-';
  if (!token) { openTokenSheet(); return; }

  const path = `apps/studio/${(S.active.spec.identity.packageName || 'app').split('.').pop()}/spec.json`;
  const api = `https://api.github.com/repos/${repo}/contents/${path}`;
  const headers = {
    Authorization: `Bearer ${token}`,
    Accept: 'application/vnd.github+json',
    'Content-Type': 'application/json',
  };
  toast('Sending the specification…');

  try {
    // Read the current file first so we send the correct sha. Without it GitHub
    // rejects the write, and a blind overwrite is not something to attempt.
    let sha;
    const head = await fetch(api + '?ref=main', { headers });
    if (head.ok) sha = (await head.json()).sha;
    else if (head.status !== 404) throw new Error(`GitHub returned ${head.status} while reading the file.`);

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(S.active.spec, null, 2) + '\n')));
    const body = { message: `spec: update ${S.active.spec.identity.appName} from the Studio`, content, branch: 'main' };
    if (sha) body.sha = sha;

    const res = await fetch(api, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (!res.ok) {
      const detail = await res.json().catch(() => ({}));
      throw new Error(detail.message || `GitHub returned ${res.status}.`);
    }

    toast('Committed. The build is starting…');

    // Watch the run so the screen shows something real instead of a static claim.
    const since = Date.now() - 5000;
    for (let i = 0; i < 40; i++) {
      await new Promise((r2) => setTimeout(r2, 3000));
      const runs = await fetch(
        `https://api.github.com/repos/${repo}/actions/runs?per_page=5&event=push`,
        { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } },
      ).then((x) => (x.ok ? x.json() : null)).catch(() => null);
      const run = runs?.workflow_runs?.find((x) => new Date(x.created_at).getTime() > since);
      if (run) { S.lastRun = run; hardUpdate(); break; }
    }
  } catch (e) {
    toast(e.message || 'Could not reach GitHub.', 5000);
  }
}

/* ── boot ──────────────────────────────────────────────────────────────── */
async function boot(templatesData) {
  S.templates = templatesData || { templates: [] };
  // Saved projects may predate a schema change, so they are re-validated on
  // load rather than trusted. An old project that no longer fits simply shows
  // its findings instead of failing silently or crashing the Studio.
  S.projects = (store.load() || []).map((p) => {
    const d = defaultSpec();
    const merged = mergeSpec(d, p.spec || {});
    merged.specVersion = SPEC_VERSION;
    return { ...p, spec: merged };
  });

  const shell = $('#main');
  shell.replaceWith(main);
  main.id = 'main';

  let activeId = null;
  try { activeId = localStorage.getItem(LS_ACTIVE); } catch { /* ignore */ }
  const found = S.projects.find((p) => p.id === activeId) || S.projects[0];
  if (found) { S.active = found; renderActive(); } else { renderPicker(); }

  $('#newproj').addEventListener('click', () => { renderPicker(); });
  $('#importproj').addEventListener('click', importSpec);
}
