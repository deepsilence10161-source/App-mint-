<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070B16">
<meta name="description" content="App Mint Studio — design an Android app from your phone. Free, offline, no account, no AI.">
<title>App Mint Studio</title>
<style>/* ============================================================================
   App Mint Studio — design system
   Mobile-first, because the Studio is used from a phone.
   No external fonts, no CDN, no images: everything is inline SVG or system
   fonts, so the whole thing works offline.
   ========================================================================= */

*, *::before, *::after { box-sizing: border-box; }

:root {
  /* ── colour tokens ─────────────────────────────────────────────────────── */
  --bg:          #070B16;
  --bg-raised:   #0E1424;
  --card:        #141B2E;
  --card-hi:     #1B2338;
  --line:        #232D47;
  --line-soft:   #1A2237;
  --fg:          #E9EEFB;
  --fg-dim:      #98A6C2;
  --fg-faint:    #64748B;

  --brand:       #38BDF8;
  --brand-ink:   #04212E;
  --brand-soft:  rgba(56, 189, 248, .12);

  --pass:   #34D399;
  --warn:   #FBBF24;
  --fail:   #FB7185;
  --info:   #93C5FD;

  /* ── spacing scale (4pt) ───────────────────────────────────────────────── */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;

  /* ── radius scale ──────────────────────────────────────────────────────── */
  --r1: 6px; --r2: 10px; --r3: 14px; --r4: 18px; --r5: 24px; --rpill: 999px;

  /* ── type scale ────────────────────────────────────────────────────────── */
  --t-xs: 11px; --t-sm: 12.5px; --t-md: 14px; --t-lg: 16px;
  --t-xl: 20px; --t-2xl: 26px;

  /* ── motion. Short, and only where it communicates state. ──────────────── */
  --ease: cubic-bezier(.2, .8, .25, 1);
  --fast: 120ms; --med: 200ms;

  --tap: 44px; /* minimum touch target */
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

html {
  -webkit-text-size-adjust: 100%;
  /* Anything scrolled into view must clear the fixed bottom navigation.
     Without this, a control near the end of a page lands behind the tab bar and
     cannot be tapped — found when a browser test could not click the advanced
     section. */
  scroll-padding-bottom: calc(120px + env(safe-area-inset-bottom));
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  font-size: var(--t-md);
  line-height: 1.5;
  min-height: 100dvh;
  overscroll-behavior-y: contain;
}

/* ── layout ──────────────────────────────────────────────────────────────── */
.app { display: flex; flex-direction: column; min-height: 100dvh; max-width: 720px; margin-inline: auto; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: var(--s3);
  padding: max(var(--s3), env(safe-area-inset-top)) var(--s4) var(--s3);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-soft);
}
.topbar h1 { font-size: var(--t-lg); margin: 0; font-weight: 700; letter-spacing: -.01em; flex: 1; min-width: 0; }
.topbar .proj { display: block; font-size: var(--t-xs); color: var(--fg-faint); font-weight: 500; letter-spacing: 0; }

.mark {
  width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
  background: linear-gradient(135deg, var(--brand), #818CF8);
}

main { flex: 1; padding: var(--s4) var(--s4) calc(128px + env(safe-area-inset-bottom)); }

.tabpage { display: none; animation: rise var(--med) var(--ease); }
.tabpage.on { display: block; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ── bottom navigation ───────────────────────────────────────────────────── */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; justify-content: center; gap: 2px;
  padding: var(--s2) var(--s2) max(var(--s2), env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg-raised) 94%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.tabbar .inner { display: flex; width: 100%; max-width: 720px; }
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: 0; color: var(--fg-faint);
  font-size: var(--t-xs); font-weight: 600; font-family: inherit;
  padding: var(--s2) 0; min-height: var(--tap); cursor: pointer;
  border-radius: var(--r2); transition: color var(--fast) var(--ease), background var(--fast) var(--ease);
}
.tab svg { width: 20px; height: 20px; stroke-width: 1.9; }
.tab[aria-selected="true"] { color: var(--brand); background: var(--brand-soft); }
.tab:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ── cards ───────────────────────────────────────────────────────────────── */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r4);
  padding: var(--s4); margin-bottom: var(--s3);
}
.card > h2 {
  font-size: var(--t-sm); font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--fg-dim); margin: 0 0 var(--s3);
}
.card .hint { font-size: var(--t-sm); color: var(--fg-faint); margin: 0 0 var(--s3); }
.card.flat { background: var(--bg-raised); }

/* ── form controls ───────────────────────────────────────────────────────── */
.field { margin-bottom: var(--s4); }
.field:last-child { margin-bottom: 0; }
.field > label {
  display: block; font-size: var(--t-sm); font-weight: 600;
  color: var(--fg-dim); margin-bottom: var(--s2);
}
.field .sub { font-size: var(--t-xs); color: var(--fg-faint); margin-top: 5px; display: block; }

input[type=text], input[type=url], input[type=number], input[type=password], select, textarea {
  width: 100%; font-family: inherit; font-size: var(--t-md);
  color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: var(--r2);
  padding: 12px 13px; min-height: var(--tap);
  transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
input::placeholder { color: var(--fg-faint); }
select { appearance: none; background-image: none; padding-right: 34px; }
.selectwrap { position: relative; }
.selectwrap::after {
  content: ""; position: absolute; right: 13px; top: 50%;
  width: 7px; height: 7px; margin-top: -5px; pointer-events: none;
  border-right: 2px solid var(--fg-faint); border-bottom: 2px solid var(--fg-faint);
  transform: rotate(45deg);
}
textarea { min-height: 96px; resize: vertical; font-size: var(--t-sm); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  font-family: inherit; font-size: var(--t-md); font-weight: 650;
  border-radius: var(--r2); border: 1px solid transparent;
  padding: 13px 18px; min-height: var(--tap); cursor: pointer;
  transition: transform var(--fast) var(--ease), opacity var(--fast) var(--ease);
  width: 100%;
}
.btn:active { transform: scale(.985); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.ghost { background: var(--card-hi); color: var(--fg); border-color: var(--line); }
.btn.danger { background: transparent; color: var(--fail); border-color: color-mix(in srgb, var(--fail) 40%, transparent); }
.btn.sm { padding: 9px 13px; font-size: var(--t-sm); min-height: 38px; width: auto; }
.row { display: flex; gap: var(--s2); }
.row > * { flex: 1; }

/* ── switch ──────────────────────────────────────────────────────────────── */
.opt {
  display: flex; align-items: flex-start; gap: var(--s3);
  padding: var(--s3) 0; border-bottom: 1px solid var(--line-soft);
}
.opt:last-child { border-bottom: 0; }
.opt .txt { flex: 1; min-width: 0; }
.opt .name { font-size: var(--t-md); font-weight: 600; }
.opt .why { font-size: var(--t-sm); color: var(--fg-faint); margin-top: 2px; }
.opt .cost { font-size: var(--t-xs); color: var(--warn); margin-top: 4px; display: block; }

.sw { flex: 0 0 auto; position: relative; width: 46px; height: 28px; margin-top: 2px; }
.sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sw .track {
  position: absolute; inset: 0; border-radius: var(--rpill);
  background: var(--line); transition: background var(--med) var(--ease); pointer-events: none;
}
.sw .knob {
  position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--fg-dim); transition: transform var(--med) var(--ease), background var(--med) var(--ease);
  pointer-events: none;
}
.sw input:checked ~ .track { background: var(--brand); }
.sw input:checked ~ .knob { transform: translateX(18px); background: #fff; }
.sw input:focus-visible ~ .track { box-shadow: 0 0 0 3px var(--brand-soft); }

/* ── colour swatch ───────────────────────────────────────────────────────── */
.swatch { display: flex; align-items: center; gap: var(--s3); }
.swatch input[type=color] {
  width: 46px; height: 46px; padding: 2px; border: 1px solid var(--line);
  border-radius: var(--r2); background: var(--bg); cursor: pointer; flex: 0 0 auto;
}
.swatch input[type=text] { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--t-sm); text-transform: uppercase; }

/* ── chips ───────────────────────────────────────────────────────────────── */
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip {
  font-size: var(--t-xs); font-weight: 650; padding: 5px 10px; border-radius: var(--rpill);
  background: var(--card-hi); color: var(--fg-dim); border: 1px solid var(--line);
}
.chip.pass { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 35%, transparent); background: color-mix(in srgb, var(--pass) 12%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.chip.fail { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 35%, transparent); background: color-mix(in srgb, var(--fail) 12%, transparent); }

/* ── findings ────────────────────────────────────────────────────────────── */
.finding { display: flex; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--line-soft); }
.finding:last-child { border-bottom: 0; }
.finding .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: 0 0 auto; }
.finding .dot.critical, .finding .dot.error { background: var(--fail); }
.finding .dot.warning { background: var(--warn); }
.finding .dot.info { background: var(--info); }
.finding .msg { font-size: var(--t-md); }
.finding .meta { font-size: var(--t-xs); color: var(--fg-faint); margin-top: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.finding .fixbtn { margin-top: var(--s2); }

.layerline {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s2) 0; font-size: var(--t-sm);
}
.layerline .nm { flex: 1; color: var(--fg-dim); }
.layerline .n { color: var(--fg-faint); font-variant-numeric: tabular-nums; }

/* ── permission table ────────────────────────────────────────────────────── */
.perm { padding: var(--s3) 0; border-bottom: 1px solid var(--line-soft); }
.perm:last-child { border-bottom: 0; }
.perm .top { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
.perm .pname { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--t-sm); font-weight: 600; }
.perm .why { font-size: var(--t-sm); color: var(--fg-dim); margin-top: 3px; }
.perm .feat { font-size: var(--t-xs); color: var(--fg-faint); margin-top: 2px; }
.dropped { font-size: var(--t-sm); color: var(--fg-faint); padding: 4px 0; }
.dropped code { color: var(--fg-dim); }

/* ── device preview ──────────────────────────────────────────────────────── */
.stage { display: flex; justify-content: center; padding: var(--s2) 0 var(--s4); }
.device {
  position: relative; width: 264px; height: 552px; flex: 0 0 auto;
  border-radius: 38px; padding: 10px;
  background: #05070d; border: 1px solid var(--line);
  box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.04);
  transition: width var(--med) var(--ease), height var(--med) var(--ease);
}
.device.landscape { width: 480px; height: 250px; border-radius: 26px; }
.device .notch {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  width: 62px; height: 5px; border-radius: var(--rpill); background: #1c2333; z-index: 3;
}
.device.landscape .notch { width: 5px; height: 46px; top: 50%; left: 12px; transform: translateY(-50%); }
.screen {
  width: 100%; height: 100%; border-radius: 28px; overflow: hidden;
  position: relative; display: flex; flex-direction: column;
  background: var(--pv-bg, #fff); color: var(--pv-fg, #111);
}
.device.landscape .screen { border-radius: 18px; }

.sbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 14px 3px; font-size: 10px; font-weight: 700;
  color: var(--pv-sb, #111); flex: 0 0 auto;
}
.sbar .icons { display: flex; gap: 4px; align-items: center; }
.sbar .icons i { display: block; background: currentColor; border-radius: 1px; }
.sbar .sig { width: 12px; height: 8px; clip-path: polygon(0 100%, 100% 0, 100% 100%); }
.sbar .batt { width: 17px; height: 8px; border-radius: 2px; opacity: .9; }

.pv-body { flex: 1; overflow-y: auto; padding: 10px 13px; }
.pv-body::-webkit-scrollbar { width: 0; }
.pv-h1 { font-size: 17px; font-weight: 700; margin: 4px 0 5px; letter-spacing: -.01em; }
.pv-p { font-size: 11.5px; opacity: .68; margin: 0 0 11px; line-height: 1.45; }
.pv-card {
  border-radius: 11px; padding: 10px; margin-bottom: 8px;
  border: 1px solid color-mix(in srgb, var(--pv-fg) 12%, transparent);
  background: color-mix(in srgb, var(--pv-fg) 5%, transparent);
}
.pv-card .t { font-size: 12px; font-weight: 650; margin: 0 0 4px; }
.pv-card .d { font-size: 10.5px; opacity: .6; margin: 0; line-height: 1.4; }
.pv-btn {
  display: block; width: 100%; text-align: center; font-size: 12px; font-weight: 650;
  padding: 10px; border-radius: 9px; border: 0; margin-bottom: 7px;
  background: var(--pv-primary, #2563eb); color: var(--pv-onprimary, #fff);
}
.pv-btn.ghost { background: color-mix(in srgb, var(--pv-fg) 9%, transparent); color: var(--pv-fg); }
.pv-tabs {
  display: flex; flex: 0 0 auto;
  border-top: 1px solid color-mix(in srgb, var(--pv-fg) 12%, transparent);
  background: color-mix(in srgb, var(--pv-fg) 4%, transparent);
}
.pv-tabs div { flex: 1; text-align: center; padding: 8px 0 9px; font-size: 9.5px; opacity: .55; }
.pv-tabs div.on { opacity: 1; color: var(--pv-primary); font-weight: 700; }
.pv-nav { height: 3.5px; flex: 0 0 auto; background: color-mix(in srgb, var(--pv-fg) 22%, transparent); margin: auto 34% 6px; border-radius: 3px; }

.skel { border-radius: 7px; background: color-mix(in srgb, var(--pv-fg) 11%, transparent); margin-bottom: 7px; }

.pv-note {
  text-align: center; font-size: var(--t-xs); color: var(--fg-faint);
  margin: 0 0 var(--s4); line-height: 1.5;
}

/* ── status strip ────────────────────────────────────────────────────────── */
.health {
  display: flex; align-items: center; gap: var(--s2);
  padding: var(--s2) var(--s4); font-size: var(--t-sm);
  border-bottom: 1px solid var(--line-soft); font-weight: 600;
}
.health .spacer { flex: 1; }
.health .val { font-variant-numeric: tabular-nums; }

.empty { text-align: center; padding: var(--s8) var(--s4); color: var(--fg-faint); }
.empty .big { font-size: var(--t-lg); color: var(--fg-dim); font-weight: 600; margin-bottom: var(--s2); }

.tpl {
  display: flex; align-items: center; gap: var(--s3); width: 100%;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r3);
  padding: var(--s3) var(--s4); margin-bottom: var(--s2); cursor: pointer;
  text-align: left; font-family: inherit; color: var(--fg); min-height: var(--tap);
  transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease);
}
.tpl:hover { background: var(--card-hi); border-color: var(--brand); }
.tpl .tmark { width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.tpl .tmark svg { width: 18px; height: 18px; stroke-width: 1.8; }
.tpl .tname { font-weight: 650; font-size: var(--t-md); }
.tpl .ttag { font-size: var(--t-sm); color: var(--fg-faint); }

.runrow {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) 0; border-bottom: 1px solid var(--line-soft); font-size: var(--t-sm);
}
.runrow:last-child { border-bottom: 0; }
.runrow .rname { flex: 1; font-weight: 600; }
.runrow .rstate { font-weight: 700; font-size: var(--t-xs); }
.rstate.success { color: var(--pass); }
.rstate.failure { color: var(--fail); }
.rstate.in_progress { color: var(--warn); }
.rstate.queued { color: var(--fg-faint); }

code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

.banner {
  display: flex; gap: var(--s3); padding: var(--s3) var(--s4);
  border-radius: var(--r3); font-size: var(--t-sm); margin-bottom: var(--s3);
  border: 1px solid var(--line);
}
.banner.warn { background: color-mix(in srgb, var(--warn) 10%, transparent); border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
.banner.fail { background: color-mix(in srgb, var(--fail) 10%, transparent); border-color: color-mix(in srgb, var(--fail) 32%, transparent); }
.banner.pass { background: color-mix(in srgb, var(--pass) 10%, transparent); border-color: color-mix(in srgb, var(--pass) 32%, transparent); }

.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom));
  transform: translate(-50%, 12px); z-index: 60;
  background: var(--card-hi); color: var(--fg); border: 1px solid var(--line);
  padding: 11px 17px; border-radius: var(--rpill); font-size: var(--t-sm); font-weight: 600;
  box-shadow: 0 12px 32px rgba(0,0,0,.45);
  opacity: 0; pointer-events: none; transition: opacity var(--med) var(--ease), transform var(--med) var(--ease);
  max-width: 88vw; text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

details.adv { border-top: 1px solid var(--line-soft); margin-top: var(--s3); padding-top: var(--s3); }
details.adv > summary {
  cursor: pointer; font-size: var(--t-sm); font-weight: 650; color: var(--fg-dim);
  list-style: none; min-height: 34px; display: flex; align-items: center; gap: var(--s2);
}
details.adv > summary::-webkit-details-marker { display: none; }
details.adv > summary::before { content: "▸"; color: var(--fg-faint); transition: transform var(--fast) var(--ease); }
details.adv[open] > summary::before { transform: rotate(90deg); }
details.adv > *:not(summary) { margin-top: var(--s3); }

.sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ══════════════════════════════════════════════════════════════════════
   SCREEN DESIGNER
   Phone first: every control is a thumb-sized target, and the preview is
   drawn at the width of the phone it is being designed on.
   ══════════════════════════════════════════════════════════════════════ */
.designer { display: flex; flex-direction: column; gap: 14px; }
.designer .d-cell {
  border: 1px solid var(--line); border-radius: 14px; background: var(--card);
  padding: 12px; display: flex; flex-direction: column; gap: 10px;
}
.designer .d-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.designer .d-title { font-weight: 650; font-size: 14px; }
.designer .d-note { font-size: 11px; color: var(--muted); line-height: 1.35; }
.designer .d-alert {
  margin: 0; padding: 8px 10px; border-radius: 10px; font-size: 12px; line-height: 1.4;
  background: color-mix(in srgb, #F59E0B 16%, transparent); border: 1px solid color-mix(in srgb, #F59E0B 45%, transparent);
}
.screen-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.screen-chips .chip {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: inherit; font: inherit; font-size: 13px; min-height: 40px;
}
.screen-chips .chip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); font-weight: 600; }
.screen-chips .chip .chip-n {
  font-size: 11px; opacity: .75; background: color-mix(in srgb, currentColor 12%, transparent);
  border-radius: 999px; padding: 1px 6px;
}
.tree { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.tree .node {
  margin-left: calc(var(--depth) * 14px); display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px 4px 2px;
  background: color-mix(in srgb, currentColor 3%, transparent);
}
.tree .node.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }

/* ═══ engine/spec/toolchain.mjs ═══ */
/**
 * TOOLCHAIN PROFILES — single source of truth
 * ==========================================
 * Shared by the generator and the validator so the two can never disagree
 * about what a given AGP/Gradle pair can actually compile.
 *
 * Every version below was checked against Google Maven and services.gradle.org
 * on 2026-09-30. The `maxCompileSdk` values are the ones proven by a real build
 * in .github/workflows/ — not copied from a table.
 *
 * Why this exists at all: Google Play has required API 36 (Android 16) for new
 * apps and all updates since 31 Aug 2026, and AGP 8.4.x physically cannot
 * compile SDK 36. So "which toolchain" is a compliance question, not a taste
 * question.
 */

const TOOLCHAIN_PROFILES = {
  modern: {
    agp: '8.13.2',
    gradle: '8.13',
    buildTools: '36.0.0',
    jdk: '17',
    maxCompileSdk: 36,
    label: 'Modern — Play-compliant (compileSdk 36)',
  },
  bleeding: {
    agp: '9.4.1',
    gradle: '9.6.0',
    buildTools: '36.0.0',
    jdk: '17',
    maxCompileSdk: 37,
    label: 'Newest — AGP 9.x (compileSdk 37)',
  },
  legacy: {
    agp: '8.4.2',
    gradle: '8.6',
    buildTools: '34.0.0',
    jdk: '17',
    maxCompileSdk: 34,
    label: 'Legacy — compileSdk 34, NOT Play-compliant',
  },
};

const DEFAULT_PROFILE = 'modern';

/** Which profile does this AGP version belong to? */
function profileForAgp(agp) {
  if (!agp) return DEFAULT_PROFILE;
  for (const [name, p] of Object.entries(TOOLCHAIN_PROFILES)) {
    if (p.agp === agp) return name;
  }
  const major = parseInt(String(agp).split('.')[0], 10);
  if (major >= 9) return 'bleeding';
  if (major >= 8 && parseInt(String(agp).split('.')[1] || '0', 10) >= 9) return 'modern';
  return 'legacy';
}

/** Pick the lowest profile that can reach the requested compileSdk. */
function profileForCompileSdk(sdk) {
  const order = ['legacy', 'modern', 'bleeding'];
  for (const name of order) {
    if (TOOLCHAIN_PROFILES[name].maxCompileSdk >= sdk) return name;
  }
  return 'bleeding';
}

/** Resolve the effective toolchain for a spec: explicit toolchain wins. */
function resolveToolchain(spec) {
  const tc = (spec.build || {}).toolchain || {};
  const name = tc.agp ? profileForAgp(tc.agp) : profileForCompileSdk((spec.android || {}).compileSdk ?? 36);
  return { name, ...TOOLCHAIN_PROFILES[name], ...tc };
}

 * its own copy of "large spacing is 20" then sooner or later the preview shows

 * needs a drawable for every icon is a generated app that breaks when one is

 * always there, always renders, and costs nothing — and no action in the
 * library can reach outside the app, which is a security property as much as a
 * practical one.

  home: '\u2302',
  search: '\u2315',
  menu: '\u2261',
  back: '\u2190',
  close: '\u2715',
  add: '+',
  settings: '\u2699',
  user: '\u25CF',

  cart: '\u25A3',

function pick(obj, ...keys) {
  const out = {};
  for (const k of keys) if (obj[k]) out[k] = obj[k];
  return out;
}

/* ------------------------------------------------------------------ *
 * VALIDATION of a screen tree
 * ------------------------------------------------------------------ */
const MAX_DEPTH = 12;

/**
 * The value of a property, wherever it is allowed to be written.
 *
 * `a11yLabel` is the one property that may sit on the component itself or among
 * its props, because the editor treats it as belonging to the component rather
 * than to its appearance. Both places reach the generated app, so validation
 * has to look in both — otherwise a label that works is reported as missing.
 */
function effectiveProp(node, key) {
  if (!node) return undefined;
  if (key === 'a11yLabel') return node.a11yLabel ?? node.props?.a11yLabel;
  return node.props?.[key];
}

/**
 * Walk a screen's component tree and report every problem.
 * @returns {Array<issue>} issues with a precise path so the Studio can point at
 *          the exact component.
 */
function validateScreens(spec, out) {
  const screens = spec.screens || [];
  const nav = spec.navigation || {};

  // Unique screen ids
  const seen = new Set();
  for (const [i, s] of screens.entries()) {
    if (!s || typeof s !== 'object') { out.push(p('E_SCREEN_SHAPE', 'error', `screens[${i}]`, 'This screen is not a valid screen.')); continue; }
    if (!s.id) { out.push(p('E_SCREEN_ID', 'error', `screens[${i}].id`, 'This screen has no id.')); continue; }
    if (seen.has(s.id)) out.push(p('E_SCREEN_DUP', 'error', `screens[${i}].id`, `Two screens are both called "${s.id}".`));
    seen.add(s.id);
    if (!s.name) out.push(p('W_SCREEN_NAME', 'warning', `screens[${i}].name`, `Screen "${s.id}" has no display name.`));
  }

  if (screens.length > 0 && nav.type === 'none')
    out.push(p('W_NAV_MISSING', 'warning', 'navigation.type',
      `This app has ${screens.length} screen${screens.length === 1 ? '' : 's'} but no navigation, so there is no way to reach any of them.`,
      { fix: { kind: 'set', path: 'navigation.type', value: screens.length > 1 ? 'bottom-tabs' : 'stack' } }));

  if (nav.type === 'bottom-tabs') {
    const tabs = screens.filter((s) => s && s.showInTabs !== false);
    if (tabs.length < 2) out.push(p('W_TABS_THIN', 'warning', 'navigation.type', 'Bottom tabs with fewer than two screens leaves empty tabs.'));
    if (tabs.length > 5) out.push(p('E_TABS_MANY', 'error', 'navigation.type', `Bottom tabs support at most 5 items; ${tabs.length} screens are marked to appear there.`));
  }

  const screenIds = new Set(screens.map((s) => s && s.id).filter(Boolean));
  const componentIds = new Set(); // across the whole app, for the warning below
  const perScreenIds = new Map(); // screen id -> ids seen in that screen
  const usedCapabilities = new Set();

  for (const [si, screen] of screens.entries()) {
    if (!screen || !Array.isArray(screen.components)) continue;
    walk(screen.components, `screens[${si}].components`, 1);
  }

  function walk(nodes, basePath, depth) {
    if (depth > MAX_DEPTH) {
      out.push(p('E_NESTING', 'error', basePath, `This is nested more than ${MAX_DEPTH} levels deep. Such a layout is almost impossible to work with on a phone screen.`));
      return;
    }
    for (const [ci, node] of nodes.entries()) {
      const path = `${basePath}[${ci}]`;
      if (!node || typeof node !== 'object') { out.push(p('E_NODE', 'error', path, 'This component is not valid.')); continue; }

      const def = COMPONENTS[node.type];
      if (!def) {
        const near = nearComponents(node.type);
        out.push(p('E_UNKNOWN_COMPONENT', 'error', `${path}.type`,
          `"${node.type}" is not a component that exists.` + (near.length ? ` Did you mean ${near.map((n) => `"${n}"`).join(' or ')}?` : ''),
          { options: near, fix: near.length ? { kind: 'set', path: `${path}.type`, value: near[0], label: `Use ${near[0]}` } : undefined }));
        continue;
      }

      if (node.id) {
        const screenId = screenOf(path, screens) || '?';
        let inScreen = perScreenIds.get(screenId);
        if (!inScreen) { inScreen = new Set(); perScreenIds.set(screenId, inScreen); }
        if (inScreen.has(node.id)) {
          out.push(p('E_COMP_DUP_ID', 'error', `${path}.id`,
            `Two components in this screen are both called "${node.id}". The app keeps one view per name, so the second would silently take over the first one's behaviour.`,
            { reveal: { screen: screenId, nodeId: node.id }, fix: { kind: 'set', path: `${path}.id`, value: `${node.id}2` } }));
        } else if (componentIds.has(node.id)) {
          out.push(p('W_COMP_DUP_ID', 'warning', `${path}.id`,
            `A component in another screen is also called "${node.id}". This is allowed, but a distinct name will make the reports easier to follow.`));
        }
        inScreen.add(node.id);
        componentIds.add(node.id);
      }

      // Required properties
      for (const [key, propDef] of Object.entries(def.props || {})) {
        const value = effectiveProp(node, key);
        if (propDef.required && (value === undefined || value === null || value === ''))
          out.push(p('E_PROP_REQUIRED', 'error', `${path}.props.${key}`, `${def.label}: "${propDef.label}" must be filled in.`, { reveal: { screen: screenOf(path, screens), nodeId: node.id } }));
      }

      // Colour values must be real colours
      for (const [key, propDef] of Object.entries(def.props || {})) {
        if (propDef.type !== 'color') continue;
        const v = (node.props || {})[key];
        if (v && !/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(String(v)))
          out.push(p('E_PROP_COLOR', 'error', `${path}.props.${key}`, `"${v}" is not a colour. Use a value like #2563EB.`));
      }

      // Number ranges
      for (const [key, propDef] of Object.entries(def.props || {})) {
        if (propDef.type !== 'number') continue;
        const v = effectiveProp(node, key);
        if (v === undefined || v === '') continue;
        const n = Number(v);
        if (!Number.isFinite(n)) { out.push(p('E_PROP_NUMBER', 'error', `${path}.props.${key}`, `"${v}" is not a number.`)); continue; }
        if (propDef.min != null && n < propDef.min) out.push(p('E_PROP_RANGE', 'error', `${path}.props.${key}`, `${n} is below the minimum of ${propDef.min}.`));
        if (propDef.max != null && n > propDef.max) out.push(p('E_PROP_RANGE', 'error', `${path}.props.${key}`, `${n} is above the maximum of ${propDef.max}.`));
      }

      // Accessibility: an image with no label is a real defect, not a nitpick.
      if (def.a11y?.requiresLabel && !(node.a11yLabel || node.props?.a11yLabel))
        out.push(p('E_A11Y_IMAGE', 'error', `${path}.props.a11yLabel`,
          `${def.label}: describe this for someone using a screen reader. Android and Google Play both expect images to carry a description.`,
          { reveal: { screen: screenOf(path, screens), nodeId: node.id } }));

      // Events and their actions
      const events = def.events || [];
      for (const [ev, action] of Object.entries(node.events || {})) {
        if (!EVENTS[ev]) { out.push(p('W_UNKNOWN_EVENT', 'warning', `${path}.events.${ev}`, `"${ev}" is not something ${def.label} can do.`)); continue; }
        if (!events.includes(ev)) { out.push(p('W_EVENT_UNSUPPORTED', 'warning', `${path}.events.${ev}`, `${def.label} cannot respond to "${ev}".`)); continue; }
        if (!action || action.kind === 'none' || !action.kind) continue;
        const aDef = ACTIONS[action.kind];
        if (!aDef) { out.push(p('E_UNKNOWN_ACTION', 'error', `${path}.events.${ev}.kind`, `"${action.kind}" is not an action that exists.`)); continue; }
        for (const [key, pd] of Object.entries(aDef.props || {})) {
          const v = (action.props || {})[key];
          if (pd.required && (v === undefined || v === null || v === ''))
            out.push(p('E_ACTION_PROP', 'error', `${path}.events.${ev}.props.${key}`, `${def.label} → ${aDef.label}: "${pd.label}" must be filled in.`));
        }
        // Navigation targets must exist
        if (action.kind === 'navigate' && action.props?.screen && !screenIds.has(action.props.screen))
          out.push(p('E_NAV_TARGET', 'error', `${path}.events.${ev}.props.screen`, `No screen is called "${action.props.screen}".`));

        // Capability implications — the engine tells you when a screen needs a
        // capability you have not enabled, instead of failing at runtime.
        const caps = (spec.capabilities || []);
        if (action.kind === 'share' && !caps.includes('share')) usedCapabilities.add('share');
        if (action.kind === 'copy' && !caps.includes('clipboard')) usedCapabilities.add('clipboard');
        if (action.kind === 'upi' && !caps.includes('upi')) usedCapabilities.add('upi');
        if (action.kind === 'call' && !caps.includes('telephone')) usedCapabilities.add('telephone');
        if (action.kind === 'email' && !caps.includes('email')) usedCapabilities.add('email');
        if (action.kind === 'openApp' && !caps.includes('deepLinks')) usedCapabilities.add('deepLinks');
      }

      // Container rules
      if (def.container && !Array.isArray(node.children)) node.children = [];
      if (!def.container && Array.isArray(node.children) && node.children.length)
        out.push(p('E_NOT_CONTAINER', 'error', `${path}.children`, `${def.label} cannot contain other components. Put it inside a Group instead.`));
      if (Array.isArray(node.children)) walk(node.children, `${path}.children`, depth + 1);
    }
  }

  for (const cap of usedCapabilities)
    out.push(p('W_ACTION_NEEDS_CAP', 'warning', 'capabilities',
      `A screen uses the "${cap}" action but that capability is not enabled, so the button would do nothing.`,
      { fix: { kind: 'addArrayItem', path: 'capabilities', value: cap } }));
}

function screenOf(path, screens) {
  const m = /^screens\[(\d+)\]/.exec(path);
  if (!m) return null;
  const s = screens[Number(m[1])];
  return s ? s.id : null;
}

let CODE_N = 0;
function p(code, severity, path, message, extra = {}) {
  return { id: `${code}-${++CODE_N}`, code, severity, path, message, ...extra };
}

/* ------------------------------------------------------------------ *
 * ONE SOURCE OF TRUTH FOR BOOLEAN DEFAULTS
 *
 * The renderer has a fallback for every boolean it reads, and the editor needs
 * a starting value for every switch it draws. If these disagree the preview and
 * the app differ, which is the worst possible failure in a design tool. Rather
 * than trusting that two lists stay in step, this fills in the value the
 * renderer already uses, and a test checks the two against each other.
 * ------------------------------------------------------------------ */
for (const def of Object.values(COMPONENTS)) {
  for (const prop of Object.values(def.props || {})) {
    if (prop.type === 'boolean' && !('default' in prop)) prop.default = false;
  }
  // The walk already treats a missing flag as "cannot hold children". Saying so
  // explicitly means the editor's drop target and the validator agree without
  // either having to guess.
  if (!('container' in def)) def.container = false;
  if (!('a11y' in def)) def.a11y = { role: 'none' };
}

/* ------------------------------------------------------------------ *
 * PALETTE HELPERS
 *
 * The Studio draws its component palette from these, so the editor and the
 * generator read one definition. Adding a component to COMPONENTS above makes
 * it appear in the editor, validate the same way, and generate the same code,
 * with nothing else to update.
 * ------------------------------------------------------------------ */

/** The groups, in the order they should be shown. */
const GROUPS = (() => {
  const order = [];
  for (const def of Object.values(COMPONENTS)) if (!order.includes(def.group)) order.push(def.group);
  return order;
})();

/** True when this component must carry a screen-reader label. */
function needsLabel(name) {
  return Boolean(COMPONENTS[name]?.a11y?.requiresLabel);
}

/**
 * Every component as a flat list, in a fixed order (definition order, grouped).
 * Deterministic: the palette never reshuffles between page loads.
 */
function componentList() {
  return GROUPS.flatMap((group) => Object.entries(COMPONENTS)
    .filter(([, def]) => def.group === group)
    .map(([name, def]) => ({
      name,
      label: def.label || name,
      group,
      container: Boolean(def.container),
      single: Boolean(def.single),
      requiresLabel: Boolean(def.a11y?.requiresLabel),
      role: def.a11y?.role || 'none',
      props: def.props || {},
      events: def.events || [],
      actions: def.actions || [],
      help: def.help || null,
    })));
}

/** One component by name, or null. */
function findComponent(name) {
  const def = COMPONENTS[name];
  if (!def) return null;
  return componentList().find((c) => c.name === name) || { name, ...def };
}

/**
 * A short list of real components closest to a mistyped name.
 * Tolerates the ways people actually mistype: a prefix, a typo, or the
 * consonants only ("btn" for Button).
 */
function nearComponents(name, limit = 3) {
  const target = String(name || '').toLowerCase();
  if (!target) return [];
  const scored = [];
  for (const c of componentList()) {
    const cand = c.name.toLowerCase();
    let score = 0;
    if (cand === target) {
      score = 100;
    } else {
      // a typo, a missing letter or two letters swapped
      const d = editDistance(target, cand, 3);
      if (d <= 2) score = 80 - d * 10;
      else if (cand.startsWith(target)) score = 60;
      else if (cand.includes(target)) score = 40;
      else if (isSubsequence(target, cand)) {
        // "btn" is a subsequence of both Button and BottomNavigation. The one
        // it fills more of is the one the person meant.
        score = 20 + Math.round((target.length / cand.length) * 15);
      } else if (commonPrefix(target, cand) >= 3) score = 15;
    }
    if (score > 0) scored.push([score, cand.length, c.name]);
  }
  // highest score, then the shorter name, then alphabetical — a typo of a short
  // name is far more likely than a typo of a long one
  scored.sort((a, b) => b[0] - a[0] || a[1] - b[1] || a[2].localeCompare(b[2]));
  return scored.slice(0, limit).map(([, , n]) => n);
}

/**
 * Edit distance, stopping as soon as it is clear the answer is above `max`.
 * The bound is what makes this cheap enough to run over the whole library for
 * every unknown component.
 */
function editDistance(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let best = i;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      // a transposition counts as one mistake, which is how people type
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        cur[j] = Math.min(cur[j], (prev[j - 2] ?? 99) + 1);
      }
      if (cur[j] < best) best = cur[j];
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}

function isSubsequence(needle, hay) {
  let i = 0;
  for (const ch of hay) { if (ch === needle[i]) i++; if (i === needle.length) return needle.length >= 2; }
  return needle.length === 0;
}

/**
 * The closest real component to a name someone typed.
 * Used to turn "unknown component" into a useful suggestion instead of a wall.
 */
function suggestComponent(name) {
  return nearComponents(name, 1)[0] || null;
}

function commonPrefix(a, b) {
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  return i;
}

/**
 * PROJECT1 STUDIO — Project Specification: Schema + 5-Layer Validation
 * =====================================================================
 * The Project Specification is the SINGLE SOURCE OF TRUTH. The visual editor,
 * the generator and the build pipeline all read and write this one object.
 * There is deliberately no second "editor-only" state.
 *
 * Validation layers (spec §BUILD ACCURACY SYSTEM):
 *   L1 SCHEMA     - types, required fields, formats
 *   L2 SEMANTIC   - values that are individually valid but jointly wrong
 *   L3 DEPENDENCY - capabilities/navigation/screens referencing things that
