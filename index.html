<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080B14">
<meta name="description" content="App Mint Studio — design an Android app from your phone. Free, offline, no account, no AI.">
<title>App Mint Studio</title>
<style>/* ══════════════════════════════════════════════════════════════════════
   APP MINT STUDIO — the interface
   ══════════════════════════════════════════════════════════════════════

   Written for a phone held in one hand. That decision drives everything here:

   · Every control a thumb has to hit is at least 44px tall, and the ones
     people use constantly are 48–56px.
   · Text inputs are 16px, because anything smaller makes iOS zoom the page
     when the keyboard opens.
   · Nothing important lives in the top quarter of the screen, which is where
     a thumb cannot reach.
   · Sections start collapsed and show their current value. A settings screen
     that opens everything at once is a wall of text to scroll past, and the
     thing you came for is always at the bottom.

   The palette is deliberately calm: one accent colour that means "this is
   interactive", and colour used for meaning (a problem, a success) rather than
   decoration. The project's own colours never appear here, so what you are
   designing can never be confused with the tool you are designing it in.
   ══════════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────────────────────────────────────────────────
   TOKENS
   ─────────────────────────────────────────────────────────────────────────
   Nothing in this file, and nothing in the Studio's scripts, is allowed to
   name a colour or a spacing value directly. Every visual decision is a token
   resolved here, so there is exactly one place where "what does this tool look
   like" is decided, and a light theme is a list of overrides rather than a
   second stylesheet that drifts.

   Every token below carries both a semantic name (--accent) and, where it was
   already in use, its old name as an alias. The aliases exist so that adopting
   the palette could not silently change a component that was already reading
   --accent-soft; the two are the same variable, not two variables kept in step
   by hand.

   Colour is only ever meaning, never decoration:
     violet = this is interactive / this is the brand
     mint   = this succeeded / this is safe
     coral  = this will destroy or block something
     amber  = this deserves your attention
   ───────────────────────────────────────────────────────────────────────── */

:root {
  color-scheme: dark;

  /* Brand. Electric Violet and Teal Mint, per the design system.
     Each is also published as a bare RGB triple so an alpha variant can be
     composed at the point of use instead of being baked in as a separate
     hardcoded rgba() that has to be remembered and updated. */
  --brand:        #6C5CE7;
  --brand-rgb:    108 92 231;
  --brand-lift:   #8E7CFF;   /* the lighter end of the CTA gradient */
  --brand-ink:    #B6AEFF;   /* violet text on a dark surface: 7.4:1, not 3.9:1 */
  --mint:         #00D9A6;
  --mint-rgb:     0 217 166;
  --mint-ink:     #3FE0B8;
  --coral:        #FF6B6B;
  --coral-rgb:    255 107 107;
  --coral-ink:    #FF8F8F;

  /* Surfaces. Dark mode is the default: a build tool reads as precise on a
     dark ground, and the one thing this tool shows a lot of is code and logs.
     Never pure black — #0B0D12 has enough blue in it to carry depth. */
  --bg:           #0B0D12;
  --bg-rgb:       11 13 18;
  --bg-glow:      #161B33;
  --surface:      #15171F;
  --surface-2:    #1E212B;
  --surface-3:    #272B38;

  /* Rules. Two weights, because a card edge and the line inside a card are
     doing different jobs and should not be the same strength. */
  --line:         rgba(255, 255, 255, 0.08);
  --line-2:       rgba(255, 255, 255, 0.14);

  /* Text. Three steps: what you read, what supports it, what is metadata.
     --fg-3 is the floor, and it is held to the same 4.5:1 as everything
     above it: the first value chosen for it measured 4.24:1, which is the
     kind of shortfall that looks fine indoors and fails in daylight. */
  --fg:           #F5F6FA;
  --fg-2:         #9CA3B5;
  --fg-3:         #8D97AC;
  --on-brand:     #FFFFFF;

  /* Meaning. Each has a fill (--*-soft) and an edge (--*-line) so a badge, a
     banner and a left-border can all say the same thing at three strengths
     without anyone inventing a fourth shade. */
  --ok:           #00D9A6;
  --ok-ink:       #3FE0B8;
  --ok-rgb:       0 217 166;
  --warn:         #FFB020;
  --warn-ink:     #FFC24D;
  --warn-rgb:     255 176 32;
  --bad:          #FF5370;
  --bad-ink:      #FF7C90;
  --bad-rgb:      255 83 112;
  --info:         #4FA3FF;
  --info-ink:     #7CBCFF;
  --info-rgb:     79 163 255;

  --accent:       var(--brand);
  --accent-2:     var(--mint);
  --accent-ink:   var(--brand-ink);
  --accent-soft:  rgb(var(--brand-rgb) / 0.16);
  --accent-line:  rgb(var(--brand-rgb) / 0.45);
  --accent-glow:  rgb(var(--brand-rgb) / 0.55);

  --ok-soft:   rgb(var(--ok-rgb) / 0.12);   --ok-line:   rgb(var(--ok-rgb) / 0.36);
  --warn-soft: rgb(var(--warn-rgb) / 0.12); --warn-line: rgb(var(--warn-rgb) / 0.36);
  --bad-soft:  rgb(var(--bad-rgb) / 0.12);  --bad-line:  rgb(var(--bad-rgb) / 0.40);
  --info-soft: rgb(var(--info-rgb) / 0.12); --info-line: rgb(var(--info-rgb) / 0.36);

  /* The gradient is reserved for primary calls to action and the brand mark.
     On body text or a dense table it turns information into decoration. */
  --grad-brand: linear-gradient(140deg, var(--brand) 0%, var(--brand-lift) 100%);

  /* The hairline of light along the top edge of a filled control. It is what
     stops a flat violet rectangle reading as a sticker, and it is white in both
     themes because it sits on the brand fill rather than on a surface — a
     "light mode" version of it would be invisible on violet. */
  --glint:      rgb(255 255 255 / 0.35);
  --glint-soft: rgb(255 255 255 / 0.22);

  /* The dim behind an overlay. Its own token rather than a literal in each
     overlay, so a dialog and the command palette cannot drift apart, and so a
     light theme can lift it instead of leaving a black sheet over white. */
  --scrim:      rgb(4 6 12 / 0.62);

  /* Spacing on an 8pt grid. A scale exists so that "how far apart" is a
     decision made once rather than re-litigated in every rule. */
  --s1: 4px;  --s2: 8px;  --s3: 12px;
  --s4: 16px; --s5: 24px; --s6: 32px;
  --s7: 48px; --s8: 64px; --s9: 96px;

  /* Radius. Small things round less than large things; a chip and a modal at
     the same radius makes both look wrong. */
  --r-xs:   6px;
  --r-sm:   8px;
  --r:      12px;
  --r-2:    16px;
  --r-lg:   20px;
  --r-xl:   24px;
  --r-full: 999px;
  --r2:     var(--r-2);   /* was referenced but never declared — see audit */

  /* Type. One family, differentiated by size, weight and tracking. Tabular
     numerals wherever a number can change under the user's eye, so a
     permission count going 4 → 5 does not reflow the row beside it. */
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
             "Helvetica Neue", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
               "Liberation Mono", monospace;
  --t-display: 700 34px/1.15 var(--font-ui);
  --t-h1:      700 28px/1.2 var(--font-ui);
  --t-h2:      600 22px/1.28 var(--font-ui);
  --t-h3:      600 18px/1.34 var(--font-ui);
  --t-body-l:  450 16px/1.55 var(--font-ui);
  --t-body:    450 14px/1.55 var(--font-ui);
  --t-label:   500 12px/1.4 var(--font-ui);
  --t-code:    400 13px/1.6 var(--font-mono);
  --track-label: 0.04em;

  /* Motion. Durations are capped because anything past 300ms reads as the
     interface being slow rather than the interface being considered. One
     easing curve for everything that is not entering or leaving.

     These are --d-* rather than --t-* on purpose: --t-* is the type scale, and
     a motion token called --t-base declared after --t-base (body text) would
     have silently replaced the font shorthand with "180ms". Namespacing by
     kind is what stops that class of bug, not care. */
  --ease:       cubic-bezier(0.32, 0.72, 0, 1);
  --ease-out:   cubic-bezier(0, 0, 0.2, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --d-fast:     120ms;
  --d-base:     180ms;
  --d-slow:     240ms;
  --dur:        var(--d-base);   /* what a component should normally use */

  /* Elevation. In dark mode a shadow is nearly invisible, so depth is carried
     by a lifted surface and a brightened edge. Level 3 is the only one that
     glows, and it glows in brand colour, and only around something active. */
  --sh-1: 0 1px 2px rgb(0 0 0 / 0.30);
  --sh-2: 0 4px 12px rgb(0 0 0 / 0.35), 0 1px 2px rgb(0 0 0 / 0.30);
  --sh-3: 0 14px 34px -14px rgb(0 0 0 / 0.75);
  --sh-glow: 0 0 0 1px var(--accent-line), 0 12px 32px rgb(var(--brand-rgb) / 0.22);
  --sh-lift: 0 18px 44px -18px rgb(0 0 0 / 0.8);

  /* The one surface that must stay dark whatever the theme: the phone frame in
     the preview is standing in for a device bezel, and it is drawn around the
     USER'S theme colours, not this tool's. */
  --device-bezel: #05070E;

  --tabbar-h: 74px;
}

/* ── light mode ────────────────────────────────────────────────────────────
   Full parity, not a dimmed dark theme. Surfaces invert to paper, but the
   brand keeps its identity: violet stays violet, and the semantic colours are
   darkened just enough to hold 4.5:1 against white without changing hue, so a
   finding is recognisably the same finding in either theme.

   Opt-in by attribute. The Studio sets data-theme from the saved preference,
   falling back to the system setting, so a person who has chosen light mode on
   their phone gets it here without having to find the toggle. */
:root[data-theme="light"] {
  color-scheme: light;

  --bg:           #FFFFFF;
  --bg-rgb:       255 255 255;
  --bg-glow:      #EDEBFF;
  --surface:      #F7F8FA;
  --surface-2:    #FFFFFF;
  --surface-3:    #EDEFF4;

  --line:         rgba(0, 0, 0, 0.08);
  --line-2:       rgba(0, 0, 0, 0.14);

  --fg:           #10121A;
  --fg-2:         #5B6475;
  --fg-3:         #667085;   /* 5.2:1 on --surface; #6E7789 measured 4.24:1 */
  --on-brand:     #FFFFFF;

  --brand:        #5A48D8;   /* darkened for 5.9:1 on white */
  --brand-rgb:    90 72 216;
  --brand-ink:    #4C3CC0;
  --brand-lift:   #7A68F0;
  --mint-ink:     #00866A;
  --coral-ink:    #C23A3A;

  --ok:           #00A67E;  --ok-ink:   #00775A;  --ok-rgb:   0 166 126;
  --warn:         #B37300;  --warn-ink: #8A5800;  --warn-rgb: 179 115 0;
  --bad:          #D92B4B;  --bad-ink:  #B31F3B;  --bad-rgb:  217 43 75;
  --info:         #1F6FD6;  --info-ink: #175AAE;  --info-rgb: 31 111 214;

  --grad-brand: linear-gradient(140deg, #5A48D8 0%, #7A68F0 100%);
  --scrim:      rgb(16 18 26 / 0.34);

  --sh-1: 0 1px 2px rgb(16 18 26 / 0.06);
  --sh-2: 0 4px 12px rgb(16 18 26 / 0.08), 0 1px 2px rgb(16 18 26 / 0.04);
  --sh-3: 0 14px 34px -14px rgb(16 18 26 / 0.22);
  --sh-glow: 0 0 0 1px var(--accent-line), 0 12px 32px rgb(var(--brand-rgb) / 0.16);
  --sh-lift: 0 18px 44px -18px rgb(16 18 26 / 0.28);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

/* A soft light behind the top of the page. It stops the very dark background
   reading as flat and gives the header somewhere to sit. */
body::before {
  content: "";
  position: fixed;
  inset: -40% 0 auto 0;
  height: 60vh;
  background: radial-gradient(60% 60% at 50% 0%, var(--bg-glow) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

h1, h2, h3, p { margin: 0; }

button, input, select, textarea, a { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.app { position: relative; z-index: 1; }

/* ── the header ─────────────────────────────────────────────────────── */

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background: linear-gradient(180deg, rgb(var(--bg-rgb) / 0.94), rgb(var(--bg-rgb) / 0.80));
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border-bottom: 1px solid var(--line);
}

.mark {
  width: 38px; height: 38px; flex: 0 0 auto;
  border-radius: 12px;
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  box-shadow: 0 6px 16px -6px rgb(var(--brand-rgb) / 0.9), inset 0 1px 0 var(--glint);
}

.identity { min-width: 0; flex: 1 1 auto; }
.identity .name {
  font-size: 16.5px; font-weight: 700; letter-spacing: -0.015em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.identity .meta {
  display: block; font-size: 11.5px; color: var(--fg-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}

.topbar .btn.small { flex: 0 0 auto; }

/* ── the status strip ───────────────────────────────────────────────── */

.health {
  position: sticky;
  top: calc(env(safe-area-inset-top) + 58px);
  z-index: 29;
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: 9px 14px;
  font-size: 12.5px;
  background: rgb(var(--bg-rgb) / 0.90);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.health .spacer { flex: 1 1 auto; }
.health .val { color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 650;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
}
.pill::before {
  content: ""; width: 7px; height: 7px; border-radius: 999px; background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);
}
.pill.pass { color: var(--ok-ink);   border-color: var(--ok-line); background: var(--ok-soft); }
.pill.warn { color: var(--warn-ink); border-color: var(--warn-line); background: var(--warn-soft); }
.pill.fail { color: var(--bad-ink);  border-color: var(--bad-line); background: var(--bad-soft); }

/* ── page ───────────────────────────────────────────────────────────── */

main {
  display: block;
  padding: var(--s4) 14px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px);
  scroll-padding-bottom: calc(var(--tabbar-h) + 40px);
  max-width: 640px;
  margin: 0 auto;
}

.tabpage { display: flex; flex-direction: column; gap: var(--s3); }

/* ── sections ───────────────────────────────────────────────────────── */

.card, .sec {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
}

.card { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }

.card > h2, .sec .sec-title {
  font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg-3);
}

/* The header of a section that can be folded away. It shows what is inside, so
   the answer is often readable without opening anything. */
.sec-head {
  display: flex; align-items: center; gap: var(--s3);
  width: 100%; min-height: 58px; padding: 10px 14px;
  background: none; border: 0; text-align: left; cursor: pointer;
  color: inherit;
}
.sec-head:active { background: var(--surface-2); }
.sec-ico {
  width: 34px; height: 34px; flex: 0 0 auto; border-radius: 11px;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent-ink);
}
.sec-ico svg { width: 18px; height: 18px; }
.sec-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.sec-name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
.sec-sub {
  font-size: 12.5px; color: var(--fg-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chev {
  flex: 0 0 auto; color: var(--fg-3);
  transition: transform 0.22s var(--ease);
}
.sec[data-open="1"] .chev { transform: rotate(180deg); }

.sec-body {
  display: none;
  padding: 0 14px 16px;
  flex-direction: column;
  gap: var(--s4);
}
.sec[data-open="1"] .sec-body { display: flex; }

/* ── fields ─────────────────────────────────────────────────────────── */

.field { display: flex; flex-direction: column; gap: 7px; }

.field > label {
  font-size: 13px; font-weight: 600; color: var(--fg-2);
  display: flex; align-items: center; gap: 6px;
}
.field .help {
  display: inline-grid; place-items: center;
  width: 15px; height: 15px; border-radius: 999px;
  font-size: 10px; font-weight: 700;
  background: var(--surface-3); color: var(--fg-3);
}

.sub { font-size: 12.5px; color: var(--fg-3); line-height: 1.45; }
.hint {
  font-size: 13px; color: var(--fg-2); line-height: 1.5;
  padding: 12px 14px; border-radius: var(--r);
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
}

input[type="text"], input[type="url"], input[type="number"],
input[type="email"], input[type="tel"], input[type="search"],
input[type="password"], select, textarea {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border-radius: var(--r);
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  color: var(--fg);
  font-size: 16px; /* below 16px, iOS zooms the page when a field is focused */
  appearance: none;
  -webkit-appearance: none;
  transition: border-color 0.16s, background 0.16s;
}
textarea { min-height: 104px; resize: vertical; line-height: 1.5; }

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface-3);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
input[aria-invalid="true"] { border-color: var(--bad); }

.selectwrap { position: relative; width: 100%; }
.selectwrap select { padding-right: 40px; cursor: pointer; }
.selectwrap::after {
  content: "";
  position: absolute; right: 16px; top: 50%;
  width: 8px; height: 8px;
  border-right: 2px solid var(--fg-3);
  border-bottom: 2px solid var(--fg-3);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.row { display: flex; gap: var(--s2); flex-wrap: wrap; }

/* a checkbox / switch on its own line */
.sw { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }

/* ── buttons ────────────────────────────────────────────────────────── */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 48px; padding: 0 18px;
  border-radius: var(--r);
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  color: var(--fg);
  font-size: 15px; font-weight: 650; letter-spacing: -0.005em;
  cursor: pointer;
  transition: transform 0.08s var(--ease), background 0.16s, opacity 0.16s;
  text-decoration: none;
}
.btn:active { transform: scale(0.977); }
.btn:disabled { opacity: 0.42; cursor: not-allowed; transform: none; }

.btn.primary {
  border-color: transparent;
  background: var(--grad-brand);
  color: var(--on-brand);
  box-shadow: 0 8px 20px -10px rgb(var(--brand-rgb) / 0.95), inset 0 1px 0 var(--glint-soft);
}
.btn.ghost { background: transparent; border-color: var(--line-2); color: var(--fg-2); }
.btn.danger { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad-ink); }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: var(--r-sm); }
.btn.sm { min-height: 38px; padding: 0 13px; font-size: 13.5px; border-radius: var(--r-sm); }
.btn.block { width: 100%; }

/* ── chips ──────────────────────────────────────────────────────────── */

.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 38px; padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  font-size: 13.5px; font-weight: 550;
  white-space: nowrap;
  cursor: pointer;
}
.chip.on {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 650;
}
.chip.pass { color: var(--ok-ink); border-color: var(--ok-line); background: var(--ok-soft); }

/* ── the project picker ─────────────────────────────────────────────── */

.picker { display: flex; flex-direction: column; gap: var(--s2); }
.picker > p { color: var(--fg-2); font-size: 14px; margin-bottom: var(--s2); }

.tpl {
  display: flex; align-items: center; gap: var(--s3);
  width: 100%; min-height: 66px; padding: 12px 14px;
  text-align: left; cursor: pointer;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  transition: transform 0.08s var(--ease), background 0.16s;
}
.tpl:active { transform: scale(0.985); background: var(--surface-2); }
.tpl .tpl-ico {
  width: 42px; height: 42px; flex: 0 0 auto; border-radius: 13px;
  display: grid; place-items: center;
  background: linear-gradient(150deg, var(--surface-3), var(--surface-2));
  border: 1px solid var(--line-2);
  color: var(--accent-ink);
}
.tpl .tpl-ico svg { width: 21px; height: 21px; }
.tpl .tpl-name { font-size: 15px; font-weight: 650; }
.tpl .tpl-desc { font-size: 12.5px; color: var(--fg-3); }

/* ── the tab bar ────────────────────────────────────────────────────── */

.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  background: rgb(var(--bg-rgb) / 0.86);
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  border-top: 1px solid var(--line);
}
.tabbar .inner { display: flex; gap: 4px; max-width: 640px; margin: 0 auto; }
.tab {
  flex: 1 1 0; min-height: 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  padding: 6px 2px;
  border: 0; border-radius: var(--r);
  background: none; color: var(--fg-3);
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em;
  cursor: pointer;
  transition: color 0.16s, background 0.16s;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent-ink); background: var(--accent-soft); }
.tab:active { background: var(--surface-2); }

/* ── findings ───────────────────────────────────────────────────────── */

.findings { display: flex; flex-direction: column; gap: var(--s2); }
.finding {
  border-radius: var(--r);
  padding: 12px 14px;
  font-size: 13px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
}
.finding.err  { border-color: var(--bad-line); background: var(--bad-soft); }
.finding.warn { border-color: var(--warn-line);  background: var(--warn-soft); }
.finding-msg { line-height: 1.45; }
.finding-acts { display: flex; gap: var(--s2); margin-top: 10px; flex-wrap: wrap; }

/* ── the device preview ─────────────────────────────────────────────── */

.device { display: flex; flex-direction: column; gap: var(--s3); max-width: 340px; margin: 0 auto; }
.device-screen {
  position: relative;
  display: flex; flex-direction: column;
  min-height: 460px;
  border-radius: 30px;
  overflow: hidden;
  border: 1px solid var(--line-2);
  box-shadow: var(--sh-2), inset 0 0 0 6px var(--device-bezel);
}
.pv-caption { font-size: 12px; color: var(--fg-3); text-align: center; line-height: 1.5; }

/* the shell the Preview tab draws */
.screen {
  background: var(--surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--line-2);
  overflow: hidden;
}

/* ── the frame that stands in for YOUR app ────────────────────────────────
   The Preview tab draws a device around the app being designed, so everything
   inside it is coloured from the project's own theme through the --pv-*
   variables the view sets on this element. Nothing here may read a token from
   the Studio's palette: a card that stays tool-grey inside a frame that is
   supposed to be showing your app teaches the wrong lesson about your app.

   Each value has a fallback, so if a variable is ever missing the frame
   degrades to something readable rather than to an unpainted box. */
.app-screen {
  background: var(--pv-bg, var(--surface));
  color: var(--pv-fg, var(--fg));
}
.app-screen .sbar { color: var(--pv-sb, inherit); }
.app-screen .pv-h1 { color: var(--pv-fg, inherit); }
.app-screen .pv-p  { color: var(--pv-muted, var(--fg-2)); }
.app-screen .pv-card {
  background: var(--pv-surface, var(--surface-2));
  border-color: var(--pv-line, var(--line));
  color: var(--pv-fg, inherit);
}
.app-screen .pv-card .t { color: var(--pv-fg, inherit); }
.app-screen .pv-card .d { color: var(--pv-muted, var(--fg-3)); }
.app-screen .pv-btn {
  background: var(--pv-primary, var(--brand));
  color: var(--pv-onprimary, #fff);
  border-color: var(--pv-line, var(--line));
}
.app-screen .pv-btn.ghost {
  background: transparent;
  color: var(--pv-fg, inherit);
  border-color: var(--pv-line, var(--line));
}
.app-screen .pv-tabs { border-color: var(--pv-line, var(--line)); }
.app-screen .pv-tabs > div { color: var(--pv-muted, var(--fg-2)); }
.app-screen .pv-tabs > div.on {
  color: var(--pv-fg, inherit);
  box-shadow: inset 0 -3px 0 var(--pv-primary, var(--brand));
}
.app-screen .pv-nav { background: var(--pv-surface, var(--surface-2)); color: var(--pv-fg, inherit); }
.app-screen .skel { background: var(--pv-wash, var(--surface-3)); }

/* ── the screen designer ────────────────────────────────────────────── */

.designer { display: flex; flex-direction: column; gap: var(--s3); }

.screen-chips { display: flex; gap: var(--s2); overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.screen-chips::-webkit-scrollbar { display: none; }
.screen-chips .chip { flex: 0 0 auto; }
.screen-chips .chip-n {
  font-size: 11px; font-variant-numeric: tabular-nums;
  background: var(--surface-3); border-radius: var(--r-full); padding: 1px 7px;
}

/* the component tree */
.tree { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
/* ── the command palette ──────────────────────────────────────────────────
   One overlay, one text field, one list. It sits above everything and dims
   what is behind it, because while it is open nothing behind it should be
   receiving attention or taps. */
.pal-back {
  position: fixed; inset: 0; z-index: 90;
  background: var(--scrim);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
.pal {
  position: fixed; z-index: 91;
  left: 50%; top: 12vh; transform: translateX(-50%);
  width: min(92vw, 560px);
  display: flex; flex-direction: column;
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-lift);
  overflow: hidden;
}
.pal-input {
  width: 100%;
  padding: 16px 18px;
  border: 0; border-bottom: 1px solid var(--line);
  background: transparent; color: var(--fg);
  font-size: 16px;               /* 16px so a phone does not zoom on focus */
  outline: none;
}
.pal-input::placeholder { color: var(--fg-3); }
.pal-list { max-height: 52vh; overflow-y: auto; padding: var(--s2); }
.pal-item {
  display: flex; align-items: baseline; gap: var(--s3);
  width: 100%; min-height: 44px;
  padding: 10px 12px;
  border: 0; border-radius: var(--r);
  background: none; color: var(--fg);
  text-align: left; cursor: pointer;
}
.pal-item.on { background: var(--accent-soft); }
.pal-label { font-size: 14.5px; font-weight: 550; }
.pal-hint { font-size: 12px; color: var(--fg-3); margin-left: auto; text-align: right; }
.pal-none { padding: 24px 16px; text-align: center; color: var(--fg-2); }
.pal-none .sub { font-size: 12.5px; color: var(--fg-3); margin-top: 4px; }
.pal-foot {
  padding: 8px 14px;
  border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--fg-3);
  font-variant-numeric: tabular-nums;
}

/* ── dragging a component in the outline ──────────────────────────────────
   The line marking a drop is drawn on the row being hovered rather than
   inserted into the tree, so nothing that counts the tree's rows ever sees an
   element that is not a component. */
.tree .node.drop-before { box-shadow: inset 0 3px 0 var(--accent); }
.tree .node.dragging { opacity: 0.45; }
.tree .node[draggable="true"] { cursor: grab; }
.tree .node[draggable="true"]:active { cursor: grabbing; }

.d-tools { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.d-tools .btn[disabled] { opacity: 0.4; cursor: not-allowed; }

.tree .node {
  margin-left: calc(var(--depth, 0) * 10px);
  display: flex; align-items: center; gap: 4px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface-2);
  overflow: hidden;
}
.tree .node.on { border-color: var(--accent-line); background: var(--accent-soft); }
.tree .node-main {
  flex: 1 1 auto; min-width: 0; min-height: 50px;
  display: flex; flex-direction: column; justify-content: center; gap: 1px;
  padding: 8px 4px 8px 12px;
  background: none; border: 0; text-align: left; cursor: pointer;
}
.tree .node-name { font-size: 14px; font-weight: 650; }
.tree .node-id {
  font-size: 11.5px; color: var(--fg-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tree .node-acts { display: flex; gap: 2px; padding-right: 6px; }

.ibtn {
  width: 38px; height: 38px; flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  background: transparent; color: var(--fg-3);
  font-size: 15px; line-height: 1; cursor: pointer;
}
.ibtn:active { background: var(--surface-3); color: var(--fg); }

/* the palette */
.palette-groups { display: flex; gap: var(--s2); overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.palette-groups::-webkit-scrollbar { display: none; }
.palette-groups .chip { flex: 0 0 auto; }

.palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(142px, 1fr)); gap: var(--s2); }
.pitem {
  display: flex; align-items: center; gap: 10px;
  min-height: 62px; padding: 10px 12px;
  text-align: left; cursor: pointer;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface-2);
  transition: transform 0.08s var(--ease), border-color 0.16s;
}
.pitem:active { transform: scale(0.97); border-color: var(--accent-line); }
.pitem .pitem-ico {
  width: 32px; height: 32px; flex: 0 0 auto; border-radius: 10px;
  display: grid; place-items: center;
  background: linear-gradient(150deg, var(--surface-3), var(--surface-2));
  border: 1px solid var(--line-2);
  font-size: 14px; color: var(--accent-ink);
}
.pitem-name { font-size: 13.5px; font-weight: 650; }
.pitem-sub { font-size: 11px; color: var(--fg-3); }

/* the property panel */
.inspector { display: flex; flex-direction: column; gap: var(--s4); }
.inspector .field { gap: 7px; }
.inspector label { font-size: 13px; font-weight: 600; color: var(--fg-2); }
.sub-field {
  display: flex; flex-direction: column; gap: 6px;
  padding-left: 12px; border-left: 2px solid var(--line-2);
}
.field.event { padding-top: var(--s4); border-top: 1px solid var(--line); }

.toggle {
  align-self: flex-start;
  min-height: 44px; padding: 0 18px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  font-size: 14px; font-weight: 600;
  cursor: pointer;
}
.toggle.on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }

.colour-row { display: flex; gap: var(--s2); align-items: center; }
.colour-row input[type="color"] {
  width: 56px; height: 48px; flex: 0 0 auto; padding: 3px;
  border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface-2);
}
.swatch { display: flex; gap: var(--s2); align-items: center; }
.swatch input[type="color"] {
  width: 56px; height: 48px; flex: 0 0 auto; padding: 3px;
  border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface-2);
}

.sub.err { color: var(--bad); font-weight: 600; }

/* ── running build ──────────────────────────────────────────────────── */

.runrow {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  padding: 12px 14px; border-radius: var(--r); background: var(--surface-2);
}
.runrow .rname { font-weight: 650; font-size: 14px; }
.rstate { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
.rstate.success { color: var(--ok); }
.rstate.failure { color: var(--bad); }
.rstate.in_progress, .rstate.queued { color: var(--warn); }

.empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--s3);
  padding: var(--s6) var(--s4); text-align: center;
  border: 1px dashed var(--line-2); border-radius: var(--r-lg);
  background: var(--surface);
}
.empty .big { font-size: 17px; font-weight: 650; }
.empty p { color: var(--fg-3); font-size: 13.5px; max-width: 34ch; }

/* ── dialogs and toasts ─────────────────────────────────────────────── */

.sheet-back {
  position: fixed; inset: 0; z-index: 60;
  background: rgb(var(--bg-rgb) / 0.66);
  backdrop-filter: blur(3px);
  display: grid; place-items: end center;
  padding: 0;
}
.sheet {
  width: 100%; max-width: 560px;
  background: var(--surface);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  border-top: 1px solid var(--line-2);
  padding: var(--s5) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: var(--s4);
  max-height: 88vh; overflow: auto;
}
.sheet h2 { font-size: 18px; font-weight: 700; }

.toast {
  position: fixed;
  left: 50%; transform: translate(-50%, 20px);
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px);
  z-index: 70;
  max-width: min(92vw, 460px);
  padding: 12px 16px;
  border-radius: var(--r);
  background: var(--surface-3);
  border: 1px solid var(--line-2);
  box-shadow: var(--sh-2);
  font-size: 13.5px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.22s, transform 0.22s var(--ease);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ── the app being designed, drawn in the preview ───────────────────── */

.sbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 16px 5px; font-size: 12px; font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.sbar .icons { display: flex; gap: 5px; align-items: center; }
.sbar .sig, .sbar .batt { display: block; background: currentColor; }
.sbar .sig {
  width: 15px; height: 10px; opacity: 0.9;
  clip-path: polygon(0 70%, 22% 70%, 22% 100%, 0 100%, 0 70%, 33% 45%, 55% 45%, 55% 100%, 33% 100%, 33% 45%, 66% 20%, 88% 20%, 88% 100%, 66% 100%, 66% 20%, 100% 0, 100% 100%, 78% 100%, 78% 0);
}
.sbar .batt { width: 22px; height: 11px; border-radius: 3px; }

.pv-body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; padding: 12px; overflow: auto; }
.pv-empty { opacity: 0.6; font-size: 13px; font-style: italic; }
.pv-label { font-size: 12.5px; font-weight: 650; }
.pv-input {
  width: 100%; padding: 11px 12px; border-radius: var(--r-sm);
  font: inherit; font-size: 14px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  background: rgba(255, 255, 255, 0.07); color: inherit;
}
.pv-btn {
  min-height: 46px; padding: 0 16px; border-radius: var(--r-sm); border: 1px solid transparent;
  font: inherit; font-size: 14.5px; font-weight: 650;
  background: var(--brand); color: var(--on-brand);
}
.pv-btn.ghost { background: transparent; border-color: rgba(255, 255, 255, 0.35); color: inherit; }
.pv-btn.danger { background: #DC2626; color: #fff; }
.pv-btn.full { width: 100%; }
.pv-btn.round { width: 48px; min-width: 48px; height: 48px; padding: 0; border-radius: 999px; }

.pv-track { height: 8px; border-radius: 999px; overflow: hidden; }
.pv-fill { height: 100%; border-radius: 999px; }
.pv-cap { font-size: 11.5px; opacity: 0.75; margin: 0; }

.pv-spin {
  width: 22px; height: 22px; border-radius: 999px;
  border: 2px solid rgba(255, 255, 255, 0.25);
  border-top-color: currentColor;
  animation: pvspin 0.9s linear infinite;
}
@keyframes pvspin { to { transform: rotate(360deg); } }

.pv-nav { display: flex; border-top: 1px solid rgba(255, 255, 255, 0.14); }
.pv-nav-item { flex: 1 1 0; text-align: center; font-size: 11px; padding: 11px 2px; opacity: 0.6; }
.pv-nav-item.on { opacity: 1; font-weight: 700; box-shadow: inset 0 3px 0 var(--accent-2); }

.pv-appbar { display: flex; align-items: center; gap: 10px; padding: 14px 12px; margin: -12px -12px 4px; font-weight: 650; }
.pv-appbar-title { flex: 1 1 auto; }

.pv-list-row { padding: 11px 10px; }
.pv-list-row p { font-size: 14px; }
.pv-list-row .sub { font-size: 12px; opacity: 0.7; }

.pv-cell {
  padding: 16px 6px; border-radius: var(--r-sm); text-align: center; font-size: 12.5px;
  background: rgba(255, 255, 255, 0.08);
}

.pv-tabs { display: flex; gap: 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.16); }
.pv-tab { padding: 9px 12px; font-size: 13px; opacity: 0.65; }
.pv-tab.on { opacity: 1; font-weight: 650; box-shadow: inset 0 -3px 0 var(--accent-2); }

.pv-check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.pv-switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pv-switch-row p { font-size: 14px; }
.pv-switch {
  width: 44px; height: 26px; flex: 0 0 auto; border-radius: 999px;
  background: rgba(255, 255, 255, 0.22); position: relative;
  transition: background 0.2s;
}
.pv-switch::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 999px; background: #fff;
  transition: left 0.2s var(--ease);
}
.pv-switch.on { background: var(--accent-2); }
.pv-switch.on::after { left: 21px; }

.pv-range { width: 100%; accent-color: var(--accent-2); }

.pv-drawer { padding: 16px; border-radius: var(--r); background: rgba(255, 255, 255, 0.08); }
.pv-drawer-t { font-weight: 650; }
.pv-dialog {
  padding: 16px; border-radius: var(--r-lg);
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.16);
}
.pv-dialog-t { font-weight: 650; margin-bottom: 4px; }
.pv-dialog-acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.pv-sheet {
  padding: 12px 16px 20px; margin: 0 -12px -12px;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  background: rgba(255, 255, 255, 0.08);
}
.pv-grab {
  display: block; width: 36px; height: 4px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.32); margin: 0 auto 10px;
}
.pv-fab {
  align-self: flex-end;
  min-height: 50px; padding: 0 20px; border-radius: 999px; border: 0;
  font: inherit; font-weight: 700;
  background: var(--accent-2); color: #06242B;
  box-shadow: 0 10px 24px -10px rgba(34, 211, 238, 0.9);
}

/* ── the preview tab's device shell ─────────────────────────────────── */

.pv-h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
.pv-p { color: var(--fg-3); font-size: 13.5px; }
.pv-card {
  padding: 14px; border-radius: var(--r); background: var(--surface-2);
  border: 1px solid var(--line);
}
.pv-card .t { font-weight: 650; font-size: 14px; }
.pv-card .d { color: var(--fg-3); font-size: 12.5px; margin-top: 3px; }
.pv-btn-old {
  min-height: 46px; border-radius: var(--r); border: 0;
  background: var(--grad-brand); color: var(--on-brand); font-weight: 650;
}
.skel { height: 10px; border-radius: 999px; background: var(--surface-3); }

@media (min-width: 560px) {
  .palette-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation-duration: 0.001ms !important; }
}

/* ══════════════════════════════════════════════════════════════════════
   FEATURES — the capability list and the permission tables
   ══════════════════════════════════════════════════════════════════════

   A capability is a decision, so it is laid out as a row: what it does on the
   left, one switch on the right. The switch is the only thing that changes it,
   and it is 52×30 with the whole row tappable, because this is the list people
   scroll through on a phone.
   ══════════════════════════════════════════════════════════════════════ */

.opt {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: start;
  gap: var(--s3);
  padding: 14px 0;
  border-top: 1px solid var(--line);
}
.opt:first-of-type { border-top: 0; padding-top: 4px; }
.opt .txt { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.opt .name {
  font-size: 14.5px; font-weight: 620; letter-spacing: -0.005em;
  display: flex; align-items: center; gap: 6px;
}
.opt .why { font-size: 12.5px; color: var(--fg-3); line-height: 1.45; }
.opt .cost {
  align-self: flex-start;
  margin-top: 5px; padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px; font-weight: 650;
  color: var(--warn);
  background: var(--warn-soft);
  border: 1px solid var(--warn-line);
}

/* The switch. The native checkbox stays in the document — it carries the label
   and the keyboard behaviour — but it is drawn as a track and a knob. */
.sw {
  position: relative;
  flex: 0 0 auto;
  width: 52px; height: 32px;
  cursor: pointer;
}
.sw input {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  margin: 0; opacity: 0;
  cursor: pointer;
  z-index: 2;
}
.sw .track {
  position: absolute; inset: 0;
  border-radius: 999px;
  background: var(--surface-3);
  border: 1px solid var(--line-2);
  transition: background 0.2s var(--ease), border-color 0.2s;
}
.sw .knob {
  position: absolute;
  top: 4px; left: 4px;
  width: 24px; height: 24px;
  border-radius: 999px;
  background: var(--fg-3);
  box-shadow: var(--sh-1);
  transition: transform 0.22s var(--ease), background 0.2s;
  pointer-events: none;
}
.sw input:checked ~ .track {
  background: var(--grad-brand);
  border-color: transparent;
}
.sw input:checked ~ .knob { transform: translateX(20px); background: var(--surface-2); }

 * Shared by the generator and the validator so the two can never disagree

 * Every version below was checked against Google Maven and services.gradle.org

 * apps and all updates since 31 Aug 2026, and AGP 8.4.x physically cannot

 * question.

const TOOLCHAIN_PROFILES = {
  modern: {
    agp: '8.13.2',
    gradle: '8.13',
    buildTools: '36.0.0',
    jdk: '17',
    maxCompileSdk: 36,
    label: 'Modern — Play-compliant (compileSdk 36)',

  bleeding: {
    agp: '9.4.1',
    gradle: '9.6.0',
    buildTools: '36.0.0',
    jdk: '17',
    maxCompileSdk: 37,
    label: 'Newest — AGP 9.x (compileSdk 37)',

  legacy: {
    agp: '8.4.2',
    gradle: '8.6',
    buildTools: '34.0.0',
    jdk: '17',
    maxCompileSdk: 34,

    if (!s.id) { out.push(p('E_SCREEN_ID', 'error', `screens[${i}].id`, 'This screen has no id.')); continue; }
    if (seen.has(s.id)) out.push(p('E_SCREEN_DUP', 'error', `screens[${i}].id`, `Two screens are both called "${s.id}".`));
    seen.add(s.id);
    if (!s.name) out.push(p('W_SCREEN_NAME', 'warning', `screens[${i}].name`, `Screen "${s.id}" has no display name.`));
  }

  if (screens.length > 0 && nav.type === 'none')
    out.push(p('W_NAV_MISSING', 'warning', 'navigation.type',
      `This app has ${screens.length} screen${screens.length === 1 ? '' : 's'} but no navigation, so there is no way to reach any of them.`,
      { fix: { kind: 'set', path: 'navigation.type', value: screens.length > 1 ? 'bottom-tabs' : 'stack' } }));

  if (nav.type === 'bottom-tabs') {
    const tabs = screens.filter((s) => s && s.showInTabs !== false);
    if (tabs.length < 2) out.push(p('W_TABS_THIN', 'warning', 'navigation.type', 'Bottom tabs with fewer than two screens leaves empty tabs.'));
    if (tabs.length > 5) out.push(p('E_TABS_MANY', 'error', 'navigation.type', `Bottom tabs support at most 5 items; ${tabs.length} screens are marked to appear there.`));
  }

  const screenIds = new Set(screens.map((s) => s && s.id).filter(Boolean));
  const componentIds = new Set(); // across the whole app, for the warning below
  const perScreenIds = new Map(); // screen id -> ids seen in that screen
  const usedCapabilities = new Set();

  for (const [si, screen] of screens.entries()) {
    if (!screen || !Array.isArray(screen.components)) continue;
    walk(screen.components, `screens[${si}].components`, 1);
  }

  function walk(nodes, basePath, depth) {
    if (depth > MAX_DEPTH) {
      out.push(p('E_NESTING', 'error', basePath, `This is nested more than ${MAX_DEPTH} levels deep. Such a layout is almost impossible to work with on a phone screen.`));
      return;
    }
    for (const [ci, node] of nodes.entries()) {
      const path = `${basePath}[${ci}]`;
      if (!node || typeof node !== 'object') { out.push(p('E_NODE', 'error', path, 'This component is not valid.')); continue; }

      const def = COMPONENTS[node.type];
      if (!def) {
        const near = nearComponents(node.type);
        out.push(p('E_UNKNOWN_COMPONENT', 'error', `${path}.type`,
          `"${node.type}" is not a component that exists.` + (near.length ? ` Did you mean ${near.map((n) => `"${n}"`).join(' or ')}?` : ''),
          { options: near, fix: near.length ? { kind: 'set', path: `${path}.type`, value: near[0], label: `Use ${near[0]}` } : undefined }));
        continue;
      }

      if (node.id) {
        const screenId = screenOf(path, screens) || '?';
        let inScreen = perScreenIds.get(screenId);
        if (!inScreen) { inScreen = new Set(); perScreenIds.set(screenId, inScreen); }
        if (inScreen.has(node.id)) {
          out.push(p('E_COMP_DUP_ID', 'error', `${path}.id`,
            `Two components in this screen are both called "${node.id}". The app keeps one view per name, so the second would silently take over the first one's behaviour.`,
            { reveal: { screen: screenId, nodeId: node.id }, fix: { kind: 'set', path: `${path}.id`, value: `${node.id}2` } }));
        } else if (componentIds.has(node.id)) {
          out.push(p('W_COMP_DUP_ID', 'warning', `${path}.id`,
            `A component in another screen is also called "${node.id}". This is allowed, but a distinct name will make the reports easier to follow.`));
        }
        inScreen.add(node.id);
        componentIds.add(node.id);
      }

      // Required properties
      for (const [key, propDef] of Object.entries(def.props || {})) {
        const value = effectiveProp(node, key);
        if (propDef.required && (value === undefined || value === null || value === ''))
          out.push(p('E_PROP_REQUIRED', 'error', `${path}.props.${key}`, `${def.label}: "${propDef.label}" must be filled in.`, { reveal: { screen: screenOf(path, screens), nodeId: node.id } }));
      }

      // Colour values must be real colours
      for (const [key, propDef] of Object.entries(def.props || {})) {
        if (propDef.type !== 'color') continue;
        const v = (node.props || {})[key];
        if (v && !/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(String(v)))
          out.push(p('E_PROP_COLOR', 'error', `${path}.props.${key}`, `"${v}" is not a colour. Use a value like #2563EB.`));
      }

      // Number ranges
      for (const [key, propDef] of Object.entries(def.props || {})) {
        if (propDef.type !== 'number') continue;
        const v = effectiveProp(node, key);
        if (v === undefined || v === '') continue;
        const n = Number(v);
        if (!Number.isFinite(n)) { out.push(p('E_PROP_NUMBER', 'error', `${path}.props.${key}`, `"${v}" is not a number.`)); continue; }
        if (propDef.min != null && n < propDef.min) out.push(p('E_PROP_RANGE', 'error', `${path}.props.${key}`, `${n} is below the minimum of ${propDef.min}.`));
        if (propDef.max != null && n > propDef.max) out.push(p('E_PROP_RANGE', 'error', `${path}.props.${key}`, `${n} is above the maximum of ${propDef.max}.`));
      }

      // Accessibility: an image with no label is a real defect, not a nitpick.
      if (def.a11y?.requiresLabel && !(node.a11yLabel || node.props?.a11yLabel))
        out.push(p('E_A11Y_IMAGE', 'error', `${path}.props.a11yLabel`,
          `${def.label}: describe this for someone using a screen reader. Android and Google Play both expect images to carry a description.`,
          { reveal: { screen: screenOf(path, screens), nodeId: node.id } }));

      // Events and their actions
      const events = def.events || [];
      for (const [ev, action] of Object.entries(node.events || {})) {
        if (!EVENTS[ev]) { out.push(p('W_UNKNOWN_EVENT', 'warning', `${path}.events.${ev}`, `"${ev}" is not something ${def.label} can do.`)); continue; }
        if (!events.includes(ev)) { out.push(p('W_EVENT_UNSUPPORTED', 'warning', `${path}.events.${ev}`, `${def.label} cannot respond to "${ev}".`)); continue; }
        if (!action || action.kind === 'none' || !action.kind) continue;
        const aDef = ACTIONS[action.kind];
        if (!aDef) { out.push(p('E_UNKNOWN_ACTION', 'error', `${path}.events.${ev}.kind`, `"${action.kind}" is not an action that exists.`)); continue; }
        for (const [key, pd] of Object.entries(aDef.props || {})) {
          const v = (action.props || {})[key];
          if (pd.required && (v === undefined || v === null || v === ''))
            out.push(p('E_ACTION_PROP', 'error', `${path}.events.${ev}.props.${key}`, `${def.label} → ${aDef.label}: "${pd.label}" must be filled in.`));
        }
        // Navigation targets must exist
        if (action.kind === 'navigate' && action.props?.screen && !screenIds.has(action.props.screen))
          out.push(p('E_NAV_TARGET', 'error', `${path}.events.${ev}.props.screen`, `No screen is called "${action.props.screen}".`));

        // Capability implications — the engine tells you when a screen needs a
        // capability you have not enabled, instead of failing at runtime.
        const caps = (spec.capabilities || []);
        if (action.kind === 'share' && !caps.includes('share')) usedCapabilities.add('share');
        if (action.kind === 'copy' && !caps.includes('clipboard')) usedCapabilities.add('clipboard');
        if (action.kind === 'upi' && !caps.includes('upi')) usedCapabilities.add('upi');
        if (action.kind === 'call' && !caps.includes('telephone')) usedCapabilities.add('telephone');
        if (action.kind === 'email' && !caps.includes('email')) usedCapabilities.add('email');
        if (action.kind === 'openApp' && !caps.includes('deepLinks')) usedCapabilities.add('deepLinks');
      }

      // Container rules
      if (def.container && !Array.isArray(node.children)) node.children = [];
      if (!def.container && Array.isArray(node.children) && node.children.length)
        out.push(p('E_NOT_CONTAINER', 'error', `${path}.children`, `${def.label} cannot contain other components. Put it inside a Group instead.`));
      if (Array.isArray(node.children)) walk(node.children, `${path}.children`, depth + 1);
    }
  }

  for (const cap of usedCapabilities)
    out.push(p('W_ACTION_NEEDS_CAP', 'warning', 'capabilities',
      `A screen uses the "${cap}" action but that capability is not enabled, so the button would do nothing.`,
      { fix: { kind: 'addArrayItem', path: 'capabilities', value: cap } }));
}

function screenOf(path, screens) {
  const m = /^screens\[(\d+)\]/.exec(path);
  if (!m) return null;
  const s = screens[Number(m[1])];
  return s ? s.id : null;
}

let CODE_N = 0;
function p(code, severity, path, message, extra = {}) {
  return { id: `${code}-${++CODE_N}`, code, severity, path, message, ...extra };
}

/* ------------------------------------------------------------------ *
 * ONE SOURCE OF TRUTH FOR BOOLEAN DEFAULTS
 *
 * The renderer has a fallback for every boolean it reads, and the editor needs
 * a starting value for every switch it draws. If these disagree the preview and
 * the app differ, which is the worst possible failure in a design tool. Rather
 * than trusting that two lists stay in step, this fills in the value the
 * renderer already uses, and a test checks the two against each other.
 * ------------------------------------------------------------------ */
for (const def of Object.values(COMPONENTS)) {
  for (const prop of Object.values(def.props || {})) {
    if (prop.type === 'boolean' && !('default' in prop)) prop.default = false;
  }
  // The walk already treats a missing flag as "cannot hold children". Saying so
  // explicitly means the editor's drop target and the validator agree without
  // either having to guess.
  if (!('container' in def)) def.container = false;
  if (!('a11y' in def)) def.a11y = { role: 'none' };
}

/* ------------------------------------------------------------------ *
 * PALETTE HELPERS
 *
 * The Studio draws its component palette from these, so the editor and the
 * generator read one definition. Adding a component to COMPONENTS above makes
 * it appear in the editor, validate the same way, and generate the same code,
 * with nothing else to update.
 * ------------------------------------------------------------------ */

/** The groups, in the order they should be shown. */
const GROUPS = (() => {
  const order = [];
  for (const def of Object.values(COMPONENTS)) if (!order.includes(def.group)) order.push(def.group);
  return order;
})();

/** True when this component must carry a screen-reader label. */
function needsLabel(name) {
  return Boolean(COMPONENTS[name]?.a11y?.requiresLabel);
}

/**
 * Every component as a flat list, in a fixed order (definition order, grouped).
 * Deterministic: the palette never reshuffles between page loads.
 */
function componentList() {
  return GROUPS.flatMap((group) => Object.entries(COMPONENTS)
    .filter(([, def]) => def.group === group)
    .map(([name, def]) => ({
      name,
      label: def.label || name,
      group,
      container: Boolean(def.container),
      single: Boolean(def.single),
      requiresLabel: Boolean(def.a11y?.requiresLabel),
      role: def.a11y?.role || 'none',
      props: def.props || {},
      events: def.events || [],
      actions: def.actions || [],
      help: def.help || null,
    })));
}

/** One component by name, or null. */
function findComponent(name) {
  const def = COMPONENTS[name];
  if (!def) return null;
  return componentList().find((c) => c.name === name) || { name, ...def };
}

/**
 * A short list of real components closest to a mistyped name.
 * Tolerates the ways people actually mistype: a prefix, a typo, or the
 * consonants only ("btn" for Button).
 */
function nearComponents(name, limit = 3) {
  const target = String(name || '').toLowerCase();
  if (!target) return [];
  const scored = [];
  for (const c of componentList()) {
    const cand = c.name.toLowerCase();
    let score = 0;
    if (cand === target) {
      score = 100;
    } else {
      // a typo, a missing letter or two letters swapped
      const d = editDistance(target, cand, 3);
      if (d <= 2) score = 80 - d * 10;
      else if (cand.startsWith(target)) score = 60;
      else if (cand.includes(target)) score = 40;
      else if (isSubsequence(target, cand)) {
        // "btn" is a subsequence of both Button and BottomNavigation. The one
        // it fills more of is the one the person meant.
        score = 20 + Math.round((target.length / cand.length) * 15);
      } else if (commonPrefix(target, cand) >= 3) score = 15;
    }
    if (score > 0) scored.push([score, cand.length, c.name]);
  }
  // highest score, then the shorter name, then alphabetical — a typo of a short
  // name is far more likely than a typo of a long one
  scored.sort((a, b) => b[0] - a[0] || a[1] - b[1] || a[2].localeCompare(b[2]));
  return scored.slice(0, limit).map(([, , n]) => n);
}

/**
 * Edit distance, stopping as soon as it is clear the answer is above `max`.
 * The bound is what makes this cheap enough to run over the whole library for
 * every unknown component.
 */
function editDistance(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let best = i;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      // a transposition counts as one mistake, which is how people type
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        cur[j] = Math.min(cur[j], (prev[j - 2] ?? 99) + 1);
      }
      if (cur[j] < best) best = cur[j];
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}

function isSubsequence(needle, hay) {
  let i = 0;
  for (const ch of hay) { if (ch === needle[i]) i++; if (i === needle.length) return needle.length >= 2; }
  return needle.length === 0;
}

/**
 * The closest real component to a name someone typed.
 * Used to turn "unknown component" into a useful suggestion instead of a wall.
 */
function suggestComponent(name) {
  return nearComponents(name, 1)[0] || null;
}

function commonPrefix(a, b) {
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  return i;
}


/* ═══ engine/spec/fix-policy.mjs ═══ */
/**
 * WHICH REPAIRS MAY BE MADE WITHOUT ASKING, AND WHICH MAY NOT
 * ==========================================================
 *
 * The engine can repair a specification by itself. The question this file
 * answers is narrower, and it is the one that decides whether that is a
 * kindness or a betrayal: given a finding and the change that would resolve it,
 * is the change *certainly* right, or is it merely *reasonable*?
 *
 * Those are not the same thing, and the difference is not cosmetic. A package
 * name containing a Java keyword cannot compile — renaming it is the only way
 * forward and no one's opinion enters into it. Turning off plain-HTTP traffic,
 * by contrast, is good advice that will silently break a small business whose
 * supplier still runs an http:// site. Applying the first without being asked is
 * helpful. Applying the second without being asked destroys work.
 *
 * So every repairable finding is classified here, once, with the reason written
 * down:
 *
 *   high    — the value cannot work, or the outcome is forced. Applied on
 *             request by "repair everything safe".
 *   review  — a valid answer to a real problem, but it changes behaviour the
 *             owner may have intended. Only ever applied by explicit choice,
 *             one at a time.
 *
 * Two rules keep this honest over time:
 *
 *   1. The default is `review`. A finding whose code has no entry here — a new
 *      one, added by someone who did not read this file — is never applied
 *      automatically. Silence is not consent.
 *   2. `tools/tests/fix-policy.test.mjs` reads the engine's own source, finds
 *      every finding that carries a repair, and fails if any of them is missing
 *      from this table. A code cannot quietly acquire auto-repair powers.
 *
 * Reasons are written for the person reading the repair screen on a phone, not
 * for a developer. They say what the change does, and what it costs.
 */

/** @type {Record<string, { confidence: 'high'|'review', why: string }>} */
const FIX_POLICY = {
  /* ── repairs that are forced: the current value cannot work ─────────── */

  E_JAVA_KEYWORD_PKG: {
    confidence: 'high',
    why: 'A package name containing a Java keyword cannot compile at all. The keyword is renamed to the same word with "app" appended; nothing else about the name changes.',
  },
  E_RESERVED_PKG: {
    confidence: 'high',
    why: 'Google Play rejects this namespace outright, so the app could never be published under it. The name is moved under com.example, which is a placeholder — you will still want to set a real one before release.',
  },
  E_SDK_ORDER: {
    confidence: 'high',
    why: 'The minimum Android version was set higher than the target version, which describes no device that could ever exist. The minimum is lowered to match the target.',
  },
  E_COMPILE_BELOW_TARGET: {
    confidence: 'high',
    why: 'The code cannot be compiled against a version older than the one it targets. The compile version is raised to match the target.',
  },
  E_TOOLCHAIN_TOO_OLD: {
    confidence: 'high',
    why: 'The build tool in the specification is older than the compile version it must handle, so the build would stop with a version error. The toolchain is moved to the profile that matches.',
  },
  E_DUP_CAP: {
    confidence: 'high',
    why: 'The same feature is listed twice. A duplicate in a list of on-or-off features is a mistake rather than a setting; the second copy is removed and the first is kept.',
  },
  E_COMP_DUP_ID: {
    confidence: 'high',
    why: 'Two parts of one screen share a name, so the second silently takes over the first one\'s behaviour. The duplicate is renamed — it is the newcomer, so the original keeps the name you gave it.',
  },
  E_UNSAFE_SCHEME: {
    confidence: 'high',
    why: 'This link scheme can launch other apps or read local files just by being opened, and there is no ordinary reason for an app to accept it. It is removed from the allowed list.',
  },
  E_SIGNING_NOT_FAILCLOSED: {
    confidence: 'high',
    why: 'With fail-closed off, a missing keystore makes the build quietly generate a new one — which changes the app\'s identity permanently and breaks every future update. Turning it on makes the build stop and tell you instead.',
  },
  E_RELEASE_UNSIGNED: {
    confidence: 'high',
    why: 'A release build with signing switched off produces a file that cannot be installed anywhere. There is no other correct answer here.',
  },

  /* ── repairs forced by something you built in the app ──────────────── */
  /* These add a feature the app demonstrably needs. They can add an Android
     permission, so the repair screen shows the permission change before you
     accept it — the change follows from your app, but the cost is yours to
     see. */

  W_NAV_MISSING: {
    confidence: 'high',
    why: 'The app has screens but no way to move between them, so nothing on them can be reached. Navigation is switched on — tabs when there is more than one screen, a simple stack when there is only one.',
  },
  W_ACTION_NEEDS_CAP: {
    confidence: 'high',
    why: 'A button on one of your screens uses this feature, but the feature is off, so the button would do nothing when tapped. Switching it on is what the screen was already asking for.',
  },
  W_UPLOAD_NO_CAP: {
    confidence: 'high',
    why: 'File upload is turned on but the feature that performs it is off, so the upload button would do nothing on the phone.',
  },
  W_PWA_NET: {
    confidence: 'high',
    why: 'In PWA mode the app fetches its own shell from the network on first run. Without internet access it would open to a blank screen.',
  },
  W_AUTH_NO_NET: {
    confidence: 'high',
    why: 'Signing in with a Google account is a network operation. Without internet access the sign-in button could never succeed.',
  },

  /* ── repairs that are advice: they change something you chose ───────── */

  E_PLAY_TARGET: {
    confidence: 'review',
    why: 'Target SDK sets which Android behaviour rules the app runs under, so raising it changes how the app behaves on newer phones — and the version required by Play moves over time. It is required to publish, but when you accept that is your call.',
  },
  W_CLEARTEXT: {
    confidence: 'review',
    why: 'Plain HTTP allows any network the user is on to read or alter what passes through it. Turning it off is safer, but if your site is only served over http:// it would stop loading entirely. Only you know whether your address has HTTPS.',
  },
  W_BACKUP: {
    confidence: 'review',
    why: 'Android backup copies the app\'s data to the user\'s cloud account. Turning it off stops sign-in tokens travelling off the device, but it also means someone changing phones loses their saved data. That is a decision about your product, not a correction.',
  },
  W_ALARM_ORPHAN: {
    confidence: 'review',
    why: 'Exact alarms are switched on but nothing in the app uses them, so Android would ask the user for a special "alarms and reminders" permission for no reason. Removing it is tidy — unless a screen you are about to build is going to use it.',
  },
};

/**
 * The policy entry for a finding code.
 *
 * Anything not listed is treated as needing a decision. That default is the
 * whole point of this file: a repair the maintainer never thought about must
 * not become automatic just because the code happened to carry a fix object.
 */
function confidenceOf(code) {
  return FIX_POLICY[code] || {
    confidence: 'review',
    why: 'There is no standing decision about this one, so it is left for you to judge rather than applied automatically.',
  };
}

/** True only when the repair is forced, not merely advisable. */
function isAutoFixable(code) {
  return confidenceOf(code).confidence === 'high';
}

/** Every code this file knows about, in the order they are declared. */
function policyCodes() {
  return Object.keys(FIX_POLICY);
}


/* ═══ engine/spec/spec.mjs ═══ */
/**
 * PROJECT1 STUDIO — Project Specification: Schema + 5-Layer Validation
 * =====================================================================
 * The Project Specification is the SINGLE SOURCE OF TRUTH. The visual editor,
 * the generator and the build pipeline all read and write this one object.
 * There is deliberately no second "editor-only" state.
 *
 * Validation layers (spec §BUILD ACCURACY SYSTEM):
 *   L1 SCHEMA     - types, required fields, formats
 *   L2 SEMANTIC   - values that are individually valid but jointly wrong
 *   L3 DEPENDENCY - capabilities/navigation/screens referencing things that
 *                   do not exist; contradictory combinations
 *   L4 SECURITY   - cleartext, exported components, unsafe schemes, secrets
 *   L5 CAPABILITY - what the selected build engine can actually produce
 *
 * Zero dependencies. Deterministic. No AI. Runs offline.
 *
 * Every issue carries: severity, code, field path, message, and (where a
 * deterministic repair exists) a `fix` object that can be applied and undone.
 */

const SPEC_VERSION = '1.0';

// Re-exported so callers have one import for the whole specification model.

/* ------------------------------------------------------------------ *
 * CAPABILITY REGISTRY
 * The single authority for what a capability is, which Android permission
 * it needs, and why. Permissions are DERIVED, never hand-written.
 * ------------------------------------------------------------------ */
const CAPABILITIES = {
  internet:        { label: 'Internet access',        permissions: ['INTERNET', 'ACCESS_NETWORK_STATE'], reason: 'Required by every network feature', implicit: true },

  share:           { label: 'Share to other apps',    permissions: [], reason: 'Uses the system share sheet; no permission required' },
  clipboard:       { label: 'Clipboard',              permissions: [], reason: 'Copy/paste text; Android restricts background reads automatically' },
  vibration:       { label: 'Vibration',              permissions: ['VIBRATE'], reason: 'Haptic feedback on interaction' },
  files:           { label: 'File upload/download',   permissions: ['READ_EXTERNAL_STORAGE', 'WRITE_EXTERNAL_STORAGE'], reason: 'Reading and saving files the user picks', maxSdk: 32 },
  barcode:         { label: 'Barcode / QR scanning',  permissions: ['CAMERA'], reason: 'Camera is required to scan a code' },

  telephone:       { label: 'Tap to call',            permissions: [], reason: 'Opens the dialer; the user still presses call' },

  screenSecurity:  { label: 'Block screenshots',      permissions: [], reason: 'FLAG_SECURE hides content in screenshots and recents' },
  ads:             { label: 'Advertisements',         permissions: ['INTERNET', 'ACCESS_NETWORK_STATE', 'AD_ID'], reason: 'Ads require network and the advertising ID', disclosure: 'Adds tracking. Off by default.' },
  payments:        { label: 'In-app purchases',       permissions: ['INTERNET', 'ACCESS_NETWORK_STATE', 'com.android.vending.BILLING'], reason: 'Play Billing requires the billing permission', requiresServer: true },
  googleAuth:      { label: 'Google Sign-In',         permissions: ['INTERNET', 'ACCESS_NETWORK_STATE'], reason: 'Google identity requires network; signing SHA-1 must be registered', requiresSetup: 'Register your signing SHA-1 in the Google/Firebase console' },
  camera:          { label: 'Camera capture',         permissions: ['CAMERA'], reason: 'Capturing a photo requires the camera' },
  location:        { label: 'Location',               permissions: ['ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION'], reason: 'Fine and coarse location are requested together', highRisk: true },
  bootStart:       { label: 'Restore after reboot',   permissions: ['RECEIVE_BOOT_COMPLETED'], reason: 'Re-registers scheduled work after the device restarts' },
};

/* ------------------------------------------------------------------ *
 * SCHEMA (L1) — declarative, dependency-free
 * ------------------------------------------------------------------ */
const PACKAGE_RE = /^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/;
const RESERVED_PACKAGE_WORDS = ['android', 'com.android', 'java', 'javax', 'kotlin', 'kotlinx'];
/* Java reserved words. A package name becomes a Java package, so a segment that
   is a reserved word fails at compile time — with a message that does not
   mention the specification at all. Case-sensitive, because Java is. */
const JAVA_KEYWORDS = new Set([
  'abstract','assert','boolean','break','byte','case','catch','char','class','const','continue',
  'default','do','double','else','enum','extends','final','finally','float','for','goto','if',
  'implements','import','instanceof','int','interface','long','native','new','package','private',
  'protected','public','return','short','static','strictfp','super','switch','synchronized',
  'this','throw','throws','transient','try','void','volatile','while','true','false','null',
  'var','record','sealed','permits','yield','_',
]);
const SCHEME_RE = /^[a-z][a-z0-9+.-]*$/;
const HEX_RE = /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/;
const URL_RE = /^https?:\/\/[^\s]+$/;

const SCHEMA = {
  required: ['specVersion', 'identity', 'android', 'app'],
  fields: {
    specVersion: { type: 'string', oneOf: [SPEC_VERSION], label: 'Specification version' },
    identity: {
      type: 'object', required: ['appName', 'packageName'],
      fields: {
        appName:     { type: 'string', minLength: 1, maxLength: 60, label: 'Application name' },
        packageName: { type: 'string', pattern: PACKAGE_RE, maxLength: 120, label: 'Package name' },
        versionName: { type: 'string', pattern: /^\d+(\.\d+){0,3}$/, label: 'Version name' },
        versionCode: { type: 'integer', min: 1, max: 2100000000, label: 'Version code' },
        versionStrategy: { type: 'string', oneOf: ['manual', 'git-commit-count'], label: 'Version source' },
        description: { type: 'string', maxLength: 4000 },
      },
    },
    android: {
      type: 'object', required: ['minSdk', 'targetSdk'],
      fields: {
        minSdk:   { type: 'integer', min: 21, max: 36, label: 'Minimum Android version' },
        targetSdk: { type: 'integer', min: 21, max: 36, label: 'Target Android version' },
        compileSdk: { type: 'integer', min: 21, max: 36 },
        orientation: { type: 'string', oneOf: ['portrait', 'landscape', 'sensor', 'unspecified'] },
        theme: { type: 'string', oneOf: ['light', 'dark', 'system'] },
        allowBackup: { type: 'boolean' },
        cleartextTraffic: { type: 'boolean' },
      },
    },
    app: {
      type: 'object', required: ['mode'],
      fields: {
        mode: { type: 'string', oneOf: ['webview', 'pwa', 'hybrid', 'native-screens'], label: 'Application architecture' },
        webview: {
          type: 'object',
          fields: {
            startUrl:     { type: 'string', pattern: URL_RE, label: 'Start URL' },
            allowedHosts: { type: 'array', of: 'string', label: 'Allowed hosts' },
            offlinePage:  { type: 'boolean', label: 'Offline fallback page' },
            fileUploads:  { type: 'boolean' },
            zoom:         { type: 'boolean' },
            forceDark:    { type: 'boolean', label: 'Force dark web content' },
            canvasBackground: { type: 'string', pattern: HEX_RE, label: 'Web canvas colour' },
            acceptLanguage: { type: 'string', maxLength: 40, label: 'Accept-Language header' },
            localAsset:   { type: 'string', maxLength: 200, label: 'Bundled start page' },
            userAgentSuffix: { type: 'string', maxLength: 60 },
            javascriptEnabled: { type: 'boolean' },
            domStorage:   { type: 'boolean' },
            externalLinks: { type: 'string', oneOf: ['in-app', 'custom-tab', 'external-browser'] },
          },
        },
        splash: { type: 'object', fields: {
          enabled: { type: 'boolean' },
          backgroundColor: { type: 'string', pattern: HEX_RE },
          durationMs: { type: 'integer', min: 0, max: 5000 },
        } },
      },
    },
    capabilities: { type: 'array', of: 'string', label: 'Native capabilities' },
    theme: {
      type: 'object',
      fields: {
        primary:   { type: 'string', pattern: HEX_RE, label: 'Primary colour' },
        onPrimary: { type: 'string', pattern: HEX_RE },
        background: { type: 'string', pattern: HEX_RE },
        surface:   { type: 'string', pattern: HEX_RE },
        onSurface: { type: 'string', pattern: HEX_RE },
        accent:    { type: 'string', pattern: HEX_RE },
        statusBarStyle: { type: 'string', oneOf: ['light', 'dark'] },
      },
    },
    build: {
      type: 'object',
      fields: {
        engine: { type: 'string', oneOf: ['github-actions', 'local-termux', 'local-desktop'], label: 'Build engine' },
        outputs: { type: 'array', of: 'string', label: 'Requested outputs', members: ['debug-apk', 'release-apk', 'signed-apk', 'aab'] },
        minify: { type: 'boolean' },
        abiSplits: { type: 'boolean' },
        cache: { type: 'boolean' },
        r8: { type: 'boolean' },
        toolchain: { type: 'object', fields: {
          agp: { type: 'string' }, gradle: { type: 'string' }, buildTools: { type: 'string' }, jdk: { type: 'string' },
        } },
      },
    },
    signing: {
      type: 'object',
      fields: {
        mode: { type: 'string', oneOf: ['none', 'debug', 'secret-store'], label: 'Signing' },
        failClosed: { type: 'boolean', label: 'Refuse to build if the keystore is missing' },
        storeFileSecretName: { type: 'string' },
      },
    },
    backend: {
      type: 'object',
      fields: {
        kind: { type: 'string', oneOf: ['none', 'supabase', 'firebase', 'custom-rest'], label: 'Backend' },
        url: { type: 'string' },
        requiresAuth: { type: 'boolean' },
        tablesRequiringRls: { type: 'array', of: 'string' },
      },
    },
    screens: { type: 'array', of: 'object', label: 'Screens' },
    navigation: { type: 'object', fields: {
      type: { type: 'string', oneOf: ['none', 'bottom-tabs', 'drawer', 'stack'] },
    } },
    deepLinks: {
      type: 'object',
      fields: {
        customScheme: { type: 'string', pattern: SCHEME_RE },
        hosts: { type: 'array', of: 'string' },
        allowedSchemes: { type: 'array', of: 'string' },
      },
    },
  },
};

/* ------------------------------------------------------------------ *
 * DEFAULT SPEC — what "start from blank" means
 * ------------------------------------------------------------------ */
function defaultSpec() {
  return {
    specVersion: SPEC_VERSION,
    identity: {
      appName: 'My App',
