/* ── GitHub connection + build ─────────────────────────────────────────── */
function openTokenSheet() {
  const dlg = el('div', { class: 'card', style: 'position:fixed;inset:auto var(--s4) var(--s4);z-index:70;box-shadow:0 20px 60px rgba(0,0,0,.6);margin:0' }, [
    el('h2', {}, 'Connect GitHub'),
    el('p', { class: 'hint' },
      'To start a build from your phone, the Studio needs permission to commit the specification to your repository. '
      + 'Use a fine-grained token limited to that one repository, with Contents: Read and write and Actions: Read and write. '
      + 'It is stored only in this browser and is only ever sent to api.github.com.'),
    field('Token', el('input', {
      type: 'password', placeholder: 'github_pat_…', autocomplete: 'off', spellcheck: 'false',
      'aria-label': 'GitHub token',
    })),
    el('div', { class: 'row' }, [
      el('button', { class: 'btn primary', onclick: () => {
        const v = $('input[type=password]', dlg).value.trim();
        if (!v) { toast('Paste a token first.'); return; }
        store.setToken(v);
        dlg.remove();
        hardUpdate();
        toast('Connected. Starting builds from here is now possible.');
      } }, 'Save'),
      el('button', { class: 'btn ghost', onclick: () => dlg.remove() }, 'Cancel'),
    ]),
  ]);
  document.body.append(dlg);
}

async function startBuild() {
  const token = store.token();
  const repo = store.repo() || 'deepsilence10161-source/App-mint-';
  if (!token) { openTokenSheet(); return; }

  const path = `apps/studio/${(S.active.spec.identity.packageName || 'app').split('.').pop()}/spec.json`;
  const api = `https://api.github.com/repos/${repo}/contents/${path}`;
  const headers = {
    Authorization: `Bearer ${token}`,
    Accept: 'application/vnd.github+json',
    'Content-Type': 'application/json',
  };
  toast('Sending the specification…');

  try {
    // Read the current file first so we send the correct sha. Without it GitHub
    // rejects the write, and a blind overwrite is not something to attempt.
    let sha;
    const head = await fetch(api + '?ref=main', { headers });
    if (head.ok) sha = (await head.json()).sha;
    else if (head.status !== 404) throw new Error(`GitHub returned ${head.status} while reading the file.`);

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(S.active.spec, null, 2) + '\n')));
    const body = { message: `spec: update ${S.active.spec.identity.appName} from the Studio`, content, branch: 'main' };
    if (sha) body.sha = sha;

    const res = await fetch(api, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (!res.ok) {
      const detail = await res.json().catch(() => ({}));
      throw new Error(detail.message || `GitHub returned ${res.status}.`);
    }

    toast('Committed. The build is starting…');

    S.pipeline = { run: null, steps: [], polling: true, error: null };
    hardUpdate();
    // Watch the run so the stepper shows what is actually happening instead
    // of a static claim. pollPipeline stops itself once the run concludes.
    pollPipeline(Date.now() - 5000);
  } catch (e) {
    toast(e.message || 'Could not reach GitHub.', 5000);
  }
}

/**
 * Follow the run the Studio just started, and keep the stepper honest.
 *
 * It stops on its own when the run reaches a conclusion, and it records a failed
 * check in S.pipeline.error rather than giving up quietly — a stepper that stops
 * updating without saying why is indistinguishable from a build that stopped.
 */
async function pollPipeline(since) {
  if (S.pipeline._watching) return;   // one watcher at a time
  const token = store.token();
  const repo = store.repo() || 'deepsilence10161-source/App-mint-';
  if (!token) { S.pipeline.polling = false; return; }
  S.pipeline._watching = true;
  const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' };

  for (let i = 0; i < 120; i += 1) {
    await new Promise((r) => setTimeout(r, 5000));
    try {
      if (!S.pipeline.run) {
        const runs = await fetch(
          `https://api.github.com/repos/${repo}/actions/runs?per_page=10&event=push`,
          { headers },
        ).then((x) => (x.ok ? x.json() : null));
        const found = runs?.workflow_runs?.find((x) => new Date(x.created_at).getTime() > since);
        if (found) { S.pipeline.run = found; S.lastRun = found; }
        else S.pipeline.error = 'the run has not appeared yet';
      } else {
        const id = S.pipeline.run.id;
        const [run, jobs] = await Promise.all([
          fetch(`https://api.github.com/repos/${repo}/actions/runs/${id}`, { headers }).then((x) => (x.ok ? x.json() : null)),
          fetch(`https://api.github.com/repos/${repo}/actions/runs/${id}/jobs?per_page=50`, { headers }).then((x) => (x.ok ? x.json() : null)),
        ]);
        if (run) { S.pipeline.run = run; S.lastRun = run; }
        if (jobs) S.pipeline.steps = stepsFromJobs(jobs);
        S.pipeline.error = null;
        if (run && run.status === 'completed') {
          S.pipeline.polling = false;
          S.pipeline._watching = false;
          hardUpdate();
          return;
        }
      }
    } catch (e) {
      S.pipeline.error = e.message || 'could not reach GitHub';
    }
    // Only the Build screen draws the stepper, so nothing else is redrawn while
    // somebody is typing somewhere else.
    if (S.tab === 'build' && S.active) renderActive();
  }
  S.pipeline.polling = false;
  S.pipeline._watching = false;
  if (S.tab === 'build' && S.active) renderActive();
}

/* ── boot ──────────────────────────────────────────────────────────────── */
async function boot(templatesData) {
  S.templates = templatesData || { templates: [] };
  // Saved projects may predate a schema change, so they are re-validated on
  // load rather than trusted. An old project that no longer fits simply shows
  // its findings instead of failing silently or crashing the Studio.
  S.projects = (store.load() || []).map((p) => {
    const d = defaultSpec();
    const merged = mergeSpec(d, p.spec || {});
    merged.specVersion = SPEC_VERSION;
    return { ...p, spec: merged };
  });

  const shell = $('#main');
  shell.replaceWith(main);
  main.id = 'main';

  let activeId = null;
  try { activeId = localStorage.getItem(LS_ACTIVE); } catch { /* ignore */ }
  const found = S.projects.find((p) => p.id === activeId) || S.projects[0];
  if (found) { S.active = found; renderActive(); } else { renderPicker(); }

  $('#newproj').addEventListener('click', () => { renderPicker(); });
  $('#importproj').addEventListener('click', importSpec);
  $('#themebtn').addEventListener('click', cycleTheme);
  $('#palbtn').addEventListener('click', togglePalette);

  /* Ctrl+K is the convention people arrive expecting, and Escape is the one
     that must never trap anyone inside an overlay. The palette also has a
     button, because on a phone, which is how this is mostly used, there is no
     keyboard to press. */
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k') {
      e.preventDefault();
      togglePalette();
    } else if (e.key === 'Escape' && PAL.open) {
      e.preventDefault();
      closePalette();
    }
  });

  // Follow the system until the person says otherwise, then remember what they
  // said — including across a reload, which is when an unremembered preference
  // is most annoying.
  applyTheme(store.theme());
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: light)')
        .addEventListener('change', () => { if (store.theme() === 'auto') applyTheme('auto'); });
    } catch { /* older browsers: the initial read still applies */ }
  }
}

window.__appmintBoot = boot;

// The Health screen prints a score for every category. A test can only check
// those numbers against the engine if it can reach the engine, so the functions
// behind the rings are exposed here — the same way boot is. Without this the
// only available test is "a number was printed", which passes just as happily
// once the UI and the engine have quietly drifted apart.
// The stepper draws whatever S.pipeline holds, which in use is populated by
// pollPipeline from GitHub's own API. A verification cannot start a real build
// to see the stepper move, so the state is settable here — a stepper that only
// ever renders "waiting" would pass every test that could otherwise be written
// for it, including the ones that matter most.
window.__appmintPipeline = (next) => {
  S.pipeline = next ? { polling: false, error: null, ...next } : { run: null, steps: [], polling: false, error: null };
  renderActive();
};

window.__appmintHealth = () => {
  const spec = S.active ? S.active.spec : {};
  return projectHealth(spec, check(), permissionReport(spec));
};


/* ═══ studio/src/repairs.js ═══ */
/**
 * THE REPAIR SCREEN
 * =================
 *
 * The engine can repair a specification. This file is the part that decides
 * what a person is allowed to see before that happens, and what they are told
 * afterwards.
 *
 * The rule it is built around: nothing changes in a project without the owner
 * having been shown what would change, and nothing that was changed is ever
 * hidden afterwards. That is not decoration. A tool that quietly edits your
 * work — even correctly — is one you cannot check, and a tool you cannot check
 * is one you cannot rely on. There is a button for people in a hurry, and it is
 * honest about exactly what it will do before they press it and exactly what it
 * did after.
 *
 * Three groups of work are kept strictly apart:
 *
 *   Ready to repair  The value cannot work as it stands. One press fixes all of
 *                    them, and the press is preceded by the list.
 *   Your call        A repair exists and is reasonable, but it changes a
 *                    decision the owner made. Never applied in bulk, never
 *                    applied first, offered one at a time.
 *   Left alone       A repair was offered and declined, because carrying it out
 *                    would have left more problems than it solved. Explained,
 *                    not skipped silently.
 */



/* ── the journal ──────────────────────────────────────────────────────────
   Every repair this project has had, in order, each with the exact inverse
   operation needed to undo it. Stored on the project itself, so it survives a
   reload along with everything else, and so reopening a project shows what was
   done to it rather than a clean page that hides its own history.            */

function journalOf(project) {
  if (!Array.isArray(project.repairs)) project.repairs = [];
  return project.repairs;
}

/** The permission names a repair would add or remove, as a plain list. */
function permissionDelta(beforeSpec, afterSpec) {
  const names = (spec) => {
    try {
      const d = derivePermissions(spec);
      return new Set((d.permissions || []).map((p) => (typeof p === 'string' ? p : p.permission || p.name)));
    } catch { return new Set(); }
  };
  const a = names(beforeSpec), b = names(afterSpec);
  return {
    added: [...b].filter((x) => !a.has(x)),
    removed: [...a].filter((x) => !b.has(x)),
  };
}

/** "36 → 26", or a word when the value is not a number. */
function changeLine(step) {
  const short = (v) => {
    const s = showValue(v);
    return s.length > 42 ? s.slice(0, 39) + '…' : s;
  };
  return `${short(step.before)} → ${short(step.after)}`;
}

/* ── the screen ─────────────────────────────────────────────────────────── */

/**
 * Everything to do with repair, for the Build section.
 *
 * Returns an array of cards: what can be repaired, what was repaired, and what
 * was deliberately left alone.
 */
function viewRepairs(ctx) {
  const { spec, result, onSpecChange, onSay } = ctx;
  const plan = planFixes(spec, result.issues);
  const auto = plan.stepsAuto;
  const review = plan.stepsReview;
  const refused = plan.preview.refused || [];
  const journal = journalOf(ctx.project);

  const cards = [];

  /* ── what can be repaired without asking ─────────────────────────────── */

  if (auto.length) {
    const delta = permissionDelta(spec, plan.preview.spec);
    const consequences = [];
    if (delta.added.length) {
      // A repair that switches on a capability asks Android for a permission,
      // and that is the user's business before it happens, not after.
      consequences.push(el('p', { class: 'consequence' },
        `These repairs will also ask Android for ${say(delta.added.length, 'permission')}: ${delta.added.join(', ')}. ` +
        'That is because a feature you built needs it, but you should see it before it happens.'));
    }

    const preview = el('div', { class: 'repair-preview' }, auto.map((s) => el('div', { class: 'repair-step' }, [
      el('div', { class: 'rs-head' }, [
        el('span', { class: 'rs-path' }, s.path),
        el('span', { class: 'rs-change' }, changeLine(s)),
      ]),
      el('div', { class: 'rs-why' }, s.why),
    ])));

    cards.push(sectionLike('Ready to repair', auto.length, [
      el('div', { class: 'banner fail' }, el('div', {}, [
        el('strong', {}, auto.length === 1
          ? 'One problem here cannot work as it stands.'
          : `${auto.length} problems here cannot work as they stand.`),
        ' These are not matters of taste — the build would stop, or the app would not do what it says. Each is repaired by setting a value that has only one possible answer.',
      ])),
      ...consequences,
      el('button', {
        class: 'btn primary block',
        onclick: () => applyRepairs(ctx, auto.map((s) => s.code), auto.length),
      }, `Repair ${say(auto.length, 'problem')}`),
      preview,
    ]));
  }

  /* ── what is the owner's to decide ───────────────────────────────────── */

  if (review.length) {
    cards.push(sectionLike('Your call', review.length, [
      el('p', { class: 'hint' },
        'A repair exists for each of these, and each one would be a reasonable answer. They are listed rather than applied, because they change something you chose — and one of them could stop a site that only serves http:// from loading at all.'),
      ...review.map((s) => el('div', { class: 'repair-decision' }, [
        el('div', { class: 'rs-head' }, [
          el('span', { class: 'rs-path' }, s.path),
          el('span', { class: 'rs-change' }, changeLine(s)),
        ]),
        el('div', { class: 'rs-why' }, s.why),
        el('div', { class: 'row' }, [
          el('button', {
            class: 'btn ghost sm',
            onclick: () => applyRepairs(ctx, [s.code], 1),
          }, 'Apply this one'),
        ]),
      ])),
    ]));
  }

  /* ── repairs that were declined because they would backfire ──────────── */

  if (refused.length) {
    cards.push(sectionLike('Left alone', refused.length, refused.map((r) => el('div', { class: 'repair-declined' }, [
      el('div', { class: 'rs-head' }, [
        el('span', { class: 'rs-path' }, r.path),
        el('span', { class: 'rs-change' }, r.code),
      ]),
      el('div', { class: 'rs-why' }, r.why),
      el('div', { class: 'rs-why' }, `Carrying it out would have left ${say(r.wouldGive, 'problem')} where there ${r.had === 1 ? 'is' : 'are'} ${r.had}.`),
    ]))));
  }

  /* ── what has already been repaired in this project ──────────────────── */

  if (journal.length) {
    cards.push(sectionLike('Repaired in this project', journal.length, [
      el('p', { class: 'hint' },
        'Every repair is recorded with the value it replaced, so any one of them can be put back exactly as it was.'),
      ...journal.map((entry, i) => el('div', { class: 'repair-done' }, [
        el('div', { class: 'rs-head' }, [
          el('span', { class: 'okmark', html: svg('<path d="m5 13 4 4 10-10"/>') }),
          el('span', { class: 'rs-path' }, entry.path),
          el('span', { class: 'rs-change' }, `${showValue(entry.before)} → ${showValue(entry.after)}`),
        ]),
        el('div', { class: 'rs-why' }, entry.code + (entry.decided ? ' · applied because you chose it' : '')),
        el('div', { class: 'row' }, [
          el('button', { class: 'btn ghost sm', onclick: () => undoOne(ctx, i) }, 'Undo'),
        ]),
      ])),
      el('button', { class: 'btn ghost block', onclick: () => undoAll(ctx) }, 'Undo every repair in this project'),
    ]));
  }

  return cards;
}

/**
 * A card whose heading carries the count, so the number of things waiting is
 * visible without opening anything.
 */
function sectionLike(title, count, children) {
  return el('section', { class: 'card' }, [
    el('h2', {}, [el('span', {}, title), el('span', { class: 'count' }, String(count))]),
    ...children.filter(Boolean),
  ]);
}

/* ── carrying a repair out ──────────────────────────────────────────────── */

function applyRepairs(ctx, codes, expected) {
  const { spec, result, project } = ctx;
  const { spec: fixed, applied } = repair(spec, { codes, issues: result.issues });

  if (!applied.length) {
    // Never claim success that did not happen.
    ctx.onSay('Nothing was changed — that repair does not apply to the current values.');
    return;
  }

  // Record the inverse of each change on the project, so undo is exact rather
  // than "put it back to something like it was".
  const journal = journalOf(project);
  for (const a of applied) {
    const step = planStepFor(ctx, a, codes);
    journal.push({
      code: a.code,
      path: a.path,
      message: a.message,
      before: step ? step.before : undefined,
      after: step ? step.after : undefined,
      undo: a.undo,
      decided: expected === 1 && !codes.every((c) => isAuto(ctx, c)),
      at: new Date().toISOString(),
    });
  }

  ctx.onSpecChange(fixed);

  // Say what actually happened, counted, not implied. Repairing every error
  // while warnings remain is a real and common outcome, and calling that
  // "nothing is outstanding" next to a header that says three warnings is how
  // a tool teaches people to stop believing it.
  const remaining = ctx.recheck(fixed);
  const errors = remaining.counts.critical + remaining.counts.error;
  const warns = remaining.counts.warning;
  const did = say(applied.length, 'problem');
  ctx.onSay(errors
    ? `Repaired ${did}. ${say(errors, 'problem')} still cannot work and ${errors === 1 ? 'is' : 'are'} listed below.`
    : (warns
        ? `Repaired ${did}. Nothing is broken now; ${say(warns, 'warning')} left to read.`
        : `Repaired ${did}. Nothing is outstanding now.`));
}

/** The before/after values for a repair the engine just performed. */
function planStepFor(ctx, applied, codes) {
  const plan = planFixes(ctx.spec, ctx.result.issues, { onlyCodes: codes });
  return plan.steps.find((s) => s.code === applied.code && s.path === applied.path)
      || plan.steps.find((s) => s.code === applied.code);
}

function isAuto(ctx, code) {
  const plan = planFixes(ctx.spec, ctx.result.issues);
  return plan.stepsAuto.some((s) => s.code === code);
}

/* ── undoing ────────────────────────────────────────────────────────────── */

function undoOne(ctx, index) {
  const journal = journalOf(ctx.project);
  const entry = journal[index];
  if (!entry) return;

  const spec = JSON.parse(JSON.stringify(ctx.spec));
  const ok = rollbackFix(spec, entry);
  if (!ok) {
    ctx.onSay('That repair could not be undone — the field has changed since it was made. Nothing was altered.');
    return;
  }
  journal.splice(index, 1);
  ctx.onSpecChange(spec);
  ctx.recheck(spec);
  ctx.onSay('Undone. The value is back to what it was.');
}

function undoAll(ctx) {
  const journal = journalOf(ctx.project);
  if (!journal.length) return;

  // Backwards, because a later repair can depend on an earlier one.
  const spec = JSON.parse(JSON.stringify(ctx.spec));
  let undone = 0, failed = 0;
  for (let i = journal.length - 1; i >= 0; i--) {
    if (rollbackFix(spec, journal[i])) undone++; else failed++;
  }
  ctx.project.repairs = [];
  ctx.onSpecChange(spec);
  ctx.recheck(spec);
  ctx.onSay(failed
    ? `Undid ${undone}. ${failed} could not be undone — those fields have changed since.`
    : `Undid every repair (${undone}). The project is back to how it was before them.`);
}


/* ═══ studio/src/viewHealth.js ═══ */
/* ============================================================================
   HEALTH — score rings, and the answer to "why?"
   ----------------------------------------------------------------------------
   The design prompt asks for score rings and then adds the part that decides
   whether they are worth anything: a person has to be able to open "Why this
   score?" and see the checks. A ring with no explanation is decoration, and a
   room full of decorative numbers teaches people to ignore all of them.

   So every ring here is drawn from engine/spec/health.mjs, which derives its
   scores from validateSpec and permissionReport — the same two calls the Build
   screen, the CLI and CI already make. Nothing is calculated twice, which means
   the number on this screen cannot drift from the one in the build report, and
   each ring expands into the exact list of checks, each with the reason it
   passed, warned or failed.

   A category with nothing to measure shows a dash and says so. It does not show
   a reassuring 100 for a thing nobody configured.
   ========================================================================= */

const RING_R = 26;
const RING_C = 2 * Math.PI * RING_R;

/** A score as a ring. The arc length is the score; nothing else is implied. */
function scoreRing(score, band) {
  const frac = score === null ? 0 : Math.max(0, Math.min(100, score)) / 100;
  const dash = RING_C * frac;
  return el('span', { class: `ring band-${band}`, role: 'img', 'aria-label': score === null ? 'Nothing to measure' : `Score ${score} of 100` },
    el('span', {
      html: `<svg viewBox="0 0 64 64" aria-hidden="true">
        <circle class="ring-track" cx="32" cy="32" r="${RING_R}"/>
        <circle class="ring-arc" cx="32" cy="32" r="${RING_R}"
          stroke-dasharray="${dash.toFixed(2)} ${(RING_C - dash).toFixed(2)}"/>
      </svg>`,
    }),
    el('span', { class: 'ring-num' }, score === null ? '—' : String(score)),
  );
}

/** The list behind "Why this score?" — one row per check, with its reason. */
function whyList(category) {
  if (!category.checks.length) {
    return el('p', { class: 'why-none' },
      'Nothing to measure. This category scores no number at all rather than a score invented to fill the grid.');
  }
  return el('ul', { class: 'why' },
    ...category.checks.map((c) => el('li', { class: `why-row s-${c.status}` },
      el('span', { class: 'why-mark', 'aria-hidden': 'true' }),
      el('span', { class: 'why-main' },
        el('span', { class: 'why-name' }, c.name),
        el('span', { class: 'why-detail' }, c.detail),
      ),
      el('span', { class: 'why-tag' }, c.status),
    )));
}

function ringCard(category) {
  const counts = [];
  if (category.failing) counts.push(`${category.failing} failing`);
  if (category.warning) counts.push(`${category.warning} warning${category.warning === 1 ? '' : 's'}`);
  if (!counts.length && category.checks.length) counts.push(`${category.checks.length} checks passed`);
  if (!category.checks.length) counts.push('not configured');

  return el('article', { class: `card ringcard band-${category.band}` },
    el('div', { class: 'ringhead' },
      scoreRing(category.score, category.band),
      el('div', { class: 'ringmeta' },
        el('h3', { class: 'ringname' }, category.label),
        el('p', { class: 'ringsub' }, counts.join(' · ')),
      ),
    ),
    el('details', { class: 'why-box' },
      el('summary', {}, 'Why this score?'),
      whyList(category),
    ),
  );
}

/** The Health section. */
function viewHealth() {
  const spec = S.active ? S.active.spec : {};
  const validation = check();
  const report = permissionReport(spec);
  const health = projectHealth(spec, validation, report);

  const weakest = health.categories.find((c) => c.key === health.weakest);

  const overallText = health.overall === null
    ? 'Nothing is measurable yet, so there is no overall number to show.'
    : `The weakest of the ${health.measured} measured categor${health.measured === 1 ? 'y' : 'ies'}` +
      (weakest ? `, which is ${weakest.label}` : '') +
      '. Not an average — an average hides the one thing that will stop the build.';

  const out = [
    section('Project health', {
      icon: I.gauge,
      open: true,
      summary: `${health.measured} measured · ${health.unmeasured} not measured`,
      children: [
        el('div', { class: 'rings' }, ...health.categories.map(ringCard)),
      ],
    }),

    // The overall number is the weakest measured category, not an average of
    // them. An average let a specification that cannot build report a
    // comfortable score because four other categories were content with it.
    section('The overall number', {
      icon: I.spark,
      open: true,
      summary: overallText,
      children: [
        el('div', { class: 'overall' },
          scoreRing(health.overall, bandOf(health.overall)),
          el('div', { class: 'ringmeta' },
            el('h3', { class: 'ringname' }, health.overall === null ? 'No score' : `${health.overall} / 100`),
            el('p', { class: 'ringsub' },
              health.overall === null
                ? 'Configure something measurable first.'
                : `${health.measured} measured · ${health.unmeasured} not measured` +
                  (weakest ? ` · weakest: ${weakest.label} at ${weakest.score}` : '')),
          ),
        ),
      ],
    }),
  ];

  if (health.unmeasured) {
    const names = health.categories.filter((c) => c.score === null).map((c) => c.label);
    out.push(el('div', { class: 'banner info' }, el('div', {}, [
      el('strong', {}, `${health.unmeasured} categor${health.unmeasured === 1 ? 'y' : 'ies'} not measured: ${names.join(', ')}. `),
      'Left blank on purpose. A score with nothing behind it is worse than no score, because it gets read and believed.',
    ])));
  }

  return out;
}


/* ═══ studio/src/viewPipeline.js ═══ */
/* ============================================================================
   PIPELINE — the stepper, drawn from the run that is actually happening
   ----------------------------------------------------------------------------
   engine/spec/pipeline.mjs turns the steps GitHub Actions reported into stages.
   This file draws them, and adds the two things a stepper most often gets wrong:

     · it never advances on a timer. A stage moves because a step moved.
     · it never claims "Done" while the run is still going, and it says
       "cancelled" when that is what happened, which is neither a pass nor a
       failure and should not be dressed up as one.

   Steps that belong to no stage are listed underneath rather than dropped, and
   stages this workflow never had are named as absent. A stepper that only shows
   what it expects will look green all the way through a build that is failing
   somewhere it never learned to look.
   ========================================================================= */

/** Status marker for one stage. */
function stageMark(status) {
  const glyph = { done: 'check', running: 'spin', failed: 'cross', cancelled: 'minus', waiting: 'dot' }[status] || 'dot';
  return el('span', { class: `pmark s-${status}`, 'aria-hidden': 'true', html: svg(PIPE_ICONS[glyph]) });
}

function stageNode(stage, index) {
  const label = stage.key === 'done' ? 'Done' : `${index + 1}. ${stage.label}`;
  return el('li', { class: `pstep s-${stage.status}`, 'data-stage': stage.key },
    stageMark(stage.status),
    el('div', { class: 'pstep-main' },
      el('span', { class: 'pstep-name' }, label),
      stage.detail ? el('span', { class: 'pstep-detail' }, stage.detail) : null,
      stage.steps && stage.steps.length
        ? el('ul', { class: 'pstep-steps' },
            ...stage.steps.map((s) => el('li', { class: `s-${buildStepStatus(s)}` },
              el('span', { class: 'pdot', 'aria-hidden': 'true' }),
              el('span', { class: 'pname' }, s.name),
              el('span', { class: 'pstate' }, buildStepStatus(s)),
            )))
        : null,
    ),
  );
}

/**
 * The Build pipeline section. Returns [] when there is nothing to report, so the
 * Build screen does not grow an empty box around a build nobody started.
 */
function viewPipeline() {
  const P = S.pipeline;
  if (!P || (!P.run && !P.polling)) return [];

  const run = P.run;
  const stages = pipelineStages(P.steps || [], stagesFor(run ? run.name : ''), run);

  const head = el('div', { class: 'phead' },
    el('span', { class: 'pill ' + (run && run.conclusion === 'success' ? 'pass' : (run && run.conclusion && run.conclusion !== 'success' ? 'fail' : 'warn')) },
      run ? `${(run.conclusion || run.status || 'starting').toUpperCase()}` : 'STARTING'),
    run && run.run_number ? el('span', { class: 'val' }, `Run #${run.run_number}`) : null,
    run && run.html_url
      ? el('a', { class: 'btn ghost small', href: run.html_url, target: '_blank', rel: 'noopener' }, 'Open the run')
      : null,
  );

  const body = [
    el('ol', { class: 'pipeline' }, ...stages.stages.map(stageNode)),
  ];

  if (stages.other.length) {
    body.push(el('details', { class: 'pother' },
      el('summary', {}, `${stages.other.length} step${stages.other.length === 1 ? '' : 's'} outside these stages`),
      el('ul', { class: 'pstep-steps' },
        ...stages.other.map((s) => el('li', { class: `s-${buildStepStatus(s)}` },
          el('span', { class: 'pdot', 'aria-hidden': 'true' }),
          el('span', { class: 'pname' }, s.name),
          el('span', { class: 'pstate' }, buildStepStatus(s)),
        ))),
    ));
  }

  if (stages.absent.length) {
    body.push(el('p', { class: 'hint' },
      `Not part of this pipeline: ${stages.absent.join(', ')}. These stages exist in other workflows, not this one.`));
  }

  if (P.polling && (!run || run.status !== 'completed')) {
    body.push(el('div', { class: 'skel skel-line', 'aria-hidden': 'true' }));
    body.push(el('p', { class: 'hint' }, P.error
      ? `Still waiting, but the last check failed: ${P.error}`
      : 'Watching the run. Each stage moves when its real steps move.'));
  }

  return [card('Build pipeline', [head, ...body],
    'The stages are the steps this workflow reported, grouped. Nothing here advances on a timer.')];
}


/* ═══ studio/src/palette.js ═══ */
/* ============================================================================
   COMMAND PALETTE — every action in one place, reachable by typing
   ----------------------------------------------------------------------------
   The Studio is organised into five sections, which is the right shape for
   browsing and the wrong shape for acting. To rename the app you have to
   remember that identity lives under Design; to see why a build is blocked you
   have to remember that findings live under Build. On a phone that is a lot of
   tapping to reach something you already know the name of.

   So there is one list of everything the Studio can do, and typing into it
   filters that list. It is the same actions the buttons run — it calls the same
   functions rather than reimplementing them, which is the only reason it can be
   added without creating a second place where behaviour is defined.

   It is keyboard-first (Ctrl+K or Cmd+K) and also a button in the top bar,
   because the primary way anyone holds this tool is a phone, where there is no
   Ctrl key. An affordance that only exists for a keyboard is an affordance most
   of the people using this will never find.
   ========================================================================= */

const PAL = {
  open: false,
  query: '',
  cursor: 0,
  items: [],
};

/**
 * Subsequence match, not substring: "pkg" finds "Package name". That is the
 * behaviour people expect from a command palette, and it is four lines.
 * Returns a score where lower is better, or null when the query does not match,
 * so results can be ordered by how tightly they match rather than listed in
 * whatever order they were collected in.
 */
function fuzzyScore(query, text) {
  const q = query.toLowerCase().trim();
  const t = text.toLowerCase();
  if (!q) return 0;
  if (t.startsWith(q)) return -100;          // prefix beats everything
  const at = t.indexOf(q);
  if (at >= 0) return at;                    // then a plain substring, by position
  let ti = 0;
  let spread = 0;
  for (const ch of q) {
    const hit = t.indexOf(ch, ti);
    if (hit < 0) return null;                // a character is missing: no match
    spread += hit - ti;
    ti = hit + 1;
  }
  return 1000 + spread;                      // subsequence, penalised by how scattered
}

/**
 * Everything the palette can run. Built fresh on each open so it reflects the
 * project that is actually loaded: with no project there is nothing to build,
 * and listing "Start build" anyway would be offering something that cannot work.
 */
function paletteActions() {
  const acts = [];
  const go = (tab) => () => { S.tab = tab; PAL.open = false; hardUpdate(); };

  // Read from the same list the tab bar is built from. Carrying a second copy of
  // these ids is how this palette came to offer a command that did not work.
  for (const [id, label, , hint] of TAB_DEFS) {
    acts.push({ label: `Go to ${label}`, hint, run: go(id) });
  }

  const hasProject = Boolean(S.active);

  if (hasProject) {
    for (const s of (S.active.spec.screens || [])) {
      acts.push({
        label: `Open screen: ${s.name || s.id}`,
        hint: 'screen designer',
        run: () => { D.screen = s.id; D.selected = null; D.adding = false; S.tab = 'screens'; PAL.open = false; hardUpdate(); },
      });
    }

    const checks = check();
    acts.push({
      label: 'Validate the specification',
      hint: checks.blocked
        ? `${checks.blocking.length} problem(s) blocking the build`
        : 'no blocking problems',
      run: () => { S.tab = 'build'; PAL.open = false; hardUpdate(); },
    });

    if (!checks.blocked) {
      acts.push({ label: 'Start a build', hint: 'commits the spec and runs CI', run: () => { PAL.open = false; startBuild(); } });
    }

    if (canUndo(S.active)) {
      acts.push({ label: `Undo: ${nextUndoLabel(S.active)}`, hint: 'screen designer', run: () => { PAL.open = false; undoDesignerEdit(); } });
    }
    if (canRedo(S.active)) {
      acts.push({ label: 'Redo', hint: 'screen designer', run: () => { PAL.open = false; redoDesignerEdit(); } });
    }

    acts.push({ label: 'Download the specification', hint: 'spec.json', run: () => { PAL.open = false; downloadSpec(); } });
    acts.push({ label: 'Copy the specification', hint: 'to the clipboard', run: () => { PAL.open = false; copySpec(); } });
  }

  acts.push({ label: 'New project', hint: 'start from a template', run: () => { PAL.open = false; renderPicker(); } });
  acts.push({ label: 'Import a specification', hint: 'from a spec.json file', run: () => { PAL.open = false; importSpec(); } });

  const themeNow = document.documentElement.getAttribute('data-theme');
  acts.push({
    label: themeNow === 'light' ? 'Switch to dark mode' : 'Switch to light mode',
    hint: 'the choice is remembered',
    run: () => { PAL.open = false; cycleTheme(); },
  });

  return acts;
}

/** Filter and rank. An empty query lists everything, which is the useful case. */
function paletteResults() {
  const all = paletteActions();
  if (!PAL.query.trim()) return all;
  return all
    .map((a) => ({ a, score: Math.min(
      fuzzyScore(PAL.query, a.label) ?? Infinity,
      fuzzyScore(PAL.query, a.hint || '') ?? Infinity,
    ) }))
    .filter((x) => Number.isFinite(x.score))
    .sort((x, y) => x.score - y.score)
    .map((x) => x.a);
}

/** Undo/redo from the palette, so it can say what happened like the buttons do. */
function undoDesignerEdit() {
  const what = undoEdit(S.active);
  touch(); hardUpdate();
  toast(what ? `Undid: ${what}` : 'Nothing to undo.');
}

function redoDesignerEdit() {
  const what = redoEdit(S.active);
  touch(); hardUpdate();
  toast(what ? `Redid: ${what}` : 'Nothing to redo.');
}

function openPalette() {
  PAL.open = true;
  PAL.query = '';
  PAL.cursor = 0;
  PAL.items = paletteResults();
  paintPalette();
  const input = document.getElementById('pal-input');
  if (input) input.focus();
}

function closePalette() {
  PAL.open = false;
  const host = document.getElementById('palette');
  if (host) host.replaceChildren();
}

function togglePalette() {
  if (PAL.open) closePalette(); else openPalette();
}

function paintPalette() {
  const host = document.getElementById('palette');
  if (!host) return;
  host.replaceChildren();
  if (!PAL.open) return;

  PAL.items = paletteResults();
  if (PAL.cursor >= PAL.items.length) PAL.cursor = Math.max(0, PAL.items.length - 1);

  const list = el('div', { class: 'pal-list', role: 'listbox', 'aria-label': 'Commands' });
  if (!PAL.items.length) {
    list.append(el('div', { class: 'pal-none' }, [
      el('p', {}, `Nothing matches “${PAL.query}”.`),
      el('p', { class: 'sub' }, 'Try the name of a section, a screen, or something you want to do.'),
    ]));
  } else {
    PAL.items.forEach((a, i) => {
      list.append(el('button', {
        class: 'pal-item' + (i === PAL.cursor ? ' on' : ''),
        role: 'option',
        'aria-selected': i === PAL.cursor ? 'true' : 'false',
        onmousemove: () => { if (PAL.cursor !== i) { PAL.cursor = i; paintPalette(); } },
        onclick: () => { const run = a.run; closePalette(); run(); },
      }, [
        el('span', { class: 'pal-label' }, a.label),
        a.hint ? el('span', { class: 'pal-hint' }, a.hint) : null,
      ]));
    });
  }

  host.append(el('div', { class: 'pal-back', onclick: closePalette }),
    el('div', { class: 'pal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Command palette' }, [
      el('input', {
        id: 'pal-input',
        class: 'pal-input',
        type: 'text',
        value: PAL.query,
        placeholder: 'Type a command, a screen, or a section…',
        'aria-label': 'Search commands',
        autocomplete: 'off',
        spellcheck: 'false',
        role: 'combobox',
        'aria-expanded': 'true',
        'aria-controls': 'pal-list',
        oninput: (e) => { PAL.query = e.target.value; PAL.cursor = 0; paintPalette(); refocus(); },
        onkeydown: (e) => {
          if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
          else if (e.key === 'ArrowDown') { e.preventDefault(); PAL.cursor = Math.min(PAL.items.length - 1, PAL.cursor + 1); paintPalette(); refocus(); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); PAL.cursor = Math.max(0, PAL.cursor - 1); paintPalette(); refocus(); }
          else if (e.key === 'Enter') {
            e.preventDefault();
            const chosen = PAL.items[PAL.cursor];
            if (chosen) { const run = chosen.run; closePalette(); run(); }
          }
        },
      }),
      list,
      el('div', { class: 'pal-foot' }, '↑ ↓ to choose · Enter to run · Esc to close'),
    ]));

  list.id = 'pal-list';
  const on = list.querySelector('.pal-item.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
}

/** Repainting rebuilds the input, so the caret has to be given back. */
function refocus() {
  const input = document.getElementById('pal-input');
  if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}
