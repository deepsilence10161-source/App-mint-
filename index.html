/* ------------------------------------------------------------------ *
 * HELPERS
 * ------------------------------------------------------------------ */
const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

function checkType(val, def, path, out) {
  switch (def.type) {
    case 'string':
      if (typeof val !== 'string') { out.push(issue('E_TYPE', 'error', path, `Expected text, got ${Array.isArray(val) ? 'list' : typeof val}.`)); return false; }
      if (def.minLength != null && val.length < def.minLength) out.push(issue('E_MINLEN', 'error', path, `Must be at least ${def.minLength} character(s).`));
      if (def.maxLength != null && val.length > def.maxLength) out.push(issue('E_MAXLEN', 'error', path, `Must be at most ${def.maxLength} characters (currently ${val.length}).`));
      if (def.pattern && !def.pattern.test(val)) out.push(issue('E_FORMAT', 'error', path, `"${val}" is not in the expected format.`));
      if (def.oneOf && !def.oneOf.includes(val)) out.push(issue('E_ENUM', 'error', path, `"${val}" is not one of: ${def.oneOf.join(', ')}.`, { options: def.oneOf }));
      if (def.members && !def.members.includes(val)) out.push(issue('E_ENUM', 'error', path, `"${val}" is not one of: ${def.members.join(', ')}.`));
      return true;
    case 'integer':
      if (!Number.isInteger(val)) { out.push(issue('E_TYPE', 'error', path, `Expected a whole number, got ${typeof val === 'number' ? val : typeof val}.`)); return false; }
      if (def.min != null && val < def.min) out.push(issue('E_RANGE', 'error', path, `${val} is below the minimum of ${def.min}.`, { min: def.min }));
      if (def.max != null && val > def.max) out.push(issue('E_RANGE', 'error', path, `${val} is above the maximum of ${def.max}.`, { max: def.max }));
      return true;
    case 'boolean':
      if (typeof val !== 'boolean') { out.push(issue('E_TYPE', 'error', path, `Expected true or false, got ${typeof val}.`)); return false; }
      return true;
    case 'array': {
      if (!Array.isArray(val)) { out.push(issue('E_TYPE', 'error', path, `Expected a list, got ${typeof val}.`)); return false; }
      if (def.of && def.of !== 'object') val.forEach((v, i) => checkType(v, { type: def.of }, `${path}[${i}]`, out));
      return true;
    }
    case 'object': {
      if (!isObj(val)) { out.push(issue('E_TYPE', 'error', path, `Expected a group of settings, got ${Array.isArray(val) ? 'list' : typeof val}.`)); return false; }
      if (def.required) for (const r of def.required) if (val[r] === undefined) out.push(issue('E_REQUIRED', 'error', `${path}.${r}`, `Missing required value.`));
      if (def.fields) for (const [k, sub] of Object.entries(def.fields)) if (val[k] !== undefined) checkType(val[k], sub, `${path}.${k}`, out);
      return true;
    }
    default: return true;
  }
}

let CODES = 0;
function issue(code, severity, path, message, extra = {}) {
  return { id: `${code}-${++CODES}`, code, severity, path, message, ...extra };
}

/* ------------------------------------------------------------------ *
 * THE FIVE LAYERS
 * ------------------------------------------------------------------ */

/** L1 — SCHEMA: shape, types, formats, required fields. */
function layer1Schema(spec, out) {
  if (!isObj(spec)) { out.push(issue('E_NOTOBJECT', 'error', '', 'The project specification must be a group of settings.')); return; }
  for (const r of SCHEMA.required) if (spec[r] === undefined) out.push(issue('E_REQUIRED', 'error', r, `Missing required section "${r}".`));
  for (const [k, def] of Object.entries(SCHEMA.fields)) if (spec[k] !== undefined) checkType(spec[k], def, k, out);
}

/** L2 — SEMANTIC: values valid alone but wrong together. */
function layer2Semantic(spec, out) {
  const id = spec.identity || {}, a = spec.android || {}, app = spec.app || {}, b = spec.build || {};

  if (id.packageName) {
    const badKeyword = String(id.packageName).split('.').find((seg) => JAVA_KEYWORDS.has(seg));
    if (badKeyword)
      out.push(issue('E_JAVA_KEYWORD_PKG', 'error', 'identity.packageName',
        `The package name contains "${badKeyword}", which is a Java reserved word. Android would compile the generated code into a package that Java cannot name, and the build would fail.`,
        { fix: { kind: 'set', path: 'identity.packageName',
            value: String(id.packageName).split('.').map((seg) => (JAVA_KEYWORDS.has(seg) ? seg + 'app' : seg)).join('.') } }));
  }

  if (id.packageName && RESERVED_PACKAGE_WORDS.some((w) => id.packageName === w || id.packageName.startsWith(w + '.')))
    out.push(issue('E_RESERVED_PKG', 'error', 'identity.packageName',
      `The package name starts with a reserved namespace ("${id.packageName.split('.').slice(0, 2).join('.')}"). Google Play rejects these.`,
      { fix: { kind: 'set', path: 'identity.packageName', value: 'com.example.' + (id.packageName.split('.').pop() || 'app') } }));

  if (id.packageName && /(app|example)$/i.test(id.packageName.split('.').pop()) && id.packageName.startsWith('com.example'))
    out.push(issue('W_DEFAULT_PKG', 'warning', 'identity.packageName',
      'This is still the placeholder package name. It is permanent once published — change it before your first release.'));

  if (a.minSdk && a.targetSdk && a.minSdk > a.targetSdk)
    out.push(issue('E_SDK_ORDER', 'error', 'android.minSdk',
      `Minimum SDK (${a.minSdk}) is higher than target SDK (${a.targetSdk}). No device could ever run this.`,
      { fix: { kind: 'set', path: 'android.minSdk', value: a.targetSdk } }));

  if (a.targetSdk && a.compileSdk && a.targetSdk > a.compileSdk)
    out.push(issue('E_COMPILE_BELOW_TARGET', 'error', 'android.compileSdk',
      `Target SDK (${a.targetSdk}) is higher than compile SDK (${a.compileSdk}). You cannot target what you do not compile against.`,
      { fix: { kind: 'set', path: 'android.compileSdk', value: a.targetSdk } }));

  // Play compliance — verified against the 2026 policy (API 36 for new apps/updates).
  if (a.targetSdk && a.targetSdk < 35 && (b.outputs || []).some((o) => o !== 'debug-apk'))
    out.push(issue('E_PLAY_TARGET', 'error', 'android.targetSdk',
      `Target SDK ${a.targetSdk} cannot be published to Google Play. Since 31 Aug 2026 new apps and all updates must target 36 (Android 16); 35 is the minimum to stay visible to new users.`,
      { fix: { kind: 'set', path: 'android.targetSdk', value: 36 } }));
  else if (a.targetSdk && a.targetSdk < 36 && (b.outputs || []).some((o) => o !== 'debug-apk'))
    out.push(issue('W_PLAY_TARGET', 'warning', 'android.targetSdk',
      `Target SDK ${a.targetSdk} is below 36. Google Play has required API 36 for new apps and updates since 31 Aug 2026.`));

  if (a.cleartextTraffic === true)
    out.push(issue('W_CLEARTEXT', 'warning', 'android.cleartextTraffic',
      'Plain HTTP traffic is allowed. Any network the user is on can read or change it. Only enable this for a legacy site with no HTTPS.',
      { fix: { kind: 'set', path: 'android.cleartextTraffic', value: false } }));

  if (a.allowBackup === true)
    out.push(issue('W_BACKUP', 'warning', 'android.allowBackup',
      'Android backup is on. If the app stores sign-in tokens, an unscoped backup can carry them off the device.',
      { fix: { kind: 'set', path: 'android.allowBackup', value: false } }));

  const insets = [];
  if (app.mode === 'webview' || app.mode === 'pwa' || app.mode === 'hybrid') {
    if (!app.webview || !app.webview.startUrl) insets.push(issue('E_NO_URL', 'error', 'app.webview.startUrl', `Mode "${app.mode}" needs a start URL.`));
  }
  if (app.mode === 'native-screens' && (!Array.isArray(spec.screens) || spec.screens.length === 0))
    insets.push(issue('E_NO_SCREENS', 'error', 'screens', 'Native-screens mode needs at least one screen.'));
  out.push(...insets);

  if (id.versionName && id.versionCode) {
    const patch = Number((id.versionName.split('.')[2] || id.versionName.split('.')[1] || '0'));
    if (Number.isFinite(patch) && patch > id.versionCode && id.versionCode === 1)
      out.push(issue('I_VERSION', 'info', 'identity.versionCode', 'Version code is still 1. Play requires a strictly increasing code on every upload.'));
  }
  if (id.versionStrategy === 'git-commit-count' && b.engine !== 'github-actions')
    out.push(issue('W_VERSION_STRATEGY', 'warning', 'identity.versionStrategy',
      'Version from git commit count needs the repository history. The GitHub Actions engine fetches it; other engines may not.'));
}

/** L3 — DEPENDENCY: things referencing things that do not exist. */
function layer3Dependency(spec, out) {
  const caps = spec.capabilities || [];
  const seen = new Set();
  for (const c of caps) {
    if (seen.has(c)) out.push(issue('E_DUP_CAP', 'error', 'capabilities',
      `Capability "${c}" is listed twice.`, { fix: { kind: 'removeArrayItem', path: 'capabilities', value: c } }));
    seen.add(c);
    if (!CAPABILITIES[c]) {
      const near = Object.keys(CAPABILITIES).filter((k) => k.toLowerCase().startsWith(String(c).slice(0, 3).toLowerCase())).slice(0, 3);
      out.push(issue('E_UNKNOWN_CAP', 'error', 'capabilities',
        `"${c}" is not a known capability.`, { options: near.length ? near : Object.keys(CAPABILITIES) }));
    }
  }

  const app = spec.app || {};
  const wv = app.webview || {};
  if (wv.fileUploads === true && !caps.includes('files'))
    out.push(issue('W_UPLOAD_NO_CAP', 'warning', 'app.webview.fileUploads',
      'File uploads need the "files" capability, otherwise the upload button will do nothing on the phone.',
      { fix: { kind: 'addArrayItem', path: 'capabilities', value: 'files' } }));

  if (app.mode === 'pwa' && !caps.includes('internet'))
    out.push(issue('W_PWA_NET', 'warning', 'app.mode',
      'PWA mode still loads its shell from the network on first run; the internet capability is recommended.',
      { fix: { kind: 'addArrayItem', path: 'capabilities', value: 'internet' } }));

  if (caps.includes('exactAlarms') && !caps.includes('notifications') && !caps.includes('bootStart'))
    out.push(issue('W_ALARM_ORPHAN', 'warning', 'capabilities',
      'Exact alarms are enabled but nothing uses them. This makes Android ask for a special "alarms and reminders" permission for no reason.',
      { fix: { kind: 'removeArrayItem', path: 'capabilities', value: 'exactAlarms' } }));

  if (caps.includes('payments') && (spec.backend || {}).kind === 'none')
    out.push(issue('E_PAY_NO_BACKEND', 'error', 'capabilities',
      'In-app purchases need a backend to verify the receipt server-side. Without it, the client would be trusted to say "paid" — which anyone can fake.',
      { hint: 'Set backend.kind to supabase or custom-rest.' }));

  if (caps.includes('googleAuth') && !caps.includes('internet'))
    out.push(issue('W_AUTH_NO_NET', 'warning', 'capabilities', 'Google Sign-In needs internet.',
      { fix: { kind: 'addArrayItem', path: 'capabilities', value: 'internet' } }));

  if (caps.includes('barcode') && !(wv.startUrl || (spec.screens || []).length))
    out.push(issue('W_BARCODE_UNUSED', 'info', 'capabilities', 'Barcode scanning is enabled but no screen uses it yet.'));

  const nav = spec.navigation || {};
  if (nav.type === 'bottom-tabs' && (spec.screens || []).length < 2)
    out.push(issue('W_NAV_THIN', 'warning', 'navigation.type', 'Bottom tabs with fewer than two screens leaves empty tabs.'));

  // Screens are structures: every reference inside them must resolve, and every
  // action must be able to run. This is where a half-built screen gets caught,
  // rather than at runtime on a user's phone.
  validateScreens(spec, out);
}

/** L4 — SECURITY: the gate. Critical findings block the build unless overridden. */
function layer4Security(spec, out) {
  const caps = spec.capabilities || [];
  const dl = spec.deepLinks || {};
  const b = spec.build || {};

  // Unsafe URL schemes must never be routed to a raw Intent (the exact defect
  // found in ff-user-panel/MainActivity.java).
  const DANGEROUS = ['intent', 'file', 'content', 'javascript', 'data', 'jar'];
  const offered = dl.allowedSchemes || [];
  for (const s of offered) {
    if (DANGEROUS.includes(String(s).toLowerCase()))
      out.push(issue('E_UNSAFE_SCHEME', 'critical', 'deepLinks.allowedSchemes',
        `Scheme "${s}" is unsafe to route automatically. It can launch arbitrary components or read local files.`,
        { fix: { kind: 'removeArrayItem', path: 'deepLinks.allowedSchemes', value: s } }));
  }

  if ((spec.signing || {}).mode === 'secret-store' && (spec.signing || {}).failClosed === false)
    out.push(issue('E_SIGNING_NOT_FAILCLOSED', 'critical', 'signing.failClosed',
      'Signing is set to a secret store but fail-closed is off. If the keystore is missing, a new one would be generated — which silently changes your app identity and permanently breaks Google Sign-In and every future update.',
      { fix: { kind: 'set', path: 'signing.failClosed', value: true } }));

  if ((b.outputs || []).some((o) => o !== 'debug-apk') && (spec.signing || {}).mode === 'none')
    out.push(issue('E_RELEASE_UNSIGNED', 'critical', 'signing.mode',
      'A release or AAB build was requested with signing disabled. The output could not be installed on any device.',
      { fix: { kind: 'set', path: 'signing.mode', value: 'secret-store' } }));

  if (caps.includes('ads') && (spec.build || {}).outputs?.length)
    out.push(issue('W_ADS_TRACKING', 'warning', 'capabilities',
      'Advertisements add a tracking identifier and are off for a reason. Enable only if you truly need them.'));

  if (caps.includes('location'))
    out.push(issue('W_LOCATION_HIGH_RISK', 'warning', 'capabilities',
      'Location is a high-risk permission. Google Play requires a written justification and, for background use, a review.'));

  // Secret-looking values inside the spec itself.
  const raw = JSON.stringify(spec);
  const SECRET_PATTERNS = [
    { re: /eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}/g, what: 'a JWT (possibly a service_role key)' },
    { re: /sk-[A-Za-z0-9]{20,}/g, what: 'an OpenAI-style secret key' },
    { re: /AIza[A-Za-z0-9_-]{30,}/g, what: 'a Google API key' },
    { re: /-----BEGIN [A-Z ]*PRIVATE KEY-----/g, what: 'a private key' },
    { re: /(?:password|passwd|secret|service_role)\s*[:=]\s*["'][^"']{8,}["']/gi, what: 'a hard-coded password or secret' },
  ];
  for (const { re, what } of SECRET_PATTERNS) {
    const m = raw.match(re);
    if (m) out.push(issue('E_SECRET_IN_SPEC', 'critical', 'spec',
      `The specification appears to contain ${what}. Remove it and keep it in the build engine's secret store — this file is committed to a repository.`,
      { redactedSample: String(m[0]).slice(0, 4) + '…redacted' }));
  }

  if (spec.backend && spec.backend.kind !== 'none' && (spec.backend.tablesRequiringRls || []).length === 0 && spec.backend.requiresAuth)
    out.push(issue('W_RLS_UNSPECIFIED', 'warning', 'backend.tablesRequiringRls',
      'Authentication is on, but no tables are listed as needing row-level security. RLS is the only thing standing between one signed-in user and another user\'s rows.'));
}

/** L5 — CAPABILITY: can the chosen engine actually produce this? */
function layer5Capability(spec, out) {
  const ENGINE = {
    'github-actions': { aab: true, signedApk: true, emulator: true, label: 'GitHub Actions (free, unlimited on public repos)' },
    'local-termux':   { aab: true, signedApk: true, emulator: false, label: 'Termux on the phone' },
    'local-desktop':  { aab: true, signedApk: true, emulator: true, label: 'This desktop' },
  };
  const b = spec.build || {};
  const e = ENGINE[b.engine || 'github-actions'];
  if (!e) { out.push(issue('E_UNKNOWN_ENGINE', 'error', 'build.engine', `Unknown build engine "${b.engine}".`)); return; }

  for (const o of b.outputs || []) {
    if (o === 'aab' && !e.aab) out.push(issue('E_ENGINE_NO_AAB', 'error', 'build.outputs', `${e.label} cannot produce an AAB.`));
    if ((o === 'signed-apk' || o === 'release-apk') && !e.signedApk) out.push(issue('E_ENGINE_NO_SIGN', 'error', 'build.outputs', `${e.label} cannot sign a release build.`));
  }

  const a = spec.android || {};
  // Toolchain compatibility is data-driven (engine/spec/toolchain.mjs) so the
  // validator and the generator can never disagree about what an AGP version
  // can actually compile.
  const effective = resolveToolchain(spec);
  const compileSdk = a.compileSdk ?? effective.maxCompileSdk;
  if (compileSdk > effective.maxCompileSdk) {
    const better = profileForCompileSdk(compileSdk);
    const bt = TOOLCHAIN_PROFILES[better];
    out.push(issue('E_TOOLCHAIN_TOO_OLD', 'error', 'build.toolchain.agp',
      `compileSdk ${compileSdk} cannot be compiled by AGP ${effective.agp} (it stops at SDK ${effective.maxCompileSdk}). ` +
      `Switch to the "${better}" profile: AGP ${bt.agp} with Gradle ${bt.gradle}.`,
      {
        fix: { kind: 'set', path: 'build.toolchain.agp', value: bt.agp },
        alsoNeeds: { 'build.toolchain.gradle': bt.gradle, 'build.toolchain.buildTools': bt.buildTools },
      }));
  }
  if (a.minSdk != null && a.minSdk < 21) out.push(issue('E_MIN_TOO_LOW', 'error', 'android.minSdk', 'Android 5.0 (API 21) is the oldest version still worth supporting.'));
  if (spec.app && spec.app.mode === 'pwa' && spec.build && spec.build.engine === 'local-termux')
    out.push(issue('W_PWA_TERMUX', 'warning', 'app.mode', 'PWA mode works, but offline caching behaves differently on the phone-based engine. Test on a real device.'));
}

/* ------------------------------------------------------------------ *
 * MAIN ENTRY
 * ------------------------------------------------------------------ */
const LAYERS = [
  { n: 1, name: 'Schema',     fn: layer1Schema },
  { n: 2, name: 'Semantic',   fn: layer2Semantic },
  { n: 3, name: 'Dependency', fn: layer3Dependency },
  { n: 4, name: 'Security',   fn: layer4Security },
  { n: 5, name: 'Capability', fn: layer5Capability },
];

/**
 * Run all five layers.
 * @returns {{ok:boolean, blocked:boolean, issues:Array, byLayer:Object, counts:Object}}
 * `blocked` is the gate: critical or error severities stop the build unless the
 * caller supplies an explicit, visible, logged override.
 */
function validateSpec(spec, opts = {}) {
  CODES = 0;
  const issues = [];
  const byLayer = {};
  for (const L of LAYERS) {
    const before = issues.length;
    L.fn(spec, issues);
    byLayer[L.n] = { name: L.name, issues: issues.slice(before) };
  }
  const overrides = opts.overrides || [];
  const isOverridden = (i) => overrides.some((o) => o.code === i.code);
  const blocking = issues.filter((i) => (i.severity === 'critical' || i.severity === 'error') && !isOverridden(i));
  const counts = { critical: 0, error: 0, warning: 0, info: 0 };
  for (const i of issues) counts[i.severity] = (counts[i.severity] || 0) + 1;
  return {
    ok: blocking.length === 0,
    blocked: blocking.length > 0,
    issues,
    blocking,
    byLayer,
    counts,
    overridesApplied: issues.filter((i) => (i.severity === 'critical' || i.severity === 'error') && isOverridden(i)).map((i) => i.code),
  };
}

/* ------------------------------------------------------------------ *
 * DETERMINISTIC REPAIR (rule-based only — never AI)
 * Applies ONLY high-confidence fixes that carry an explicit `fix` object,
 * records every change so it can be rolled back, and re-validates.
 * ------------------------------------------------------------------ */
function applyFixes(spec, issues, { onlyCodes = null, maxRounds = 5 } = {}) {
  const clone = JSON.parse(JSON.stringify(spec));
  const applied = [];
  let current = clone;
  let result = validateSpec(current);

  for (let round = 0; round < maxRounds; round++) {
    const candidates = result.issues.filter((i) =>
      i.fix && (onlyCodes ? onlyCodes.includes(i.code) : true) &&
      (i.severity === 'critical' || i.severity === 'error' || i.severity === 'warning'));
    if (candidates.length === 0) break;

    const chosen = candidates[0];
    const undo = setPath(current, chosen.fix);
    if (!undo) break;
    applied.push({ code: chosen.code, path: chosen.path, fix: chosen.fix, message: chosen.message, undo });
    result = validateSpec(current);
  }
  return { spec: current, applied, result, rolledBack: false };
}

function getParent(obj, path) {
  const parts = path.split('.');
  const last = parts.pop();
  let cur = obj;
  for (const p of parts) { if (cur == null) return null; cur = cur[p]; }
  return { parent: cur, key: last };
}

/** Apply one fix, returning the inverse operation so it can be rolled back. */
function setPath(spec, fix) {
  const loc = getParent(spec, fix.path);
  if (!loc || loc.parent == null) return null;
  const { parent, key } = loc;
  switch (fix.kind) {
    case 'set': {
      const had = key in parent;
      const prev = parent[key];
      parent[key] = fix.value;
      if (fix.alsoNeeds) for (const [p, v] of Object.entries(fix.alsoNeeds)) { const l = getParent(spec, p); if (l && l.parent) l.parent[l.key] = v; }
      return { kind: 'set', path: fix.path, had, prev };
    }
    case 'addArrayItem': {
      if (!Array.isArray(parent)) return null;
      const arr = parent[key] || (parent[key] = []);
      if (arr.includes(fix.value)) return null;
      arr.push(fix.value);
      return { kind: 'removeArrayItem', path: fix.path, value: fix.value };
    }
    case 'removeArrayItem': {
      const arr = parent[key];
      if (!Array.isArray(arr)) return null;
      const idx = arr.indexOf(fix.value);
      if (idx < 0) return null;
      arr.splice(idx, 1);
      return { kind: 'insertArrayItem', path: fix.path, value: fix.value, at: idx };
    }
    default: return null;
  }
}

/** Undo a previously applied fix. Guarantees automatic repairs are reversible. */
function rollbackFix(spec, entry) {
  const u = entry.undo, loc = getParent(spec, u.path);
  if (!loc || loc.parent == null) return false;
  const { parent, key } = loc;
  if (u.kind === 'set') { if (u.had) parent[key] = u.prev; else delete parent[key]; return true; }
  if (u.kind === 'removeArrayItem' && Array.isArray(parent[key])) { parent[key] = parent[key].filter((v) => v !== u.value); return true; }
  if (u.kind === 'insertArrayItem' && Array.isArray(parent[key])) { parent[key].splice(u.at, 0, u.value); return true; }
  return false;
}


/* ══════════════════════════════════════════════════════════════════════════
   REPAIR PLANNING
   ══════════════════════════════════════════════════════════════════════════

   applyFixes() above answers "make it valid". This answers the question that
   comes first: "what exactly would change, and am I allowed to do that on my
   own?"

   It works on a copy, so nothing is altered until the caller decides. Every
   step it returns carries the value before and the value after, because a
   repair nobody can inspect is a repair nobody can refuse.
   ══════════════════════════════════════════════════════════════════════════ */

/** The value at a dotted path, or undefined. Arrays use the usual [i] form. */
function readPath(obj, path) {
  if (!path) return undefined;
  const parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
  let cur = obj;
  for (const p of parts) {
    if (cur == null) return undefined;
    cur = cur[p];
  }
  return cur;
}

/**
 * What one repair would do, in the terms a person reads.
 *
 * The `before` and `after` are taken from the real specification rather than
 * composed from the finding's text, so what the screen shows is what the
 * engine would actually write.
 */
function describeFix(spec, issue) {
  const fix = issue.fix;
  // Read from the specification as it stands now, never from the post-repair
  // copy: "before" has to mean what the owner has, or the screen would show a
  // change from the repaired value to itself.
  const before = readPath(spec, fix.path);
  let next;
  if (fix.kind === 'set') next = fix.value;
  else if (fix.kind === 'addArrayItem') next = [...(Array.isArray(before) ? before : []), fix.value];
  else if (fix.kind === 'removeArrayItem') next = (Array.isArray(before) ? before : []).filter((v) => v !== fix.value);
  else next = undefined;

  const policy = confidenceOf(issue.code);
  return {
    code: issue.code,
    severity: issue.severity,
    path: fix.path,
    message: issue.message,
    kind: fix.kind,
    before,
    after: next,
    alsoNeeds: fix.alsoNeeds ? Object.entries(fix.alsoNeeds).map(([p, v]) => ({ path: p, value: v })) : [],
    confidence: policy.confidence,
    why: policy.why,
  };
}

/** A short "a → b" rendering of a value, for the screen. */
function showValue(v) {
  if (v === undefined) return 'not set';
  if (v === null) return 'nothing';
  if (typeof v === 'boolean') return v ? 'on' : 'off';
  if (Array.isArray(v)) return v.length ? v.join(', ') : 'empty';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

/**
 * Apply every forced repair, repeating until nothing is left to force.
 *
 * Two things make this less simple than it looks.
 *
 * First, one pass is not enough. Repairs have consequences: raising the compile
 * version to match the target version can leave the build tool too old for it,
 * a second problem that only exists because the first one was fixed.
 *
 * Second — and this is the part that matters — a repair offered by the engine is
 * not automatically a repair that works. The engine's own rule for a mismatched
 * SDK pair is "set compile to target", which is right until the target itself is
 * out of range, at which point carrying it out moves the value somewhere the
 * schema forbids and turns one error into two. A repair that makes the
 * specification worse is not a repair, and it is not applied here however
 * confidently it was proposed.
 *
 * So each round is judged on its result: it is kept only if it strictly reduces
 * the number of errors. Otherwise it is discarded, the loop stops, and the
 * reason is handed back for the screen to explain.
 */
function autoRepairAll(spec, maxRounds = 6) {
  const errorsIn = (r) => r.issues.filter((i) => i.severity === 'critical' || i.severity === 'error').length;

  let current = JSON.parse(JSON.stringify(spec));
  const applied = [];
  const refused = [];
  let result = validateSpec(current);
  let stopped = 'nothing-to-do';

  for (let round = 0; round < maxRounds; round++) {
    const codes = result.issues.filter((i) => i.fix && isAutoFixable(i.code)).map((i) => i.code);
    if (!codes.length) { stopped = 'settled'; break; }

    const step = applyFixes(current, result.issues, { onlyCodes: codes });
    if (!step.applied.length) { stopped = 'settled'; break; }

    const after = validateSpec(step.spec);
    if (errorsIn(after) >= errorsIn(result) && errorsIn(after) > 0) {
      // Kept nothing: say which repair was refused and what it would have cost.
      refused.push({
        code: step.applied[0].code,
        path: step.applied[0].path,
        message: step.applied[0].message,
        why: 'Carrying this out would leave more problems than it solves, so it was left alone.',
        wouldGive: errorsIn(after),
        had: errorsIn(result),
      });
      stopped = 'refused';
      break;
    }

    applied.push(...step.applied);
    current = step.spec;
    result = after;
  }

  return { spec: current, applied, result, refused, stopped };
}

/**
 * Plan the repairs for a specification.
 *
 * Returns three things:
 *   steps         — every repair available, each with its before and after
 *   stepsAuto     — the subset that may be done without asking
 *   stepsReview   — the subset that changes something the owner chose
 *
 * `preview.spec` is the specification you would get from doing the automatic
 * repairs, worked out on a copy. `preview.result` is what the validator says
 * about that outcome, which is how a caller can tell the honest truth — "this
 * fixes 3 of 5 problems" — instead of implying that every repair succeeds.
 */
function planFixes(spec, issues = null, { onlyCodes = null } = {}) {
  const findings = issues || validateSpec(spec).issues;
  const withFix = findings.filter((i) => i && i.fix && (!onlyCodes || onlyCodes.includes(i.code)));

  // Only forced repairs take the automatic pass. A repair that changes a
  // decision the owner made is never in it, whatever its severity: severity
  // says how bad the problem is, not how safe the answer is.
  const preview = autoRepairAll(spec);

  const steps = withFix.map((i) => describeFix(spec, i));

  // A forced repair can be discovered by another forced repair — the toolchain
  // step above only exists once the compile version has moved. Those are real
  // steps, so they are listed too, marked as automatic.
  const known = new Set(steps.map((x) => x.code));
  for (const a of preview.applied) {
    if (known.has(a.code)) continue;
    known.add(a.code);
    steps.push({
      code: a.code,
      severity: 'error',
      path: a.path,
      message: a.message,
      kind: (a.fix || {}).kind || 'set',
      before: a.undo && a.undo.kind === 'set' ? a.undo.prev : undefined,
      after: (a.fix || {}).value,
      alsoNeeds: [],
      confidence: 'high',
      why: confidenceOf(a.code).why,
      discovered: true,
    });
  }

  return {
    steps,
    stepsAuto: steps.filter((s) => s.confidence === 'high'),
    stepsReview: steps.filter((s) => s.confidence !== 'high'),
    preview: {
      spec: preview.spec,
      applied: preview.applied.map((a) => ({ code: a.code, path: a.path, message: a.message, undo: a.undo })),
      result: preview.result,
      // Repairs the engine declined to make, and why. Empty is the normal case;
      // when it is not empty the screen says so rather than pretending the
      // problem was handled.
      refused: preview.refused || [],
      stopped: preview.stopped,
    },
    changed: preview.applied.length,
  };
}

/**
 * Apply the repairs a person has agreed to, and report what changed.
 *
 * `codes` names the findings to repair; leaving it out means "everything that
 * may be done without asking". Each entry in `applied` carries the inverse
 * operation, so the whole thing can be undone by walking backwards through it
 * with rollbackFix().
 */
function repair(spec, { codes = null, issues = null } = {}) {
  const before = validateSpec(spec);
  const chosen = codes || before.issues.filter((i) => i.fix && isAutoFixable(i.code)).map((i) => i.code);
  if (!chosen.length) return { spec, applied: [], before, after: before, changed: 0 };

  const reviewCodes = chosen.filter((c) => !isAutoFixable(c));
  const wantsAuto = chosen.some((c) => isAutoFixable(c));

  // The forced repairs run to completion, including any they reveal along the
  // way. A repair that needed a decision is applied exactly as asked, one code
  // at a time, with its own undo entry — recorded with the same honesty.
  const first = wantsAuto
    ? autoRepairAll(spec)
    : { spec: JSON.parse(JSON.stringify(spec)), applied: [], result: before };

  let current = first.spec;
  const applied = [...first.applied];

  for (const code of reviewCodes) {
    const result = applyFixes(current, validateSpec(current).issues, { onlyCodes: [code] });
    current = result.spec;
    applied.push(...result.applied);
  }

  const after = validateSpec(current);
  return { spec: current, applied, before, after, changed: applied.length };
}

/**
 * PERMISSION MINIMIZATION ENGINE
 * ==============================
 * Android permissions are DERIVED from enabled capabilities — never written by
 * hand, never inherited "just in case". Disable a capability and its permission
 * disappears from the manifest. This is enforced by the generator.
 *
 * Every derived permission carries the capability that caused it and a
 * human-readable reason, so the Studio can show the user the exact table:
 *
 *   PERMISSION              WHY                        FEATURE
 *   POST_NOTIFICATIONS      Reminders and alerts       Notifications
 *   CAMERA                  Needed to scan a code      Barcode / QR
 *
 * Just as important: this module reports permissions the generated app does NOT
 * need, and permissions that were *requested by a capability but dropped as
 * unnecessary* (e.g. WRITE_EXTERNAL_STORAGE on modern Android, where it is a
 * no-op). Fewer permissions = smaller attack surface + a smaller APK.
 */

/** Android permission -> manifest declaration attributes. */
const PERMISSION_META = {
  INTERNET:                    { protectionLevel: 'normal' },
  ACCESS_NETWORK_STATE:        { protectionLevel: 'normal' },
  POST_NOTIFICATIONS:          { protectionLevel: 'dangerous', runtime: true, since: 33 },
  SCHEDULE_EXACT_ALARM:        { protectionLevel: 'special', runtime: true, since: 31 },
  RECEIVE_BOOT_COMPLETED:      { protectionLevel: 'normal' },
  VIBRATE:                     { protectionLevel: 'normal' },
  CAMERA:                      { protectionLevel: 'dangerous', runtime: true },
  READ_EXTERNAL_STORAGE:       { protectionLevel: 'dangerous', runtime: true, maxSdk: 32, replacedBy: 'READ_MEDIA_* (33+)' },
  WRITE_EXTERNAL_STORAGE:      { protectionLevel: 'dangerous', runtime: true, maxSdk: 28, note: 'Ignored on Android 11+; kept only for Android 9 and below.' },
  ACCESS_FINE_LOCATION:        { protectionLevel: 'dangerous', runtime: true },
  ACCESS_COARSE_LOCATION:      { protectionLevel: 'dangerous', runtime: true },
  AD_ID:                       { protectionLevel: 'normal' },
  'com.android.vending.BILLING': { protectionLevel: 'normal' },
};

/**
 * Derive the minimal permission set for a spec.
 * @param {object} spec
 * @returns {{permissions:Array<{name:string,reason:string,feature:string,attrs:object}>,
 *            dropped:Array<{name:string,reason:string}>,
 *            unknownCapabilities:string[]}}
 */
function derivePermissions(spec) {
  const caps = Array.isArray(spec.capabilities) ? spec.capabilities : [];
  const android = spec.android || {};
  const app = spec.app || {};
  const targetSdk = android.targetSdk ?? 36;

  // internet is implicit: any networked app needs it, but we still show it.
  const active = new Set(['internet', ...caps]);

  // ---- collect ---------------------------------------------------------
  const wanted = new Map(); // name -> { reason, features:Set }
  for (const capId of active) {
    const cap = CAPABILITIES[capId];
    if (!cap) continue;
    for (const p of cap.permissions) {
      if (!wanted.has(p)) wanted.set(p, { reason: cap.reason, features: new Set() });
      wanted.get(p).features.add(cap.label);
    }
  }

  // Internet already answered by a richer reason above? keep the specific one.

  // ---- what a careless implementation would have requested ----------------
  //
  // The first version of this tried to drop permissions *after* collecting
  // them, which could never fire: only an enabled capability can contribute a
  // permission, so the condition "the capability is off" was unreachable. The
  // feature that was supposed to prove permission minimisation never produced
  // any output at all. Found by the browser test that asserted on it.
  //
  // The honest version compares against everything ANY capability could ask
  // for, and reports the difference. That is a real, checkable claim: this app
  // is not requesting these, and here is why.
  const couldAsk = new Map(); // permission -> Set of capability labels
  for (const cap of Object.values(CAPABILITIES)) {
    for (const p of cap.permissions) {
      if (!couldAsk.has(p)) couldAsk.set(p, new Set());
      couldAsk.get(p).add(cap.label);
    }
  }

  const dropped = [];
  for (const [name, features] of couldAsk) {
    if (wanted.has(name)) continue;
    const names = [...features];
    dropped.push({
      name,
      reason: `capability "${names.join(' / ')}" is turned off`,
    });
  }
  dropped.sort((a, b) => a.name.localeCompare(b.name));

  // ---- build the report ------------------------------------------------
  const permissions = [];
  for (const [name, info] of [...wanted.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
    const meta = PERMISSION_META[name] || {};
    const attrs = {};
    // Some permissions are meaningless on newer Android; those are capped with
    // android:maxSdkVersion rather than requested on every device.
    if (meta.maxSdk != null) attrs.maxSdkVersion = meta.maxSdk;
    permissions.push({
      name: `android.permission.${name}`,
      short: name,
      reason: info.reason,
      feature: [...info.features].join(' + '),
      attrs,
      runtime: !!meta.runtime,
      since: meta.since || null,
      note: meta.note || null,
    });
  }

  const unknownCapabilities = caps.filter((c) => !CAPABILITIES[c]);

  return { permissions, dropped, unknownCapabilities };
}

/**
 * Which permissions the user will actually be PROMPTED for at runtime.
 * Shown before every build so there are no surprises on the phone.
 */
function runtimePrompts(spec) {
  const { permissions } = derivePermissions(spec);
  const targetSdk = (spec.android || {}).targetSdk ?? 36;
  return permissions.filter((p) => p.runtime && (!p.since || targetSdk >= p.since));
}

/** Human-readable summary block used by both the CLI and the Studio UI. */
function permissionReport(spec) {
  const { permissions, dropped } = derivePermissions(spec);
  const rows = permissions.map((p) => ({
    permission: p.short,
    why: p.reason,
    feature: p.feature,
    prompt: p.runtime ? 'Yes' : 'No',
    scope: p.attrs.maxSdkVersion ? `Android ≤ ${p.attrs.maxSdkVersion}` : 'All versions',
  }));
  return {
    rows,
    dropped,
    total: rows.length,
    prompts: rows.filter((r) => r.prompt === 'Yes').length,
  };
}


/* ═══ engine/spec/health.mjs ═══ */
/* ============================================================================
   PROJECT HEALTH — a score that can be argued with
   ----------------------------------------------------------------------------
   The design prompt asks for a health dashboard and then says the thing that
   makes it worth building: "Do not invent arbitrary scores. Every score must be
   calculated from measurable checks," and a person must be able to open "Why
   this score?" and see the exact checks.

   So a score here is not a number that was chosen. It is the outcome of a list
   of named checks, each of which passes, warns or fails for a stated reason, and
   the score is derived from that list by one rule that applies to every category
   alike. Two consequences follow, and both are the point:

     · a score can always be explained, because the checks are the explanation;
     · a score can be disagreed with, because the checks are visible and a person
       who thinks a check is wrong can say which one.

   And where there is nothing to measure, the category says so and scores
   nothing. A dashboard full of confident numbers, several of which were made up
   to fill the grid, teaches people to ignore all of them.

   Inputs are the specification and the result of validateSpec — the same call
   the CLI, CI and the Studio already make. Nothing here re-validates, because a
   second validator would eventually disagree with the first and nobody would
   know which to believe.
   ========================================================================= */

/** What a single check decided, and why. */
function pass(name, detail) { return { name, status: 'pass', detail }; }
function warn(name, detail) { return { name, status: 'warn', detail }; }
function fail(name, detail) { return { name, status: 'fail', detail }; }

/** Findings belonging to one validation layer. */
function layerIssues(result, n) {
  return (result.byLayer && result.byLayer[n] && result.byLayer[n].issues) || [];
}

function blockingIn(result, n) {
  return layerIssues(result, n).filter((i) => i.severity === 'critical' || i.severity === 'error');
}

/* ── categories ──────────────────────────────────────────────────────────────
   Each returns a list of checks. A category with no checks scores null, and the
   interface shows "nothing to measure" rather than a reassuring 100.
   ──────────────────────────────────────────────────────────────────────────── */

function buildHealth(spec, result) {
  const checks = [];
  const a = spec.android || {};

  checks.push(result.blocked
    ? fail('The specification validates',
        `${result.blocking.length} blocking problem(s): ${result.blocking.slice(0, 3).map((i) => i.code).join(', ')}`)
    : pass('The specification validates', 'All five validation layers passed.'));

  if (Number.isFinite(a.minSdk) && Number.isFinite(a.targetSdk)) {
    checks.push(a.minSdk <= a.targetSdk
      ? pass('Minimum SDK is not above the target', `minSdk ${a.minSdk} ≤ targetSdk ${a.targetSdk}`)
      : fail('Minimum SDK is not above the target', `minSdk ${a.minSdk} > targetSdk ${a.targetSdk} — no device can install this`));
  }

  // Google Play has required API 36 for new apps and updates since 31 Aug 2026.
  if (Number.isFinite(a.targetSdk)) {
    checks.push(a.targetSdk >= 36
      ? pass('Target SDK meets the Play requirement', `targetSdk ${a.targetSdk}`)
      : warn('Target SDK meets the Play requirement',
          `targetSdk ${a.targetSdk} is below the API 36 that Play requires for new apps and updates`));
  }

  if (spec.identity && spec.identity.packageName) {
    checks.push(pass('Package name is present', spec.identity.packageName));
  } else {
    checks.push(fail('Package name is present', 'No package name is set.'));
  }

  const mode = (spec.app || {}).mode;
  if (mode) checks.push(pass('Architecture is chosen', mode));

  return checks;
}

function securityHealth(spec, result) {
  const checks = [];
  const a = spec.android || {};
  const wv = ((spec.app || {}).webview) || {};

  // Layer 4 is the security layer: unsafe schemes, signing that is not
  // fail-closed, secrets committed into the specification.
  const sec = blockingIn(result, 4);
  checks.push(sec.length
    ? fail('The security layer found nothing blocking', sec.map((i) => i.code).join(', '))
    : pass('The security layer found nothing blocking', 'No unsafe scheme, no fail-open signing, no secret in the specification.'));

  checks.push(a.cleartextTraffic
    ? fail('Cleartext HTTP is off', 'Cleartext traffic is enabled, so traffic can be read or altered in transit.')
    : pass('Cleartext HTTP is off', 'Traffic is required to be encrypted.'));

  checks.push(a.allowBackup
    ? warn('App data is not backed up', 'allowBackup is on: app data can be extracted with adb on a device with USB debugging.')
    : pass('App data is not backed up', 'allowBackup is off.'));

  // The JavaScript bridge is the widest surface in a WebView app, so it is only
  // acceptable when something needs it.
  if (wv.javascriptEnabled) {
    checks.push(warn('The JavaScript bridge is off unless needed',
      'JavaScript is enabled in the WebView. Every method exposed to a page is attack surface.'));
  } else {
    checks.push(pass('The JavaScript bridge is off unless needed', 'JavaScript is disabled.'));
  }

  const hosts = wv.allowedHosts;
  if ((spec.app || {}).mode === 'webview' || (spec.app || {}).mode === 'hybrid') {
    checks.push(Array.isArray(hosts) && hosts.length
      ? pass('Navigation is limited to named hosts', `${hosts.length} host(s) allowlisted`)
      : warn('Navigation is limited to named hosts', 'No allowlist, so any host the app reaches can be loaded.'));
  }

  return checks;
}

function dependencyHealth(spec, result) {
  const checks = [];
  const dep = blockingIn(result, 3);
  checks.push(dep.length
    ? fail('Nothing references a capability or screen that is not there', dep.map((i) => i.code).join(', '))
    : pass('Nothing references a capability or screen that is not there', 'Every capability, screen and navigation target exists.'));

  const caps = Array.isArray(spec.capabilities) ? spec.capabilities : [];
  checks.push(pass('Capabilities are declared', caps.length ? `${caps.length}: ${caps.join(', ')}` : 'none enabled'));
  return checks;
}

function permissionHealth(spec, report) {
  const checks = [];
  if (!report) return checks;

  checks.push(report.total === 0
    ? warn('The app declares the permissions it needs', 'No permissions at all — unusual unless the app does nothing.')
    : pass('The app declares the permissions it needs', `${report.total} permission(s), each traced to a capability.`));

  // Every permission that is not requested is a smaller attack surface, and the
  // engine reports those deliberately rather than staying quiet about them.
  const dropped = Array.isArray(report.dropped) ? report.dropped.length : 0;
  checks.push(dropped
    ? pass('Unneeded permissions are refused', `${dropped} permission(s) deliberately not requested`)
    : warn('Unneeded permissions are refused', 'Nothing was refused — check that capabilities are not over-enabled.'));

  checks.push(report.prompts === 0
    ? pass('No runtime prompt is needed at first launch', 'Nothing is requested at runtime.')
    : warn('No runtime prompt is needed at first launch',
        `${report.prompts} permission(s) prompt the user, and a refusal has to be handled`));

  return checks;
}

function backendHealth(spec) {
  const b = spec.backend;
  if (!b || !b.kind || b.kind === 'none') return [];   // nothing configured: nothing to score
  const checks = [];
  checks.push(pass('A backend is configured', String(b.kind)));
  if (b.url) checks.push(/^https:/i.test(String(b.url))
    ? pass('The backend is reached over HTTPS', String(b.url))
    : fail('The backend is reached over HTTPS', String(b.url)));
  return checks;
}

/* ── scoring ───────────────────────────────────────────────────────────────── */

/**
 * One rule for every category, so a score means the same thing everywhere.
 *
 * A failing check dominates, and deliberately so: a category with one failure
 * lands in the "poor" band however many things passed. The first version of this
 * scaled failures gently by how many checks there were, which let a category
 * with a blocking failure among nine passed checks read as 65 — "fair" — and
 * that is a dashboard telling you something untrue. What passed is not
 * consolation for the one thing that will stop the build.
 */
function scoreChecks(checks) {
  if (!checks || !checks.length) return null;
  const failed = checks.filter((c) => c.status === 'fail').length;
  const warned = checks.filter((c) => c.status === 'warn').length;
  if (failed) return Math.max(0, Math.round(100 * (1 - failed / checks.length) * 0.4));
  if (warned) return Math.round(100 - 60 * (warned / checks.length));
  return 100;
}

function bandOf(score) {
  if (score === null) return 'none';
  if (score >= 85) return 'good';
  if (score >= 60) return 'fair';
  return 'poor';
}

/**
 * The whole dashboard. `validation` is the result of validateSpec and `report`
 * the result of permissionReport; both are already computed by every caller, so
 * nothing is validated twice and the numbers cannot disagree with the Build
 * screen.
 */
function projectHealth(spec, validation, report) {
  const s = spec || {};
  const categories = [
    { key: 'build',      label: 'Build',      checks: buildHealth(s, validation) },
    { key: 'security',   label: 'Security',   checks: securityHealth(s, validation) },
    { key: 'dependency', label: 'Dependency', checks: dependencyHealth(s, validation) },
    { key: 'permission', label: 'Permission', checks: permissionHealth(s, report) },
    { key: 'backend',    label: 'Backend',    checks: backendHealth(s) },
  ];

  for (const c of categories) {
    c.score = scoreChecks(c.checks);
    c.band = bandOf(c.score);
    c.failing = c.checks.filter((x) => x.status === 'fail').length;
    c.warning = c.checks.filter((x) => x.status === 'warn').length;
  }

  const scored = categories.filter((c) => c.score !== null);
  return {
    categories,
    // An overall number is the weakest measured category, not the average of
    // them. The first version averaged, and a blank specification — build
    // scoring 0 because it has no package name and will not compile — reported
    // an overall of 65, "fair", because four other categories were happy. A
    // dashboard that can describe a project which cannot build as fair is worse
    // than no dashboard: it has been read and believed.
    //
    // Taking the minimum is also the only rule here that invents nothing. Any
    // weighted average needs weights, and there is no measurement that says
    // security is worth 30% and permissions 10%. The minimum needs no opinion,
    // and it matches the rule already used inside a category, where one failing
    // check dominates the rest.
    overall: scored.length ? Math.min(...scored.map((c) => c.score)) : null,
    weakest: scored.length
      ? scored.reduce((worst, c) => (c.score < worst.score ? c : worst), scored[0]).key
      : null,
    measured: scored.length,
    unmeasured: categories.length - scored.length,
  };
}


/* ═══ engine/spec/pipeline.mjs ═══ */
/* ============================================================================
   BUILD PIPELINE — a stepper that reports a build, rather than performing one
   ----------------------------------------------------------------------------
   The design prompt asks for a pipeline stepper: Guards → Security →
   Dependencies → Build → Sign → Validate → Smoke Test → Done. Those are the
   stages a build conceptually passes through, and they are worth showing.

   What would not be worth showing is a stepper that animates through those
   words on a timer while nothing is happening. That is the most common way this
   feature gets built and it is a lie with a progress bar. So the stages here are
   only ever a grouping of the steps GitHub Actions actually reported for the run
   the Studio started, read from the run's jobs API. A stage is done when its
   real steps are done; it is running when one of them is running; it failed
   because a named step failed, and the name is on the screen.

   Two rules fall out of that, and both exist because the obvious alternative is
   quietly dishonest:

     · a step no rule matched is listed under "Other steps" instead of being
       dropped. A stepper that only shows the stages it knows how to draw will
       look perfectly green through a build that is failing somewhere it never
       learned to look.

     · a stage the workflow never had is not drawn. "Sign" is a real stage in the
       build pipeline because Gradle signs the APK as it builds, and the signing
       scheme is verified against the finished file. It is deliberately absent
       from the device pipeline, which installs an already-signed APK and has no
       signing step of its own. The prompt lists the stages; it does not require
       inventing one to match the list.
   ========================================================================= */

const BUILD_STAGES = [
  { key: 'guards',  label: 'Guards',       icon: 'shield', rules: [/validate specification/i, /pick specification/i, /engine self-tests/i, /check the committed bundle/i] },
  { key: 'security', label: 'Security',    icon: 'lock',   rules: [/row level security/i, /permission table/i, /secret/i] },
  { key: 'deps',    label: 'Dependencies', icon: 'package', rules: [/set up (node|jdk|gradle)/i, /prepare android sdk/i, /install a browser/i, /build the studio bundle/i, /build the single-file studio/i] },
  { key: 'build',   label: 'Build',        icon: 'build',  rules: [/generate android project/i, /build (debug|both apps|release)/i, /assemble/i, /restore the build cache/i, /work out the build keys/i] },
  { key: 'sign',    label: 'Sign',         icon: 'sign',   rules: [/sign/i] },
  { key: 'verify',  label: 'Validate',     icon: 'check',  rules: [/validate the real artifact/i, /locate artifact/i, /stage (both )?apks?/i, /upload (apk|build report)/i, /analyse a website/i] },
  { key: 'done',    label: 'Done',         icon: 'flag',   rules: [] },
];

// The device workflow builds an APK and then runs it on an emulator. There is no
// signing step of its own, so no Sign stage is claimed here.
const DEVICE_STAGES = [
  { key: 'guards',  label: 'Guards',      icon: 'shield',  rules: [/validate (both )?specifications?/i, /work out the build keys/i, /enable kvm/i] },
  { key: 'deps',    label: 'Dependencies', icon: 'package', rules: [/set up (node|jdk|gradle)/i, /prepare android sdk/i, /restore the build cache/i] },
  { key: 'build',   label: 'Build',       icon: 'build',   rules: [/build both apps/i, /stage (both )?apks?/i, /report what the cache did/i] },
  { key: 'smoke',   label: 'Smoke Test',  icon: 'phone',   rules: [/run the app on the emulator/i] },
  { key: 'verify',  label: 'Validate',    icon: 'check',   rules: [/judge the evidence/i, /build a report/i, /publish the report/i, /upload evidence/i, /verdict/i] },
  { key: 'done',    label: 'Done',        icon: 'flag',    rules: [] },
];

/** Which stage list a workflow's steps should be read against. */
function stagesFor(workflowName) {
  return /device|emulator/i.test(workflowName || '') ? DEVICE_STAGES : BUILD_STAGES;
}

const ACTIVE = new Set(['queued', 'in_progress', 'waiting', 'pending', 'requested']);

/** A step's status, collapsed to what a stepper can show. */
function buildStepStatus(step) {
  const c = step && step.conclusion;
  if (c === 'failure' || c === 'timed_out') return 'failed';
  if (c === 'cancelled') return 'cancelled';
  if (c === 'skipped') return 'skipped';
  if (c === 'success') return 'done';
  if (c) return 'done';                       // neutral, action_required: it finished
  if (step && ACTIVE.has(step.status)) return 'running';
  return 'waiting';
}

/** One stage's status, from the statuses of the steps that landed in it. */
function stageStatus(steps) {
  const s = steps.map(buildStepStatus);
  if (s.includes('failed')) return 'failed';
  if (s.includes('cancelled')) return 'cancelled';
  if (s.includes('running')) return 'running';
  const real = s.filter((x) => x !== 'skipped');
  if (!real.length) return 'waiting';
  return real.every((x) => x === 'done') ? 'done' : 'waiting';
}

/**
 * Group the real steps of a run into stages.
 *
 * `steps` is the flat list of steps across the run's jobs, in the order GitHub
 * returned them. Steps that no rule matches are returned under `other` rather
 * than discarded — see the note at the top of this file.
 */
function pipelineStages(steps, stageDefs, run) {
  const list = Array.isArray(steps) ? steps : [];
  const stages = stageDefs.map((d) => ({ key: d.key, label: d.label, icon: d.icon, steps: [] }));
  const other = [];
  const used = new Set();

  for (const step of list) {
    const name = (step && step.name) || '(unnamed step)';
    let placed = false;
    for (const stage of stages) {
      const def = stageDefs.find((d) => d.key === stage.key);
      if (def.rules.some((re) => re.test(name))) {
        stage.steps.push(step);
        used.add(stage.key);
        placed = true;
        break;
      }
    }
    if (!placed) other.push(step);
  }

  // "Done" is not something a workflow step announces; it is whether the run
  // itself finished, and how. It is drawn last and always, so a stepper never
  // looks complete while the run is still going.
  const done = stages.find((s) => s.key === 'done');
  if (done) {
    const conclusion = run && run.conclusion;
    done.status = conclusion === 'success' ? 'done'
      : (conclusion === 'failure' || conclusion === 'timed_out') ? 'failed'
      : conclusion === 'cancelled' ? 'cancelled'
      : (run && ACTIVE.has(run.status)) ? 'running'
      : 'waiting';
    done.detail = conclusion ? `run ${conclusion}` : (run && run.status) ? `run ${run.status}` : 'not started';
  }

  const shown = stages.filter((s) => s.key === 'done' || used.has(s.key));
  for (const s of shown) {
    if (s.key === 'done') continue;
    s.status = stageStatus(s.steps);
    const failed = s.steps.find((x) => buildStepStatus(x) === 'failed');
    s.detail = failed
      ? `failed at “${failed.name}”`
      : `${s.steps.filter((x) => buildStepStatus(x) !== 'skipped').length} of ${s.steps.length} steps done`;
  }

  return {
    stages: shown,
    other,
    // Every stage that exists in the definition but never matched a step, named
    // so a reader can tell "not reached yet" from "this pipeline has no such
    // stage" without guessing.
    absent: stages.filter((s) => s.key !== 'done' && !used.has(s.key)).map((s) => s.label),
  };
}

/** Flatten the steps out of a GitHub jobs response, keeping their order. */
function stepsFromJobs(jobs) {
  const out = [];
  for (const job of (jobs && jobs.jobs) || []) {
    for (const step of job.steps || []) out.push({ ...step, job: job.name });
  }
  return out;
}


/* ═══ engine/analyse/html.mjs ═══ */
/**
 * READING A WEB PAGE WITHOUT A BROWSER
 * =====================================
 *
 * The analyser has to understand enough HTML and CSS to answer practical
 * questions — what is this page called, what does it link to, does it work
 * without a network, what colour is it — and it has to answer them the same way
 * every time, on a phone, with no browser, no dependencies and no AI.
 *
 * So this is a small tolerant scanner rather than a full HTML parser. It is
 * written to the parts that matter and honest about the parts it does not do:
 *
 *   What it does:  tags, attributes, quoted values, comments, raw text inside
 *                  <script> and <style>, text content, and enough structure to
 *                  follow <nav>, <header>, <main>, <footer>, headings, links,
 *                  images and forms.
 *
 *   What it does not: the full HTML5 tree-building algorithm. No implied
 *                  <tbody>, no foster parenting, no error recovery to the
 *                  specification. A page that relies on those to look right will
 *                  still be read correctly for everything above, because none of
 *                  it depends on element nesting being legal — but the *browser*
 *                  is what renders the app, not this file, so an approximation
 *                  that only feeds decisions is the right size of tool.
 *
 * Every function here is pure: same input, same output, no I/O, no clock.
 */

const VOID_ELEMENTS = new Set(['area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input',
  'link', 'meta', 'param', 'source', 'track', 'wbr']);

const RAW_TEXT_ELEMENTS = new Set(['script', 'style', 'textarea', 'title']);

const ENTITIES = {
  amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ',
  hellip: '…', mdash: '—', ndash: '–', rsquo: '’', lsquo: '‘',
  rdquo: '”', ldquo: '“', copy: '©', reg: '®', trade: '™', pound: '£', euro: '€', rupee: '₹',
};

/** Decode the entities that actually appear in titles and link text. */
function decodeEntities(s) {
  return String(s)
    .replace(/&#x([0-9a-f]+);/gi, (_, h) => safeCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (_, d) => safeCodePoint(parseInt(d, 10)))
    .replace(/&([a-z]+);/gi, (m, name) => (ENTITIES[name.toLowerCase()] ?? m));
}

function safeCodePoint(n) {
  // A page can contain any number at all; String.fromCodePoint throws outside
  // the Unicode range, and one malformed entity should not stop an analysis.
  if (!Number.isFinite(n) || n < 0 || n > 0x10ffff) return '';
  try { return String.fromCodePoint(n); } catch { return ''; }
}

/** Collapse whitespace the way rendered text does. */
const squash = (s) => String(s).replace(/\s+/g, ' ').trim();

/**
 * Scan an attribute string into an object.
 * Unquoted values are accepted because real pages contain them.
 */
function parseAttributes(source) {
  const attrs = {};
  const re = /([a-zA-Z_:][-a-zA-Z0-9_:.]*)(?:\s*=\s*("([^"]*)"|'([^']*)'|([^\s"'=<>`]+)))?/g;
  let m;
  while ((m = re.exec(source))) {
    const name = m[1].toLowerCase();
    const value = m[3] ?? m[4] ?? m[5] ?? '';
    if (!(name in attrs)) attrs[name] = decodeEntities(value);
  }
  return attrs;
}

/**
 * Split a document into elements and text.
 *
 * Returns a flat list rather than a tree. Everything the analyser asks is a
 * question about what appears in the document — is there a viewport tag, which
 * links are relative, what does the first heading say — and flattening avoids
 * inventing a nesting model that would be wrong on malformed pages.
 */
function scanHtml(html) {
  const elements = [];
  const textParts = [];
  const source = String(html);
  let i = 0;
  let textStart = 0;

  const flushText = (end) => {
    if (end > textStart) textParts.push(decodeEntities(source.slice(textStart, end)));
  };

  while (i < source.length) {
    const lt = source.indexOf('<', i);
    if (lt === -1) break;

    // Comments: skipped whole, including the conditional-comment syntax that
    // old pages still carry.
    if (source.startsWith('<!--', lt)) {
      flushText(lt);
      const end = source.indexOf('-->', lt + 4);
      i = end === -1 ? source.length : end + 3;
      textStart = i;
      continue;
    }

    // Doctypes and processing instructions.
    if (source.startsWith('<!', lt) || source.startsWith('<?', lt)) {
      flushText(lt);
      const end = source.indexOf('>', lt);
      i = end === -1 ? source.length : end + 1;
      textStart = i;
      continue;
    }

    const gt = findTagEnd(source, lt + 1);
    if (gt === -1) break;

    flushText(lt);

    const raw = source.slice(lt + 1, gt);
    const closing = raw.startsWith('/');
    const body = closing ? raw.slice(1) : raw;
    const m = /^([a-zA-Z][-a-zA-Z0-9:]*)/.exec(body);
    if (!m) { i = gt + 1; textStart = i; continue; }

    const name = m[1].toLowerCase();
    const attrs = parseAttributes(body.slice(m[1].length));
    const selfClosing = raw.endsWith('/') || VOID_ELEMENTS.has(name);

    i = gt + 1;
    textStart = i;

    if (closing) {
      elements.push({ type: 'end', name });
      continue;
    }

    elements.push({ type: 'start', name, attrs, selfClosing });

    if (!selfClosing && RAW_TEXT_ELEMENTS.has(name)) {
      // Inside <script>, <style>, <textarea> and <title> nothing is markup until
      // the matching close tag: a `<` in JavaScript or a CSS child combinator is
      // not the start of an element, and treating it as one corrupts the scan
      // for the rest of the document.
      const closer = new RegExp(`</${name}\\s*>`, 'i');
      const rest = source.slice(i);
      const found = closer.exec(rest);
      const inner = found ? rest.slice(0, found.index) : rest;
      // <title> is a raw-text element because a title may contain a `<`, but it
      // is text a person reads, so its entities are decoded. The first version
      // pushed it raw, and every page title arrived in the analysis still
      // spelled &amp;.
      if (name === 'title') textParts.push(decodeEntities(inner));
      elements.push({ type: 'raw', name, text: inner });
      i = found ? i + found.index + found[0].length : source.length;
      textStart = i;
    }
  }
  flushText(source.length);

  return { elements, text: textParts.join(' ') };
}

/** Find the '>' that closes a tag, ignoring '>' inside quoted attributes. */
function findTagEnd(source, from) {
  let quote = null;
  for (let i = from; i < source.length; i += 1) {
    const ch = source[i];
    if (quote) { if (ch === quote) quote = null; continue; }
    if (ch === '"' || ch === "'") { quote = ch; continue; }
    if (ch === '>') return i;
  }
  return -1;
}

/* ── what the document says ───────────────────────────────────────────────── */

/** Classify a URL the way a WebView will have to. */
function classifyUrl(href) {
  const value = String(href || '').trim();
  if (!value) return { kind: 'empty' };
  if (/^[a-z][a-z0-9+.-]*:/i.test(value)) {
    const scheme = value.split(':')[0].toLowerCase();
    if (scheme === 'http' || scheme === 'https') return { kind: 'absolute', scheme, url: value };
    return { kind: 'scheme', scheme, url: value };
  }
  if (value.startsWith('//')) return { kind: 'absolute', scheme: 'inherit', url: value };
  if (value.startsWith('#')) return { kind: 'fragment', url: value };
  if (value.startsWith('/')) return { kind: 'root-relative', url: value };
  return { kind: 'relative', url: value };
}

/** Strip the tag soup and leave the words a person would read. */
function visibleText(html) {
  const { text } = scanHtml(html);
  return squash(text);
}

/**
 * Everything the analyser wants to know about one page.
 *
 * Deliberately one pass over the scan: the shape of this object is the contract
 * between reading a page and deciding what kind of app it becomes.
 */
function parsePage(html) {
  const { elements, text } = scanHtml(html);
  const page = {
    title: null,
    lang: null,
    meta: {},
    stylesheets: [],
    scripts: [],
    inlineScripts: 0,
    inlineStyles: 0,
    icons: [],
    links: [],
    images: [],
    forms: [],
    headings: [],
    landmarks: [],
    bodyText: squash(text),
    styleText: '',
  };

  let openForm = null;
  let openHeading = null;
  const openLandmarks = [];

  for (const el of elements) {
    if (el.type === 'raw') {
      if (el.name === 'style') page.styleText += `${el.text}\n`;
      if (el.name === 'script') page.inlineScripts += 1;
      continue;
    }
    if (el.type === 'end') {
      if (el.name === 'form' && openForm) { page.forms.push(openForm); openForm = null; }
      if (openHeading && el.name === `h${openHeading.level}`) openHeading = null;
      const at = openLandmarks.lastIndexOf(el.name);
      if (at !== -1) openLandmarks.splice(at, 1);
      continue;
    }

    const { name, attrs } = el;
    switch (name) {
      case 'html':
        if (attrs.lang) page.lang = attrs.lang;
        break;
      case 'title':
        break;                                   // captured through the raw text
      case 'meta': {
        const key = (attrs.name || attrs.property || attrs['http-equiv'] || '').toLowerCase();
        if (key === 'viewport') page.meta.viewport = attrs.content || '';
        else if (key === 'description') page.meta.description = squash(attrs.content || '');
        else if (key === 'theme-color') page.meta.themeColor = (attrs.content || '').trim();
        else if (key === 'charset') page.meta.charset = attrs.charset;
        else if (key === 'og:title') page.meta.ogTitle = squash(attrs.content || '');
        else if (key === 'og:image') page.meta.ogImage = (attrs.content || '').trim();
        else if (key === 'og:description') page.meta.ogDescription = squash(attrs.content || '');
        break;
      }
      case 'link': {
        const rel = (attrs.rel || '').toLowerCase();
        if (rel.includes('stylesheet') && attrs.href) page.stylesheets.push(attrs.href);
        else if (rel.includes('icon') && attrs.href) page.icons.push(attrs.href);
        break;
      }
      case 'script':
        if (attrs.src) page.scripts.push({ src: attrs.src, async: !!attrs.async, defer: !!attrs.defer });
        break;
      case 'style':
        page.inlineStyles += 1;
        break;
      case 'a': {
        const href = attrs.href;
        if (href === undefined) break;
        page.links.push({ href, text: '', rel: attrs.rel || null, target: attrs.target || null, ...classifyUrl(href) });
        break;
      }
      case 'img':
        if (attrs.src) {
          page.images.push({
            src: attrs.src, alt: attrs.alt ?? null,
            width: attrs.width ? Number(attrs.width) || null : null,
            height: attrs.height ? Number(attrs.height) || null : null,
            loading: attrs.loading || null,
            ...classifyUrl(attrs.src),
          });
        }
        break;
      case 'form':
        openForm = { action: attrs.action || '', method: (attrs.method || 'get').toLowerCase(), inputs: [] };
        break;
      case 'input':
      case 'textarea':
      case 'select':
        if (openForm) {
          openForm.inputs.push({
            tag: name, type: (attrs.type || (name === 'input' ? 'text' : name)).toLowerCase(),
            name: attrs.name || '', required: attrs.required !== undefined,
          });
        }
        break;
      case 'h1': case 'h2': case 'h3': case 'h4':
        openHeading = { level: Number(name[1]), text: '' };
        page.headings.push(openHeading);
        break;
      case 'header': case 'nav': case 'main': case 'footer': case 'section':
        page.landmarks.push(name);
        openLandmarks.push(name);
        break;
      default:
        break;
    }
  }

  // Fill in link and heading text from the flattened text is not possible
  // without ordering, so the caller re-reads these from the source when it needs
  // the words. What matters for decisions is which URLs are used and how.
  return page;
}

/* ── CSS, for colour and responsiveness ───────────────────────────────────── */

const NAMED_COLOURS = {
  white: '#FFFFFF', black: '#000000', red: '#FF0000', green: '#008000', blue: '#0000FF',
  transparent: null, grey: '#808080', gray: '#808080', silver: '#C0C0C0', orange: '#FFA500',
  brown: '#A52A2A', beige: '#F5F5DC', ivory: '#FFFFF0', navy: '#000080', teal: '#008080',
  olive: '#808000', maroon: '#800000', purple: '#800080', yellow: '#FFFF00', pink: '#FFC0CB',
};

/** Any CSS colour to #RRGGBB, or null when it cannot be understood. */
function normaliseColour(value) {
  const v = String(value || '').trim().toLowerCase();
  if (!v) return null;
  if (v in NAMED_COLOURS) return NAMED_COLOURS[v];
  const hex = /^#([0-9a-f]{3,8})$/.exec(v);
  if (hex) {
    const h = hex[1];
    if (h.length === 3 || h.length === 4) return `#${h.slice(0, 3).split('').map((c) => c + c).join('').toUpperCase()}`;
    if (h.length === 6 || h.length === 8) return `#${h.slice(0, 6).toUpperCase()}`;
    return null;
  }
  const rgb = /^rgba?\(\s*([\d.]+%?)\s*[, ]\s*([\d.]+%?)\s*[, ]\s*([\d.]+%?)/.exec(v);
  if (rgb) {
    const part = (p) => (p.endsWith('%') ? Math.round(parseFloat(p) * 2.55) : Math.round(parseFloat(p)));
    const [r, g, b] = [part(rgb[1]), part(rgb[2]), part(rgb[3])];
    if ([r, g, b].some((n) => !Number.isFinite(n) || n < 0 || n > 255)) return null;
    return `#${[r, g, b].map((n) => n.toString(16).padStart(2, '0')).join('').toUpperCase()}`;
  }
  return null;
}

/** WCAG relative luminance, used for contrast decisions. */
function luminance(hex) {
  const c = normaliseColour(hex);
  if (!c) return null;
  const channels = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16) / 255)
    .map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
  return 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2];
}

/** Contrast ratio between two colours, 1 (identical) to 21 (black on white). */
function contrast(a, b) {
  const la = luminance(a); const lb = luminance(b);
  if (la === null || lb === null) return null;
  const [hi, lo] = la > lb ? [la, lb] : [lb, la];
  return (hi + 0.05) / (lo + 0.05);
}

/** Black or white, whichever reads better on this colour. */
function readableOn(colour) {
  const l = luminance(colour);
  if (l === null) return null;
  return l > 0.35 ? '#000000' : '#FFFFFF';
}

/**
 * Nudge a colour until text in `on` is readable on it.
 *
 * Used when a page's theme colour cannot carry white text: rather than shipping
 * a spec with a contrast failure that the validator would reject, darken (or
 * lighten) the colour in fixed steps and report that it was changed. Predictable
 * and reversible — the original value stays in the findings.
 */
function ensureContrast(colour, on, target = 4.5) {
  let value = normaliseColour(colour);
  const text = normaliseColour(on);
  if (!value || !text) return { colour: value, changed: false };
  if ((contrast(value, text) ?? 0) >= target) return { colour: value, changed: false };

  const towardBlack = (luminance(text) ?? 0) > 0.5;
  for (let step = 1; step <= 20; step += 1) {
    value = shade(value, step * 5, towardBlack);
    if ((contrast(value, text) ?? 0) >= target) return { colour: value, changed: true, steps: step };
  }
  return { colour: towardBlack ? '#000000' : '#FFFFFF', changed: true, steps: 20 };
}

/** Move a colour toward black (darken) or white (lighten) by a percentage. */
function shade(colour, percent, darken = true) {
  const c = normaliseColour(colour);
  if (!c) return colour;
  const target = darken ? 0 : 255;
  const parts = [1, 3, 5].map((i) => {
    const v = parseInt(c.slice(i, i + 2), 16);
    return Math.round(v + (target - v) * (percent / 100));
  });
  return `#${parts.map((n) => n.toString(16).padStart(2, '0')).join('').toUpperCase()}`;
}

/**
 * Read a stylesheet for the decisions the analyser makes: which colours carry
 * the design, what font it asks for, whether it adapts to small screens, and
 * what it loads from where.
 */
function parseCss(css) {
  const text = String(css).replace(/\/\*[\s\S]*?\*\//g, ' ');
  const out = {
    colours: new Map(),        // colour -> how often it appears
    background: [],
    foreground: [],
    fonts: [],
    mediaQueries: [],
    imports: [],
    urlRefs: [],
    // `50vw` has a digit in front of it, which is how a viewport unit is
    // normally written. Requiring a space or bracket before it — which an
    // earlier version did — meant this was false for every real stylesheet.
    hasViewportUnit: /(?:^|[\s(\d.:])(?:vw|vh|vmin|vmax)\b/.test(text),
    hasFlexOrGrid: /\b(?:flex|grid)\b/.test(text),
  };

  for (const m of text.matchAll(/(?<![\w-])(#[0-9a-f]{3,8}|rgba?\([^)]*\)|\b[a-z]{3,20}\b)(?![\w-])/gi)) {
    const colour = normaliseColour(m[1]);
    if (colour) out.colours.set(colour, (out.colours.get(colour) || 0) + 1);
  }
  // A declaration's value may be `rgb(36, 26, 18)`, `#fff`, or `#fff !important`.
  // Splitting on whitespace first — which is what an earlier version did —
  // breaks every functional colour into `rgb(36,` and loses it silently.
  const colourFrom = (value) => normaliseColour(value) || normaliseColour(String(value).trim().split(/\s+/)[0]);
  for (const m of text.matchAll(/(background(?:-color)?)\s*:\s*([^;{}]+)/gi)) {
    const colour = colourFrom(m[2]);
    if (colour) out.background.push(colour);
  }
  for (const m of text.matchAll(/(?<![-\w])color\s*:\s*([^;{}]+)/gi)) {
    const colour = colourFrom(m[1]);
    if (colour) out.foreground.push(colour);
  }
  for (const m of text.matchAll(/font-family\s*:\s*([^;{}]+)/gi)) {
    const first = m[1].split(',')[0].replace(/["']/g, '').trim();
    if (first) out.fonts.push(first);
  }
  for (const m of text.matchAll(/@media([^{]+)\{/gi)) out.mediaQueries.push(squash(m[1]));
  for (const m of text.matchAll(/@import\s+(?:url\()?["']?([^"')]+)["']?\)?/gi)) out.imports.push(m[1].trim());
  for (const m of text.matchAll(/url\(\s*["']?([^"')]+)["']?\s*\)/gi)) out.urlRefs.push(m[1].trim());

  return out;
}

/** The colours a page is built from, most used first. */
function rankedColours(...cssObjects) {
  const total = new Map();
  for (const css of cssObjects) {
    if (!css?.colours) continue;
    for (const [colour, count] of css.colours) total.set(colour, (total.get(colour) || 0) + count);
  }
  return [...total.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([colour, count]) => ({ colour, count }));
}


/* ═══ engine/analyse/site.mjs ═══ */
/**
 * WHAT A SITE IS, AND WHAT APP IT SHOULD BECOME
 * =============================================
 *
 * This module is deliberately pure. It reads a description of a collected site
 * and answers questions about it; it never opens a file, never fetches anything,
 * never reads a clock and never looks at the environment. Everything with a side
 * effect lives in website.mjs next door.
 *
 * The split is not tidiness. The Studio runs in a browser with no filesystem and
 * no network, and it has to give the same answers as the command line. Two
 * implementations of "what does this site become" would drift, and the drift
 * would show up as a person being told one thing on their phone and another by
 * the build — so there is one implementation and both callers use it. It is also
 * why nothing here imports `node:` anything.
 *
 * The rules that shape every choice below:
 *
 *   Deterministic. The same site produces the same specification, byte for byte.
 *   No clock, no randomness, no environment.
 *
 *   Never silently destructive. Bundling a site for offline use means rewriting
 *   URLs that cannot resolve from where the app serves it. Every rewrite is
 *   recorded, and a link to a page that was not collected is reported rather
 *   than quietly left broken.
 *
 *   Say what it cannot do. A form that posts to a server still needs the server.
 *   A page whose words arrive from a fetch will be empty offline. Those are
 *   findings, not failures to hide.
 */


/* ── relative paths, without a path library ───────────────────────────────── */
/*
 * These replace what the path module was doing here, and they are what lets this
 * module run unchanged in a browser. The paths involved are always relative URL
 * paths inside one site, which is a much smaller problem than a general path
 * library: no drives, no absolute roots, no symlinks.
 */

const dirOf = (rel) => {
  const i = String(rel).lastIndexOf('/');
  return i === -1 ? '' : String(rel).slice(0, i);
};

/** Join and normalise, resolving '.' and '..'. */
function joinRel(a, b) {
  const out = [];
  for (const part of `${a || ''}/${b || ''}`.split('/')) {
    if (!part || part === '.') continue;
    if (part === '..') {
      if (out.length && out[out.length - 1] !== '..') out.pop();
      else out.push('..');
    } else out.push(part);
  }
  return out.join('/');
}

/** The path that leads from a directory to a file, walking up as needed. */
function relativeRel(fromDir, target) {
  const from = String(fromDir || '').split('/').filter(Boolean);
  const to = String(target || '').split('/').filter(Boolean);
  let i = 0;
  while (i < from.length && i < to.length && from[i] === to[i]) i += 1;
  const parts = [...Array(from.length - i).fill('..'), ...to.slice(i)];
  return parts.join('/') || to[to.length - 1] || target;
}

/* ── collecting files that are already in memory ──────────────────────────── */

/**
 * The text of a collected asset.
 *
 * A collector decides how its assets are read: one holding the bytes in memory
 * provides `data`, one reading from disk provides `readText`. Nothing here knows
 * which, and nothing here has to.
 */
function assetText(asset) {
  if (asset.readText) return String(asset.readText());
  if (asset.data !== undefined) return String(asset.data);
  return '';
}

const TEXT_ASSET_EXT = new Set(['.css', '.js', '.mjs', '.json', '.svg', '.txt', '.webmanifest']);
const isTextExt = (ext) => TEXT_ASSET_EXT.has(ext);
const byteLength = (data) => (typeof data === 'string' ? new TextEncoder().encode(data).length : (data?.byteLength ?? data?.length ?? 0));
const asText = (data) => (typeof data === 'string' ? data : new TextDecoder().decode(data));

/**
 * Collect a site from files that are already in memory.
 *
 * This is what the Studio uses: a phone can pick files from storage but cannot
 * read a directory path, and the analysis does not care where the bytes came
 * from. It produces the same shape readLocalSite produces, so everything
 * downstream is the same code.
 */
function siteFromFiles(files, { entry = null, rootName = null } = {}) {
  const pages = [];
  const assets = [];
  const skipped = [];
  for (const file of files) {
    const rel = String(file.rel || '').replace(/^\/+/, '');
    const ext = (rel.match(/\.[a-z0-9]+$/i) || [''])[0].toLowerCase();
    if (PAGE_EXT.has(ext)) {
      pages.push({ rel, html: asText(file.data), bytes: byteLength(file.data) });
    } else if (ASSET_EXT.has(ext)) {
      assets.push({
        rel,
        bytes: byteLength(file.data),
        data: file.data,
        readText: isTextExt(ext) ? () => asText(file.data) : undefined,
      });
